t;象征古人智慧……是人类文化宝库中的瑰宝&quot;是比喻论证，锦上添花，不是重点。</p><p>所以全文就一句：甲骨文信息量大、涵盖面广。看哪个选项抓住&quot;多&quot;：</p><ul><li>A&quot;擦亮甲骨瑰宝，传承发展绝学&quot;：&quot;传承、绝学&quot;无中生有，全文没讲要把甲骨传下去、发展什么学问，排除。</li><li>C&quot;记录着殷商时代动人的故事&quot;：&quot;动人故事&quot;无中生有，只说涉猎各方面，没讲&quot;故事&quot;，排除。</li><li>D&quot;是中华优秀传统文化的根脉&quot;：&quot;根脉&quot;指源头根基，原文只讲信息多、价值高，没讲它是源头，排除。</li><li>B&quot;蕴藏了无数民族文化的密码&quot;：&quot;无数&quot;对应&quot;内容丰富、方方面面&quot;，&quot;民族文化&quot;统摄政治王室社会生活等大概念，正是&quot;信息多&quot;的概括，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这道题四个选项方向完全不同（传承/故事/根脉/信息多），抓大方向就行，不必抠&quot;密码&quot;&quot;文化&quot;准不准。判断标准只有一个：文段反复讲的是&quot;多、丰富、方方面面&quot;，哪个选项落在&quot;多&quot;上，哪个就是答案。先抓大，大方向一致了再抠小词。</span></div>"}, {"q_num": 11, "type": "片段阅读-主旨理解", "answer": "A", "analysis_html": "<p>设问锁定&quot;典籍版本&quot;的<strong>两个方面</strong>。首句&quot;典籍版本资源有多种形式。除书籍外，印刷古籍的雕版、简帛、金石器物、石刻碑刻拓本、绘画、纸币、档案及近代各种媒介，均可纳入典籍版本资源的范畴&quot;——注意落点不是&quot;形式多&quot;，而是&quot;<strong>范畴广</strong>&quot;：各种形式都能归进来，讲的是范围多大。接着&quot;从广义上说，凡是能够印证中华文明、以物证史、以物叙史、可直观感受或触摸的实物，都可视作典籍版本资源&quot;——进一步界定资源范畴。后面&quot;是中华文明的&#x27;活化石&#x27;……见证人……实证者……提供一把钥匙……独特优势……发挥重要作用&quot;——讲它的<strong>价值作用</strong>。</p><p>所以前文讲范畴、后文讲价值，正好对应 A 的两空。</p><p>逐项看：</p><ul><li>B&quot;文献属性与社会作用&quot;：&quot;文献&quot;太小，原文是书籍加雕版石刻绘画纸币等一大堆，不止文献，排除。</li><li>C&quot;形式类型与历史意蕴&quot;：前文焦点不是&quot;形式分类&quot;而是&quot;范畴广&quot;，&quot;形式类型&quot;错位；&quot;历史意蕴&quot;也含糊，不如&quot;文化价值&quot;准，排除。</li><li>D&quot;实物来源与优势地位&quot;：&quot;实物来源&quot;无中生有，原文没讲资源怎么来的，排除。</li><li>A&quot;资源范畴与文化价值&quot;：范畴对应前文&quot;均可纳入范畴&quot;，价值对应后文&quot;活化石/钥匙/作用&quot;，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;除…外，还有…均可纳入范畴&quot;这种句式，落点在&quot;范畴广&quot;，不在&quot;形式多&quot;。分清&quot;分类&quot;与&quot;包容&quot;：原文不是把资源分成几类，而是说&quot;只要够得上标准都算资源&quot;，这是范围问题。抓最后一空再回看，前后两段正好一&quot;范畴&quot;一&quot;价值&quot;。</span></div>"}, {"q_num": 12, "type": "片段阅读-主旨理解", "answer": "D", "analysis_html": "<p>中心在尾句的对策。前面铺垫：村落是优胜劣汰、自我生长的过程，我们现在看到的是历史&quot;折叠&quot;后的一个切面；大部分遗留物里隐藏着不同历史阶段的痕迹，要看清楚得把&quot;折叠&quot;展开、重新整理、立体化呈现；所谓&quot;没有特色、没有传统的村落&quot;，其实是信息残缺，但历史印记不会完全消失。到此都在说&quot;村落有信息，但被埋着&quot;。</p><p>尾句提对策：&quot;要发现这些信息，必须通过<strong>长时间的田野调查</strong>，与原住民深入交流，感受他们对艺术的认知与理解，找到他们能接受、认为美的形式，这才是艺术乡建最重要的切入点。&quot;——对策就是<strong>田野调查</strong>。</p><p>逐项看：</p><ul><li>A&quot;历史文化信息亟待发掘整理&quot;：只停在&quot;要发掘信息&quot;，没落到&quot;田野调查&quot;这个具体方法，不够明确，排除。</li><li>B&quot;艺术乡建应以复原村落特色为着力点&quot;：偷换对策，原文的着力点是田野调查，不是&quot;复原特色&quot;，排除。</li><li>C&quot;发现历史细节是振兴传统村落的基础&quot;：同样没落到&quot;田野调查&quot;，把对策换成了&quot;发现细节&quot;，排除。</li><li>D&quot;扎实的田野调查对艺术乡建至关重要&quot;：直接对应尾句&quot;必须通过长时间的田野调查……才是最重要的切入点&quot;，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">尾句对策题，答案就到尾句找那个具体做法。A、C 都停在&quot;前面铺垫&quot;里打转（要整理、要发掘），只有 D 摘出了真正的动作——田野调查。判断是不是&quot;真对策&quot;，看它有没有落到&quot;怎么做&quot;，而不是停在&quot;要做某事/某事重要&quot;。</span></div>"}, {"q_num": 13, "type": "片段阅读-主旨理解", "answer": "D", "analysis_html": "<p>最能体现主旨，要抓尾句的结论。开头用花园类比：你经常用心品鉴，花园就属于你、你就是主人；心不在焉、走马观花，花园永远不属于你——正反两层，都在说&quot;<strong>用心</strong>&quot;。接着用庐山、欧洲举例：心不在焉的人到哪都觉得&quot;没意思&quot;。最后&quot;所以&quot;收结论：热爱城市或故乡、向往远方，关键不在客体怎么样，而在你自己怎么样——要看看自己是否<strong>内心充盈</strong>、是否<strong>做一事专一事</strong>，从而配得上所面对的一景一物。对策就是两个词：<strong>内心充盈＋专一（用心）</strong>。</p><p>逐项看：</p><ul><li>A&quot;此心有安处，他乡亦吾乡&quot;：讲心灵归属、&quot;何处是故乡&quot;，与&quot;充盈、专一&quot;无关，排除。</li><li>B&quot;若有赏花意，无处不芳菲&quot;：只对应&quot;有心欣赏&quot;这一层（近&quot;专一/用心&quot;），漏掉了&quot;内心充盈&quot;这层，片面，排除。</li><li>C&quot;心若空空也，万物皆无趣&quot;：反过来说&quot;心空则无趣&quot;，只对应&quot;充盈&quot;，还缺&quot;专一&quot;，且是反面表述、不够直白，排除。</li><li>D&quot;充实你自己，用心看世界&quot;：&quot;充实&quot;对应&quot;内心充盈&quot;，&quot;用心&quot;对应&quot;做一事专一事/专一&quot;，两句合起来正好覆盖结论的两层，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;是否…是否…&quot;的并列，答案常常是&quot;两面都占&quot;、干扰项&quot;只占一面&quot;。B 只讲&quot;用心&quot;、C 只讲&quot;充盈&quot;，都片面；D 同时囊括&quot;充实＋用心&quot;才完整。做题先认出并列表述，再对照选项有没有把两面都收进去。</span></div>"}, {"q_num": 14, "type": "片段阅读-主旨理解", "answer": "D", "analysis_html": "<p>设问问&quot;作者对屏摄的态度&quot;。先把材料捋一遍：下定义（屏摄是拍屏幕画面）——客观陈述；放映前银幕会放拒绝屏摄的引导片，但对日益泛滥的行为似乎无济于事——这是<strong>影院</strong>在劝阻、效果不佳；明知会干扰他人观看体验、但不用付代价，不少人仍用屏摄留&quot;在场&quot;证明——这是<strong>观众</strong>的选择；片方明确说&quot;不&quot;并付诸行动的情形少见，更多是睁一只眼闭一只眼、态度模棱两可；当前电影宣发下沉、短视频成主阵地，这种屏摄反而像&quot;自来水&quot;在给宣发发电，是片方乐见的——这是<strong>片方</strong>的态度。全文把影院、观众、片方三方的行为摆了一遍，<strong>作者自己从头到尾没表态</strong>支持谁、反对谁。</p><p>逐项看：</p><ul><li>A&quot;勉强接受&quot;：那是片方的态度（模棱两可又乐见），不是作者的态度，张冠李戴，排除。</li><li>B&quot;坚决反对&quot;：作者没有任何&quot;反对&quot;的表态，排除。</li><li>C&quot;欣然认同&quot;：作者也没说&quot;认同&quot;，排除。</li><li>D&quot;未置可否&quot;：作者只做了客观陈述、未亮明立场，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">态度题先分清&quot;谁的态度&quot;。文段里出现的不满、默许、&quot;说不&quot;都是<strong>第三方</strong>（影院/观众/片方）的态度，作者只是把它们写出来、没加一句&quot;我认为&quot;。判断作者态度，就找&quot;我认为/应该/可见&quot;这类表态词——没有，就是未置可否。</span></div>"}, {"q_num": 15, "type": "片段阅读-主旨理解", "answer": "D", "analysis_html": "<p>这道题容易看走眼，因为尾句&quot;人民城市建设&#x27;工笔画&#x27;的落笔&quot;太像总句，其实它前面的东西更准。开头用三个画面引出&quot;街头巷尾的暖心设施&quot;：司机之家、骑手驿站、母婴室，看似不起眼，却绘就充满温度的民生画卷——注意&quot;<strong>看似不起眼却有用</strong>&quot;这个表述，点明这些设施都是<strong>小东西、小细节</strong>。后面&quot;这些位于城市角落的公共设施，背后是保障改善民生的持续发力……瞄准特定群体的急难愁盼，在街头巷尾见缝插针……让快递小哥吃口热饭、让老人孕妇便捷出行、让街坊邻居有地休憩&quot;——处处落在&quot;细微处、小地方&quot;。尾句收束：&quot;这些细微处，体现着城市的温度，恰恰是人民城市建设&#x27;工笔画&#x27;的落笔。&quot;核心是：<strong>城市的温度，来自对个体细微需求的细致关照</strong>。</p><p>逐项看：</p><ul><li>A&quot;特定群体需求应得到广泛关注&quot;：方向对但不精准，文段说的是小方面、细微需求，不是整个群体的&quot;所有需求&quot;，排除。</li><li>B&quot;暖心设施是保障民生的重要体现&quot;：只讲了设施本身重要，没点出&quot;细微处、温度&quot;这层，不够，排除。</li><li>C&quot;人民城市建设需聚焦急难愁盼精准发力&quot;：最像尾句总结，但&quot;急难愁盼&quot;是<strong>特定人群</strong>的（快递小哥、老人孕妇），是些小需求，C 泛化成&quot;聚焦群众急难愁盼&quot;，不精准，排除。</li><li>D&quot;城市的温度源于对个体细微需求的细致关照&quot;：把&quot;细微处体现温度&quot;直接说出来，最准，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;精准题&quot;要选比&quot;对但不准&quot;更贴的。A、B、C 都&quot;没错&quot;，但都漏掉了文段反复强调的&quot;<strong>细微处、小方面</strong>&quot;；D 恰恰把这个限定补上了。看到&quot;看似不起眼&quot;&quot;细微处&quot;&quot;见缝插针&quot;这类词，就要意识到文段在强调&quot;小、细&quot;，答案也得带上这层限定。</span></div>"}, {"q_num": 16, "type": "片段阅读-主旨理解", "answer": "B", "analysis_html": "<p>开头摆一种论调：灵活就业门槛过低、技能要求不高，年轻人投身是短视行为，不利于人力资本积累。然后&quot;但事实上&quot;转折反驳：&quot;灵活就业进入的门槛确实不高，但要<strong>留存的门槛</strong>却并不低，也需要一定的技能支撑，灵活就业并不一定意味着&#x27;低能&#x27;。&quot;——核心是<strong>反驳&quot;灵活就业低门槛＝低能&quot;的偏见</strong>：进来容易，留下难，得靠技能。</p><p>逐项看：</p><ul><li>A&quot;并非所有灵活就业都是低门槛&quot;：不够精准。原文没说&quot;有的灵活就业门槛高&quot;，说的是&quot;进入门槛不高、留存门槛不低&quot;，重心在&quot;留存&quot;，A 没抓住，排除。</li><li>C&quot;灵活就业在职越久越要技能傍身&quot;：&quot;越…越&quot;是常见的挖坑标志，原文只说&quot;需要技能支撑&quot;，没说&quot;时间越久越需要&quot;，无中生有的递进，排除。</li><li>D&quot;年轻人对灵活就业无须过度忧虑&quot;：主体错——忧虑的是社会上&quot;有人认为&quot;，不是年轻人自己在忧虑；年轻人在文段里是论调的对象，不是忧虑的发出者，排除。</li><li>B&quot;应摒弃对灵活就业形式的偏见&quot;：把&quot;反驳错误论调&quot;翻译成&quot;摒弃偏见&quot;，同义替换，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">转折题要分清&quot;谁的观点&quot;：前文的论调是&quot;社会上有人认为&quot;，后面&quot;但事实上&quot;才是作者的判断。另外盯死三个坑——主体错（D 把忧虑安到年轻人头上）、&quot;越…越&quot;乱加递进（C）、重心错位（A 丢掉&quot;留存&quot;）。这些都在选项对比里立现。</span></div>"}, {"q_num": 17, "type": "片段阅读-主旨理解", "answer": "C", "analysis_html": "<p>开头是个例子：美国一位机器人专家用面部表情识别软件，让机器人教自闭症儿童学社会行为，检测到&quot;愤怒&quot;表情就调整动作平息局面。这个例子本身不重要，重要的是她紧接着的评价：&quot;的确，我们都是独一无二的。<strong>但事实上，人与人之间的差异也没有那么大。</strong>&quot;再往后推结论：&quot;因此，对于广义的情感来说，这些情感 AI 的判断也许不总是正确的，但并不只是碰巧对了，与随机相比，它们正确的可能性要更大些。&quot;——逻辑链是：人与人（尤其面部表情）其实有共通性 → 所以 AI 按共通的规律去判断有依据、不是瞎蒙。核心落点：<strong>面部表情是人与人通用的情感语言</strong>。</p><p>逐项看：</p><ul><li>A&quot;情感AI能够准确分析人类面部表情&quot;：与原文相悖，原文说&quot;也许不总是正确&quot;，只是比随机强，不是&quot;准确&quot;，排除。</li><li>B&quot;面部表情在不同文化中存在很大差异&quot;：与&quot;差异没那么大&quot;直接相反，排除。</li><li>D&quot;没有确凿证据证明面貌可以反映内在感受&quot;：原文没讨论这一点，无关，排除。</li><li>C&quot;面部表情不失为一种人类通用的情感语言&quot;：正因为人与人表情差异不大、有共性，AI 才能依据它判断——C 说出了 AI 判断能成立的依据，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;例子＋此人评论&quot;题，答案在<strong>评论的话里</strong>，尤其&quot;但事实上&quot;转折后的那一句。抓转折，&quot;差异没那么大&quot;→&quot;有共性&quot;→&quot;通用&quot;，方向就定了；再把&quot;准确&quot;&quot;差异大&quot;这些相悖项快速排掉，即便 C 没提 AI 也能锁定。</span></div>"}, {"q_num": 18, "type": "片段阅读-细节判断", "answer": "D", "analysis_html": "<p>这题考用成语概括文意，先把内核读出来。多少干部倒在&quot;大节&quot;&quot;小节&quot;的认识误区里，以为&quot;出点小问题是难免的，只要干事业就大节不亏&quot;；接着反驳：&quot;从来没有不起眼的蚁穴，只有守不住的长堤，丢了清正，何以有为？这两者没有&#x27;大&#x27;&#x27;小&#x27;之分。&quot;——蚁穴虽小能溃长堤，小节失守会毁大节，核心是：<strong>小问题放任不管，积少成多会酿成大祸（坏事）</strong>。</p><p>再比对两个近义成语：</p><ul><li>B&quot;积微成著&quot;和 D&quot;积羽沉舟&quot;都是&quot;小积累变大&quot;，差别在<strong>褒贬</strong>。积微成著是好的积累（学习、修行一点点攒成正果），偏褒义；积羽沉舟说羽毛虽轻、积多了也能压沉船，是<strong>坏的积累酿灾难</strong>，正合文段&quot;小毛病积累成大祸&quot;的语境，选 D。</li><li>A&quot;惩前毖后&quot;（惩处从前过错、警示以后）和 C&quot;正本清源&quot;（从根源上整治）——文段根本没提&quot;惩处警示&quot;&quot;治标治本、源头&quot;，都排除。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">近义成语靠&quot;褒贬＋方向&quot;区分：文段里小节的积累是往坏处走（蚁穴溃堤），要选表达&quot;坏事积累&quot;的<strong>积羽沉舟</strong>，不能选偏褒义的<strong>积微成著</strong>。这类词义辨析，先把文段的感情倾向定下来，再对应成语的好/坏属性。</span></div>"}, {"q_num": 19, "type": "片段阅读-细节判断", "answer": "C", "analysis_html": "<p>找作者的观点，先看转折。&quot;社会普遍认为，教育的首要且核心任务是传授知识……&quot;这是<strong>他人观点（社会普遍认识）</strong>；&quot;然而&quot;一转，&quot;深入探究教育的本质，我们会发现它远不止于知识的堆砌，它更是塑造人格、培养创新能力和批判性思维的重要途径&quot;——这才是作者的判断：<strong>教育不止传知识，还有人格、能力、思维等多方面价值</strong>。后面的&quot;众多教育学家所强调的&quot;是例子，略过。核心是&quot;<strong>教育的多维价值</strong>&quot;。</p><p>逐项看：</p><ul><li>A&quot;作者认为教育应优先关注知识传授&quot;：那是社会普遍观点，是作者要纠正的对象，方向反了，排除。</li><li>B&quot;作者反对社会普遍的认识&quot;：第一，&quot;反对&quot;太重，原文是&quot;不止于&quot;（不全面、不够），不是全盘否定；第二，B 连&quot;教育&quot;都没点，没落到教育上，排除。</li><li>D&quot;作者认为教育目的在于培养独立思考能力&quot;：把&quot;人格、创新能力、批判性思维&quot;概括成&quot;独立思考&quot;太乱，属于例子里的局部，不全，排除。</li><li>C&quot;作者强调教育的多维价值&quot;：&quot;多维价值&quot;统摄&quot;知识之外还有人格、能力、批判性思维&quot;，准确且完整，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;社会认为……然而……&quot;的套路，答案在&quot;然而&quot;后面。注意别把&quot;作者纠正他人观点&quot;等同于&quot;作者反对&quot;——原文说&quot;不止于&quot;，是&quot;不完整、要补充&quot;，说&quot;反对&quot;就过头了。抓作者正面提出的东西（多维价值）来选，比抓&quot;反对谁&quot;更稳。</span></div>"}, {"q_num": 20, "type": "片段阅读-主旨理解", "answer": "B", "analysis_html": "<p>最后一道，重点在后面。开头下定义：&quot;种子休眠，是指种子具备水分温度和光照等发芽条件时仍暂不萌发、待环境安全才生长的特性&quot;——引出话题；接着讲它的两面性：休眠期过短，种子易在田间或穗上遇雨提前发芽；过长又影响下茬播种和出苗整齐——这些是<strong>问题/背景</strong>，作用是引出后面的研究。真正的新发现在最后：&quot;科研人员发现一个名为 MKK3 的基因，通过&#x27;拷贝数＋激酶活性&#x27;双轮驱动调控自身基因活性，精准控制大麦种子的休眠时间……进而决定作物种子的休眠时间。&quot;核心是：<strong>科学家发现了控制种子休眠时间的开关（MKK3 基因）</strong>。</p><p>逐项看：</p><ul><li>A&quot;种子休眠是农作物的典型生物学特性&quot;：只是开头的下定义，引出话题，不是发现，排除。</li><li>D&quot;休眠期过短或过长均影响作物生长&quot;：是前面摆的问题，引出研究的由头，不是重点，排除。</li><li>C&quot;&#x27;拷贝数＋激酶活性&#x27;能够调整MKK3基因&quot;：看似具体，但它是&quot;发现内容的一部分&quot;——发现了 MKK3 能控休眠，C 只说清了机制里一个小环节，体现不出&quot;发现了什么&quot;，不完整，排除。</li><li>B&quot;科学家已寻找到控制种子休眠时间的开关&quot;：把&quot;MKK3 通过双轮驱动精准控制休眠时间&quot;概括成&quot;找到控制休眠的开关&quot;，是全文发现的完整概括，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;研究发现&quot;类题，答案要落在&quot;<strong>发现了什么</strong>&quot;这个完整结论上，而不是机制里的某个零件。C 看着又具体又专业，其实只是发现里的一截；B 用&quot;开关&quot;这个比喻把&quot;MKK3 能控休眠&quot;这个完整发现说出来。具体不等于正确，完整才对。</span></div>"}]}, {"set_num": 5, "set_name": "拔高刷题五", "questions": [{"q_num": 1, "type": "片段阅读-细节判断", "answer": "A", "analysis_html": "<p>先看设问——&quot;可以推出的是&quot;，这是一道细节推断题，问的是哪个选项能<strong>必然</strong>从文段推出来，不是找原文照抄，而是要&quot;择优&quot;。</p><p>顺着文段读。开头点出现象：提笔忘字、提笔忘词时有发生，原因很多。后面用两条线展开原因——第一条线，移动互联网时代不少人爱刷短视频、阅读量减少、只愿浅阅读碎片化浏览，缺乏系统深入的严肃阅读，还过度依赖网络，写文章遇到词就上网搜，缺深度思考、不追求精细表达；第二条线用&quot;此外&quot;并列：线上社交让人习惯浅白口语和表情包传情达意，少了严肃规范表达的机会，很多词因极少用到被抛之九霄云外。合起来一句话：<strong>表达退化，根子在&quot;短平快&quot;的阅读和表达习惯</strong>。</p><p>对照选项：</p><ul><li>C&quot;互联网使人们表达、思维方式发生剧烈变革&quot;：几个毛病。&quot;剧烈变革&quot;程度太重，文段讲的是&quot;退化、下滑&quot;，没说天翻地覆；&quot;思维方式&quot;文段根本没谈思维怎么变；而且&quot;互联网&quot;只是背景，真正的原因是浅阅读碎片化，用&quot;互联网&quot;概括不精准，排除。</li><li>D&quot;人工智能过度发展引发思维认知问题&quot;：无中生有，全文只有&quot;上网搜索&quot;，压根没提人工智能，排除。</li><li>B&quot;语言是国家文化生命力传播影响力基础&quot;：无中生有，&quot;国家文化&quot;全文没沾边，排除。</li><li>A&quot;人们表达能力的退化与追求&#x27;短平快&#x27;节奏有关&quot;：提笔忘字忘词即表达能力退化，&quot;短平快&quot;正好统摄浅阅读、碎片化、不深度思考，同义替换到位，唯一必然能推，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">细节推断题不是无脑对应，而是&quot;择优&quot;：C 看似沾边，但&quot;剧烈变革&quot;过重、&quot;互联网&quot;太宏观；A 用&quot;短平快&quot;总括全部原因，最精确、最必然。记住&quot;短平快&quot;在文中对应&quot;浅阅读、碎片化、不想深度思考&quot;。</span></div>"}, {"q_num": 2, "type": "片段阅读-细节判断", "answer": "B", "analysis_html": "<p>先看设问——&quot;与上文意思<strong>不相符</strong>的是&quot;，选错，读的时候心里挂个&quot;叉&quot;。</p><p>材料有点绕，抓大方向：银发一族在数字时代遇到融入障碍，产生老年数字鸿沟，进而变成代际数字鸿沟、数字贫困的&quot;马太效应&quot;。然后引出<strong>数字反哺</strong>——它来源于文化反哺，是子代帮亲代跨越数字接入、使用、素养上的障碍，做知识教辅与传递。再往后，数字反哺让家庭权力关系变了：掌握<strong>时势权力</strong>的子代冲击掌握<strong>教化权力</strong>的亲代，产生代际隔阂，影响权力<strong>转置</strong>与地位流变。翻成大白话就是：以前父母教孩子、当老大，现在孩子长大了、反过来教父母，家里的地位悄悄换了。</p><p>对照选项：</p><ul><li>A&quot;亲代受困于数字时代的社会交往，子代的数字反哺应运而生&quot;：正对应&quot;老人有数字障碍→子代反哺帮老人&quot;，正确。</li><li>C&quot;数字反哺在一定程度上能够弥合代际间的数字鸿沟&quot;：数字反哺本来就是来解决亲代数字障碍的，正确。</li><li>D&quot;数字反哺的过程中，亲代的传统教化权力被动消解&quot;：与&quot;时势上升、教化下降&quot;的&quot;权力转置&quot;对应，正确。</li><li>B&quot;教化权力与时势权力此消彼长，文化反哺的重要性逐渐弱化&quot;：前半句&quot;此消彼长&quot;对，但后半句&quot;文化反哺重要性弱化&quot;纯属无中生有——文段只说两种<strong>权力</strong>变了，没说<strong>文化反哺的重要性</strong>变弱，半对半错，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">长难文段不要逐词抠，抓&quot;老人在数字上受困→孩子反哺→家里地位变了&quot;这条主线即可，答案一般只考大方向。B 的坑是&quot;半对半错&quot;：前半句有原文支撑，后半句被塞进了原文没有的&quot;重要性弱化&quot;。拆开逐字对，尤其盯住后半句。</span></div>"}, {"q_num": 3, "type": "片段阅读-细节判断", "answer": "B", "analysis_html": "<p>先看设问——&quot;与文意<strong>不相符</strong>的是&quot;。这题可以先扫选项预判：B&quot;消费者的自觉维权是重要的<strong>监管途径</strong>&quot;读着就别扭——维权是消费者维护自身权益，跟&quot;监管&quot;不搭，监管本该是消协、政府部门的事，先对它打个问号。</p><p>再读材料：现实打假维权中，消费者经常干着急（处在弱势），消费者协会却相对<strong>缺位</strong>（该站出来没站出来）；2014 年新修订的《消费者权益保护法》施行，一个亮点是&quot;消费者协会有职责就损害消费者合法权益的行为，支持受损的消费者提起诉讼或者依照本法提起诉讼&quot;；这条法律对有明确损害的消费者<strong>具有可操作性</strong>，但对那些消费者认为不值得诉讼的<strong>小额消费损害</strong>无能为力。</p><p>对照选项：</p><ul><li>A&quot;打假维权需要消费者协会的有力监管&quot;：对应&quot;消协缺位→该动起来+新法赋予它支持起诉的职责&quot;，正确。</li><li>C&quot;诉诸法律是消费者维护权益的有效途径&quot;：对应&quot;支持你提起诉讼、依本法维权&quot;，正确。</li><li>D&quot;法律的完善使消费者维权具有可操作性&quot;：对应&quot;新修订的法律→具有可操作性&quot;，正确。</li><li>B&quot;消费者的自觉维权是重要的监管途径&quot;：张冠李戴。维权是维权、监管是监管，把&quot;监管&quot;安到消费者头上，文段完全没说，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">用&quot;缺位&quot;反推就是&quot;该站出来监管&quot;，所以 A 成立；而 B 把维权者当作监管者，主体错位。小额损害&quot;无能为力&quot;跟&quot;有可操作性&quot;不冲突——法律给了你维权依据，维不维、值不值是成本问题。别把前一句的作用和后一句的现实局限搅在一起。</span></div>"}, {"q_num": 4, "type": "片段阅读-细节判断", "answer": "A", "analysis_html": "<p>先看设问——&quot;可以推断出如今生鲜乳怎样&quot;，注意&quot;如今&quot;两个字，问的是<strong>当下</strong>的供求状态，不是未来。</p><p>顺着文段抓信号：2022 年我国人均奶类消费约 43 公斤，比 2010 年提高 48.3%，但<strong>仍远未达到</strong>《中国居民膳食指南》推荐标准，只有世界平均水平的 1/3——这是说<strong>消费（需求）还少</strong>。接着&quot;业内普遍认为牛奶消费潜力巨大&quot;&quot;养殖场户积极投资是看好消费需求&quot;&quot;今年消费有望较大增长&quot;&quot;生育政策优化、老龄人口增长拉动需求&quot;，全都在说<strong>需求有潜力、还没释放</strong>。最后一句话最关键：<strong>&quot;生鲜乳供需不平衡问题将会改善&quot;</strong>。</p><p>这里做个推理：既然需求拉高之后&quot;供需不平衡会改善&quot;，说明当下是&quot;供多于求&quot;。反过来想，如果现在&quot;供不应求&quot;，需求再往上拉只会更缺，谈不上&quot;改善&quot;。所以关键在于抓住&quot;如今&quot;与&quot;未来&quot;的差异。</p><p>对照选项：</p><ul><li>A&quot;供过于求&quot;：需求少→供应多，选 A。</li><li>B&quot;供不应求&quot;：方向说反，排除。</li><li>C&quot;供求平衡&quot;：现在是&quot;不平衡&quot;，&quot;改善&quot;指未来变好，不是已达平衡，排除。</li><li>D&quot;价格均衡&quot;：无中生有，全文没谈价格，排除。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;如今&quot;是这道题的钥匙：所有&quot;看好&quot;&quot;有望&quot;&quot;潜力&quot;都指向<strong>未来</strong>，恰恰反证<strong>当下需求不足</strong>。潜在需求≠当下需求，养殖户是因为看好未来才投资。另外&quot;改善&quot;不等于&quot;解决/平衡&quot;，别把未来的状态提前套到今天。</span></div>"}, {"q_num": 5, "type": "片段阅读-细节判断", "answer": "C", "analysis_html": "<p>先看设问——&quot;理解<strong>不正确</strong>的是&quot;。可以先凭常识预判：C&quot;环境条件改变后桦尺蛾<strong>改变体色</strong>以适应新环境&quot;，像&quot;用进废退&quot;式的主动变色，而自然选择的标准表述应是&quot;适者生存&quot;，先打个问号。</p><p>顺着文段读。19 世纪英国曼彻斯特郊外森林里长满灰色地衣，颜色相近的桦尺蛾停息在上面、难被鸟发现，于是格外繁盛（这时灰色蛾是优势）。20 世纪该地区变成工业区，工业化的副作用破坏了地衣层，黑树干更多暴露，浅色蛾因体色对比鲜明被鸟当作&quot;饕餮大餐&quot;吃掉，原本罕见的<strong>黑色蛾</strong>反而成了优势群体——这就是&quot;工业黑化&quot;，达尔文用来解释自然选择学说的重要案例之一。</p><p>对照选项：</p><ul><li>A&quot;黑色桦尺蛾成为优势群体是自然选择的结果&quot;：原文明说工业黑化是自然选择的案例，正确。</li><li>B&quot;曼彻斯特 19 世纪的黑色桦尺蛾比 20 世纪少&quot;：19 世纪灰色蛾多、黑色蛾少，20 世纪黑色蛾多，正确。</li><li>D&quot;在不同环境中生活着的桦尺蛾保护色是不同的&quot;：灰树下灰蛾活、黑树下黑蛾活，正确。</li><li>C&quot;环境条件改变后桦尺蛾改变体色以适应新环境&quot;：偷换机制。不是<strong>蛾自己变色</strong>去适应，而是不同体色的个体被环境<strong>淘汰或保留</strong>（灰蛾被吃、黑蛾存活繁衍），个体不会自我变色，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">C 把&quot;自然选择（群体里不同个体被筛选）&quot;说成&quot;个体主动改变体色适应&quot;。做题时记住：自然选择是&quot;本来就有各种体色，环境挑出最适应的&quot;，不是&quot;个体自我改造&quot;。&quot;工业黑化是自然选择的案例&quot;是原文原话，别去怀疑它算不算自然选择。</span></div>"}, {"q_num": 6, "type": "片段阅读-细节判断", "answer": "D", "analysis_html": "<p>先看设问——&quot;与文意<strong>不符</strong>的是&quot;。</p><p>材料讲&quot;推文视频&quot;：短视频平台上，&quot;跑酷&quot;游戏、切肥皂、做蛋糕等解压画面，搭配由网络小说文字自动生成的 AI 配音，机械单一却很流行。为什么爱看？&quot;事实上&quot;引出原因：大脑中的感觉区域相互影响，听觉刺激可能引发视觉区域的活动，反之亦然；这种交叉影响让人调动多个感官，体验更复杂、立体、生动。当大脑默认视觉处于&quot;放空&quot;解压状态，也许<strong>听觉</strong>就会因此变得灵敏。</p><p>对照选项：</p><ul><li>A&quot;推文视频制作简单，主要内容由 AI 生成&quot;：&quot;机械单一&quot;+&quot;一个画面+AI 配音&quot;就是制作简单；配音内容是 AI 生成的，正确。</li><li>B&quot;推文视频结合了视觉和听觉的多重元素&quot;：画面是视觉、小说配音是听觉，后文&quot;视听交叉影响&quot;也在说这点，正确。</li><li>C&quot;大脑中感觉区域相互影响，使体验更生动&quot;：直接对应&quot;交叉影响→体验更复杂立体生动&quot;，正确。</li><li>D&quot;人们在看推文视频时，听觉比视觉更灵敏&quot;：强加比较。原文只说<strong>听觉自己</strong>变得灵敏（和平时比），没说听觉比视觉强，两个维度的&quot;比较&quot;原文没有，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">D 的坑在&quot;比&quot;字：原文是&quot;听觉(自己)变得灵敏&quot;，是纵向的&quot;现在的听觉 vs 平常的听觉&quot;；D 偷成&quot;听觉 vs 视觉&quot;的横向比较。凡是选项里冒出&quot;比&quot;&quot;更&quot;的对比，先回去核对原文有没有这两者之间的比较，没有就是强加比较。</span></div>"}, {"q_num": 7, "type": "片段阅读-细节判断", "answer": "A", "analysis_html": "<p>先看设问——&quot;理解<strong>错误</strong>的一项&quot;。这道题偏难，A 和 B 都有点瑕疵，得对比谁更错。</p><p>先读材料：城市精神与文化最终要落实在人身上，人的文化素养与精神境界<strong>直接影响</strong>城市的品质与风貌；人与城市互为表里、相辅相成；不断提升人的素养，才能提升城市的精神高度与文化海拔；说到底，<strong>重视城市精神的建设，其实关系着城市建设的最终归宿</strong>。</p><p>先排两个确定的：</p><ul><li>D&quot;人与城市是互为表里，相辅相成的&quot;：原文原句，正确。</li><li>C&quot;城市的精神文化有赖于人的精神文化&quot;：全文就是&quot;城市靠人&quot;（落实在人、提升人才提升城市），正确。</li></ul><p>剩下 A、B 对比：</p><ul><li>B&quot;城市精神与文化直接影响着城市的品质与风貌&quot;：原文说的是&quot;<strong>人的</strong>素养直接影响&quot;，城市精神文化是&quot;落实在人身上&quot;再去影响，似乎多了一步&quot;间接&quot;。但把城市（宏观）与人（具体）看成一体两面，城市精神恰恰是靠人来体现的，说&quot;直接&quot;也圆得通，<strong>有解释空间</strong>。</li><li>A&quot;城市建设的最终归宿是城市精神的建设&quot;：尾句说&quot;重视城市精神建设，<strong>关系着</strong>最终归宿&quot;。&quot;关系着/影响着&quot;≠&quot;就是/等于是&quot;。A 把&quot;重视 X 关系着 Y&quot;偷换成&quot;X 就是 Y&quot;，是硬伤，补不回来，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">当两个选项都对不上原文时，选<strong>完全没有解释空间</strong>的那一个。B 能通过&quot;宏观城市精神=具体人的精神（一体两面）&quot;找补回来，A 的&quot;关系着→等于&quot;是包不住的硬伤。抓&quot;关系着、影响&quot;这类词时，一律别把它们当成&quot;等于&quot;。</span></div>"}, {"q_num": 8, "type": "片段阅读-细节判断", "answer": "C", "analysis_html": "<p>先看设问——&quot;说法<strong>正确</strong>的是&quot;。这题可以先用常识扫选项：B 的&quot;从来都&quot;、D 的&quot;即为&quot;、A 的&quot;密不可分&quot;都透着一股绝对化，C 语气柔和，先对它有好感。</p><p>读材料：森林荣枯引起人的心灵震动，凝聚感伤与愉悦的情感模式，森林的悲欢影响人类情感的起伏；士大夫的感物吟志、触时伤怀常与树木荣枯相联；草木荣枯每每引发古代诗人的生命情怀——有&quot;木欣欣以向荣&quot;（对树木峥嵘的欢心），有&quot;悲哉，秋之为气也&quot;（对草树凋零的感伤）；柔条之喜与落叶之悲<strong>揭示</strong>了中国文人的情感模式，这种模式正是森林带给人的心灵反应。</p><p>对照选项：</p><ul><li>A&quot;人类情感起伏与森林悲欢相伴相生，密不可分&quot;：太绝对。原文只说&quot;有关联、有影响&quot;，没说人的情感全系于森林，排除。</li><li>B&quot;士大夫的感物吟志、触时伤怀从来都源于生命情怀&quot;：&quot;从来都&quot;绝对化，伤怀可以因官场沉浮、文学境遇等多端，不一定都是生命情怀，排除。</li><li>D&quot;中国文人被森林的悲欢催生的情感模式即为柔条之喜与落叶之悲&quot;：&quot;即为&quot;划了等号，柔条之喜与落叶之悲只是&quot;揭示&quot;情感模式的两个<strong>例子</strong>，不能说情感模式就这俩，排除。</li><li>C&quot;对树木峥嵘的欢心和草树凋零的感伤体现出古代诗人的生命情怀&quot;：对树长者欢欣、对凋零者感伤正是情感模式的两个体现，用它来&quot;体现&quot;情怀语气柔和、位置正确，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">绝对化词是&quot;选正确项&quot;的高频坑：&quot;从来都&quot;&quot;密不可分&quot;&quot;即为&quot;&quot;就是&quot;。C 用的是&quot;体现出&quot;这类温和的词，正确概率最高。先排掉语气绝对、把例子当全部的选项，答案基本就浮出来了。</span></div>"}, {"q_num": 9, "type": "片段阅读-细节判断", "answer": "D", "analysis_html": "<p>先看设问——&quot;与原文意思<strong>相符</strong>的是&quot;。</p><p>材料说，&quot;雨果奖&quot;得主海漄获奖前是标准的银行打工人，过着普通社畜的庸常生活，朝九晚五、平平无奇；有人好奇：在常规工作的桎梏下，创造与艺术的灵性是否更容易被激发？后文这么回答——写作与其他需要固定时间投入的工作没有本质区别，都需要持续、有规律、有计划的长期投入；更重要的是，真实生活是创作的恒久源泉，上班族贴近最大基数普通人的生活常态，与大众思考逻辑一致，能最大程度保障创作核心稳固。</p><p>关键在读懂作者的态度：他<strong>根本没正面回答</strong>&quot;工作是否激发创作&quot;，反而在说&quot;创作靠时间投入和贴近真实生活，跟你干哪行无关&quot;。</p><p>对照选项：</p><ul><li>A&quot;海漄的获奖得益于将平平无奇的庸常生活升华为艺术&quot;：无中生有，后文只说&quot;生活是源泉&quot;，没提把生活&quot;升华成艺术&quot;，排除。</li><li>B&quot;朝九晚五的工作有助于长期持续投入创作&quot;：强加因果。朝九晚五只是作者的工作状态，跟&quot;长期投入&quot;没有因果关系，排除。</li><li>C&quot;枯燥乏味的工作岗位更容易激发创造与艺术的灵性&quot;：无中生有且过度。后文压根没回答&quot;枯燥是否更易激发&quot;，只说与工作无关，排除。</li><li>D&quot;循规蹈矩的常规工作未必扼杀人的创造力&quot;：海漄正是在常规工作中获奖，&quot;工作不影响创作、不扼杀创造力&quot;，语气中性、不夸大，选 D。</li></ul>"}, {"q_num": 10, "type": "片段阅读-细节判断", "answer": "D", "analysis_html": "<p>先看设问——&quot;符合这段文字&quot;的一项是，选对。</p><p>材料很短却很绕：物候是受环境影响出现的、以年为周期的自然现象。时间与节气虽能比较准确地反映天气、气候的变化规律，但<strong>一旦固定下来就难免与实际发生偏差</strong>；在此情况下，物候往往能<strong>更准确</strong>地反映天气、气候的<strong>实际变化</strong>；所以农书在指出作物某时节播种时，也会附上物候指标。</p><p>逐项拆解：</p><ul><li>A&quot;时间周期难以准确反映气候变化规律&quot;：说反了。原文是&quot;能比较准确反映规律&quot;，只是&quot;会与实际有偏差&quot;，不是&quot;难以准确&quot;，排除。</li><li>B&quot;物候指标是指导农业实践的唯一标准&quot;：&quot;唯一&quot;绝对化。农书是把物候<strong>附在</strong>节气旁边作补充，不是唯一标准，排除。</li><li>C&quot;节气和物候指标均反映天气变化规律&quot;：偷换。节气反映&quot;规律&quot;，物候反映&quot;实际变化（时序变化）&quot;，两者反映对象不同，不能都说&quot;规律&quot;，排除。</li><li>D&quot;节气是固定的，物候指标不是固定的&quot;：节气&quot;固定下来就有偏差&quot;，而物候&quot;能更准确反映实际&quot;，说明物候不固定，正是这层对比，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">C 藏在两个小词里：节气对应&quot;规律&quot;、物候对应&quot;实际/时序变化&quot;，一个是规律、一个是现实，不能混为一谈。&quot;唯一&quot;是标签词，基本见到就警惕。做这类题可以把&quot;物候、节气&quot;当 X、Y 看它们各自的谓语，别纠结名词本身是什么。</span></div>"}, {"q_num": 11, "type": "片段阅读-细节判断", "answer": "D", "analysis_html": "<p>先看设问——&quot;说法<strong>错误</strong>的是&quot;。</p><p>材料是脑科学：人脑中的 IPN 神经元接收来自 MHb 和前脑、中脑各区的信息，再经内部微环路整合，传递给下游 NI。IPN-NI 环路不仅能<strong>放大恐惧反应、增强回避行为</strong>，还参与<strong>药物戒断相关的厌恶反应</strong>。与杏仁核这个&quot;情绪生产者&quot;不同，IPN-NI 环路并不直接产生厌恶情绪，而是厌恶反应的<strong>放大器</strong>，能灵活精确地调节，为治疗精神疾病及药物戒断提供了新的<strong>潜在</strong>治疗靶点。</p><p>逐项核对：</p><ul><li>A&quot;杏仁核与人的情感情绪反应相关&quot;：它本身就是&quot;情绪生产者&quot;，必然相关，正确。</li><li>C&quot;IPN-NI 环路能参与药物戒断相关的厌恶反应&quot;：原文&quot;还参与药物戒断相关的厌恶反应&quot;，正确。</li><li>B&quot;恐惧情绪会让人类对某些事物产生回避&quot;：原文说环路&quot;放大恐惧+增强回避&quot;。恐惧与回避看似并列，但从常识看内在恐惧会外化为回避行为，是能合理推出的，可接受。</li><li>D&quot;可利用 IPN-NI 环路研制缓解恐惧情绪的药物&quot;：错在&quot;<strong>可利用</strong>&quot;。原文只说&quot;潜在治疗靶点&quot;——&quot;潜在&quot;是理论可能、提供方向，&quot;可利用&quot;是把可能性说成了确定性，程度越级，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这道题是&quot;择优&quot;：B 看似强加因果，但现实中&quot;恐惧→回避&quot;说得通，有解释空间；D 的&quot;潜在靶点→可利用&quot;把&quot;可能/方向&quot;偷成&quot;确定/可用&quot;，是硬伤。细节题里&quot;潜在、可能、有望&quot;被换成&quot;可利用、必然、已经&quot;时，多半就是错项。</span></div>"}, {"q_num": 12, "type": "片段阅读-细节判断", "answer": "C", "analysis_html": "<p>先看设问——&quot;理解<strong>正确</strong>的一项&quot;。</p><p>材料讲文化传播：文化传播需要载体，汉字书法、中国绘画、传统节日、中华美食等多种文化符号都承载中华文化的内涵与精神内核；要遵循规律、丰富形式，用更柔性、更有温度的文化载体推动中华文化走出去；特别要看到，随着经济实力、科技实力、综合国力提升，中国产品、中国品牌被越来越多人认可；要善于利用中国产品、中国品牌推动中华文化更好走向世界。</p><p>对照选项：</p><ul><li>A&quot;同为文化载体，书法、绘画比美食更有价值&quot;：无中生有。原文没做这三者之间的价值比较，排除。</li><li>B&quot;文化符号的多样性决定了精神内核的丰富性&quot;：方向错。是&quot;丰富的内核被符号承载表达&quot;，不是&quot;符号多样性决定内核丰富性&quot;，把&quot;承载&quot;偷成&quot;决定&quot;，排除。</li><li>D&quot;中国品牌走向世界就是中华文化走向世界&quot;：偷换概念。原文是&quot;<strong>利用</strong>品牌<strong>推动</strong>文化走向世界&quot;，品牌只是手段/载体，品牌走向世界不等于文化走向世界，排除。</li><li>C&quot;我国经济实力提升了中华文化的国际影响力&quot;：对应&quot;经济、科技、国力提升→产品品牌受认可→推动文化走向世界&quot;，经济提升确实提升了影响力，正确，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">细节题只求&quot;对不对&quot;，不要求&quot;全不全&quot;。C 从&quot;经济+科技+国力&quot;三个并列里单拎&quot;经济&quot;说它提升影响力，并没有错——并列里每一项都能提升，说其中一项提升不犯忌。别拿&quot;中心题要概括全&quot;的思路来套细节题。A 考无关比较、B 考&quot;决定&quot;关系、D 考&quot;等同&quot;，都是老坑。</span></div>"}, {"q_num": 13, "type": "片段阅读-细节判断", "answer": "B", "analysis_html": "<p>先看设问——&quot;<strong>不符合</strong>文意的是&quot;。</p><p>材料很短：很多人买雪糕都是看心情和场景；低价雪糕很难走薄利多销的路子，所以还是得<strong>挑毛利高的卖</strong>；当然价格也不是越贵越好，高价网红雪糕虽然毛利高，但出货量很少；所以一般经销商的策略都是，<strong>尽量多卖毛利较高、同时销量好的产品</strong>。</p><p>对照选项：</p><ul><li>A&quot;价格更高的网红雪糕利润更高&quot;：对应&quot;高价网红雪糕毛利高&quot;，指单个产品自身的利润，正确。</li><li>C&quot;批发商尽量多进毛利较高、销量好的产品&quot;：直接对应尾句&quot;尽量多卖毛利较高、销量好的产品&quot;，100% 对。</li><li>D&quot;满足用户的不同喜好，每个价位的产品都要有&quot;：由首句&quot;看心情和场景&quot;（非理性、情绪化消费，价格不重要）能合理推出，不冲突，可接受。</li><li>B&quot;售价 1 元的雪糕毛利率也不低&quot;：错。低价雪糕&quot;走不通薄利多销&quot;，所以才&quot;换路去挑毛利高的卖&quot;——这说明低价那头的毛利是<strong>低</strong>的，&quot;1 元毛利不低&quot;正与文意相反，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">B 藏在&quot;挑毛利高的卖&quot;的反面推：既然要&quot;挑毛利高的&quot;替代&quot;低价这条路&quot;，说明低价（1 元）本来毛利低。D 是&quot;可对&quot;、B 是&quot;必错&quot;，在不确定项和确定错项之间选确定的错。别被&quot;网红雪糕毛利高但销量少、总利润未必高&quot;带偏——题目问的是雪糕<strong>自身</strong>的利润。</span></div>"}, {"q_num": 14, "type": "片段阅读-细节判断", "answer": "D", "analysis_html": "<p>先看设问——&quot;观点<strong>不正确</strong>的一项&quot;。</p><p>材料说：少年儿童天生好奇，少儿科普读物正是利用这一点，以生动有趣的方式呈现科学知识、<strong>激发</strong>孩子们的探索欲；当下国内原创少儿科普已跨越自然科学藩篱、涵盖各领域，既丰富知识储备又拓宽视野；科学素养不单是知识，还包括科学方法、态度、精神的全面培养；除国内原创外还有引进版科普，引进版多基于其本土视野和叙事框架讲故事，因此这一领域创作需结合我国实际，把中华优秀传统文化与优质科普特质结合，更好讲中国人眼中的科学故事。</p><p>对照选项：</p><ul><li>A&quot;通过阅读科普读物不仅可以学习知识，还能培养科学精神&quot;：&quot;科学素养不仅知识还有方法态度精神&quot;正是对前文&quot;丰富知识&quot;的展开，正确。</li><li>C&quot;引进版的科普读物能有效拓宽孩子们的视野&quot;：引进版有本土视野（新视角、新形式），能拓宽视野，正确。</li><li>B&quot;国内原创科普读物相较于引进版，更符合我国国情&quot;：引进版需结合我国实际做本土化改造，那国内原创自然更贴近国情，正确。</li><li>D&quot;满足孩子们的探索欲是出版少儿科普读物的主要原因&quot;：错。文段说科普利用好奇去&quot;激发探索欲&quot;，探索欲是呈现知识的手段/结果之一，<strong>不是出版的原因</strong>；再叠一个&quot;主要&quot;排序，更无着落，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">D 把&quot;激发探索欲（目的/手段）&quot;偷换成&quot;出版的主要原因（因果地位）&quot;，还加了&quot;主要&quot;这个排序词。细节题里&quot;主要、根本、必然&quot;这类程度排序词，原文没有对应就多半是错项。别被首句的&quot;探索欲&quot;晃到——它出现了，不等于它就是&quot;出版原因&quot;。</span></div>"}, {"q_num": 15, "type": "片段阅读-细节判断", "answer": "D", "analysis_html": "<p>先看设问——&quot;说法<strong>不正确</strong>的一项&quot;。</p><p>材料：海豹、抹香鲸等深潜高手的肌肉中，肌红蛋白含量都格外高；肌红蛋白是一种把血液中的氧吸收并储存起来的蛋白质，为肌肉提供以后可用的能量，所以它们肌肉在不需要呼吸时还能坚持长时间工作；此外为节约能量，下潜时它们还有<strong>降低心率</strong>的本领；加州大学两组科研人员结论接近——7 头小海象在<strong>陆地</strong>上平均心跳每分钟 107 次，海水下潜时降到每分钟 <strong>39</strong> 次、下降 64%；潜水<strong>初期</strong>心率急剧降低，随深度加大<strong>缓慢</strong>下降，极限记录每分钟 3 次。</p><p>对照选项：</p><ul><li>A&quot;像海豹和抹香鲸那样的深海潜水动物体内肌红蛋白的含量，明显高于一般的动物&quot;：&quot;格外高&quot;对应&quot;明显高于一般动物&quot;，正确。</li><li>B&quot;肌红蛋白是一种蛋白质……让肌肉在无法呼吸的情况下还能坚持长时间的工作&quot;：原文直译，正确。</li><li>C&quot;深潜高手在下潜时具有降低心率的本领，这样可以节约能量&quot;：&quot;为了节约能量→降低心率&quot;，正确。</li><li>D&quot;研究表明，7 头小海象在海水中下潜时，心率不断缓慢下降，可由每分钟 107 次下降到每分钟 3 次&quot;：两处错。①107 是<strong>陆地</strong>上的，下潜时是 39；②&quot;不断缓慢下降&quot;与&quot;先急剧降低、后缓慢下降&quot;不符，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">D 错了两处：数字<strong>条件错位</strong>（107 是陆地、39 是下潜）+ 过程表述错（&quot;先急后缓&quot;说成&quot;不断缓慢&quot;）。核对数字题，先问一句：这个数字是哪个状态下测的？别把不同条件下的数字串到同一条线上。</span></div>"}, {"q_num": 16, "type": "片段阅读-细节判断", "answer": "C", "analysis_html": "<p>先看设问——&quot;理解<strong>不正确</strong>的一项&quot;。</p><p>材料：纵观人类社会发展史，世界经济开放则兴、封闭则衰；服务企业因轻资产、软要素等特点，更需开放、透明、包容、非歧视的行业发展生态；立足新发展阶段，服务贸易日益成为我国深化对外开放的新动力、激发内需潜力的新引擎，在<strong>构建新发展格局</strong>中有重要作用；目前消费结构正由物质消费为主向服务型消费为主转型升级，报告预测到 2025 年我国服务型消费支出占比将超 50%、2035 年达 60% 至 65%。</p><p>对照选项：</p><ul><li>A&quot;我国应积极顺应服务贸易发展实际需要，积极促进服务贸易开放合作&quot;：对应&quot;服务企业更需开放透明的生态&quot;，正确。</li><li>B&quot;发展服务贸易有利于我国构建新发展格局&quot;：对应&quot;在构建新发展格局中有重要作用&quot;，正确。</li><li>D&quot;我国与世界紧密联通，会为世界经济增长注入中国能量&quot;：由&quot;开放则兴、深化开放、外向助力&quot;合理推出，大方向对，可接受。</li><li>C&quot;面对国内外超预期因素影响，未来我国服务贸易依然将保持快速增长态势&quot;：两处硬伤——①&quot;国内外超预期因素&quot;全文没提；②&quot;占比提升到 50→65%&quot;是相对数，推不出&quot;快速增长&quot;（占比≠总量），选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">C 一错在&quot;超预期因素&quot;无中生有，二错在拿&quot;占比&quot;当&quot;总量/增速&quot;。占比是相对数，总量不变、别的份额下降也会让占比上升，所以&quot;保持快速增长&quot;这种确定表述没有同等依据。看到&quot;快速增长、必然&quot;这类词，回头找原文有没有同等级的证据。</span></div>"}, {"q_num": 17, "type": "片段阅读-细节判断", "answer": "D", "analysis_html": "<p>先看设问——&quot;与上文意思<strong>不相符</strong>的是&quot;。</p><p>材料把资本的两面都摆了出来：资本一产生就是充满矛盾的混合体——虽是一种生产关系，却无法长久驾驭它自己创造的生产力；虽带来资本主义极端个人主义张扬和两极分化；虽开拓世界市场引起民族国家对立、世界霸权主义盛行和地缘战争频发。但资本作为<strong>进步力量</strong>，把分散的生产资料、财产和人口集聚起来，创造出以往一切时代都难比拟的生产力；资本是现代经济润滑剂、倍增器；我们要研究资本，要研究资本的<strong>积极方面</strong>。社会主义市场经济是伟大创造，其中有各种形态的资本，要发挥资本作为生产要素的积极作用，同时有效控制其消极作用。</p><p>对照选项：</p><ul><li>A&quot;两极分化、霸权主义、地缘战争等问题可能因资本而起&quot;：对应&quot;虽然带来的……霸权……地缘战争&quot;，正确。</li><li>B&quot;资本作为一种生产关系能使生产力实现前所未有的发展&quot;：&quot;难以比拟&quot;=前所未有，正确。</li><li>C&quot;对资本的研究需要重点关注其作为进步力量的积极方面&quot;：对应&quot;要研究资本的积极方面&quot;，正确。</li><li>D&quot;社会主义市场经济制度是有效发挥资本积极作用的产物&quot;：方向颠倒。原文是&quot;社会主义市场经济<strong>要发挥</strong>资本积极作用、控制消极作用&quot;（对资本提要求），不是&quot;它是资本的产物&quot;，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">D 的坑在方向：&quot;X 要发挥/管理 Y&quot;≠&quot;X 是 Y 的产物&quot;。把句子的主谓关系简化成 X、Y——原文是&quot;X 要发挥 Y&quot;，选项说&quot;X 是 Y 的产物&quot;，一眼就能看出&quot;发挥/控制&quot;和&quot;产物&quot;完全两回事。</span></div>"}, {"q_num": 18, "type": "片段阅读-细节判断", "answer": "A", "analysis_html": "<p>先看设问——&quot;文中<strong>未涉及</strong>的是&quot;，选非，用排除法最稳。</p><p>材料：AI 的优势显而易见——&quot;AI 医生&quot;依托数千万份病例库大幅提升诊断准确率，&quot;AI 公务员&quot;熟练梳理数百项业务流程把错误率降到近乎零，都能体会 AI 的效率革命。不过，&quot;AI 医生&quot;虽能瞬间生成诊断报告，却难体会患者对病情的恐惧与担忧；&quot;AI 公务员&quot;可精准分析数据、高效处理文件，却难在制定政策时权衡复杂的民生福祉。最理想的 AI 落地画面是：AI 在云端凭强大算力精准算最优解，人类在应用场景背后用心守护每个生命的独特。</p><p>对照选项：</p><ul><li>B&quot;过度依赖 AI 会降低服务的温度&quot;：对应&quot;难体会恐惧担忧&quot;等局限——机器只有效率、少人情温度，涉及。</li><li>C&quot;在实际运行过程中 AI 有其局限性&quot;：对应&quot;难以体会/难以权衡&quot;等局限，涉及。</li><li>D&quot;使用 AI 服务应当重视人机协作&quot;：对应尾句&quot;AI 算最优解+人类背后守护&quot;的理想画面，涉及。</li><li>A&quot;AI 加速融入服务行业是必然趋势&quot;：无中生有。原文只说了 AI 有优势、也有局限和理想用法，没说它&quot;必然融入服务行业&quot;，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;未涉及&quot;题就用排除法：B、C 都从&quot;不过&quot;之后的局限句来（一体两面），D 从尾句&quot;理想画面&quot;出，剩下 A 的&quot;必然趋势&quot;全文无落点。盯住&quot;必然&quot;这种确定性程度词——原文若有&quot;必然&quot;字样才对得上，没有就是无中生有。</span></div>"}, {"q_num": 19, "type": "片段阅读-细节判断", "answer": "D", "analysis_html": "<p>先看设问——&quot;科学家能充分了解三叶虫的原因<strong>不包括</strong>&quot;，选非。</p><p>材料：三叶虫生活在远古海洋，主要出现在寒武纪，寒武纪晚期发展到顶点；年代虽遥远，但科学家对它的形态构造了解相当充分；三叶虫体表有坚固甲壳，发育中经历多次脱壳生长，所以相比其他留下很少化石的生物，科学家更容易在地层中找到三叶虫化石；寒武纪海洋中比三叶虫更大更凶暴的动物<strong>并不多</strong>，因此三叶虫能在各地迅速繁衍；三叶虫化石大多保存在质地细致的石灰岩或页岩中，所以外壳特征看得清、有时内部构造也清晰。</p><p>逐项核对：</p><ul><li>A&quot;三叶虫化石数量较多&quot;：其他生物化石少、三叶虫容易找到，对应数量多，是原因。</li><li>B&quot;三叶虫化石保存完好&quot;：保存在细致石灰岩/页岩中、外壳内部都清晰，对应保存好，是原因。</li><li>C&quot;三叶虫地域分布广泛&quot;：&quot;能在各地迅速繁衍&quot;对应分布广，是原因。</li><li>D&quot;三叶虫没有竞争对手&quot;：错。原文&quot;更大更凶暴的动物<strong>并不多</strong>&quot;=竞争对手<strong>少</strong>，不是&quot;没有&quot;，程度越级，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">D 是&quot;程度偷换&quot;：&quot;不多&quot;≠&quot;没有&quot;。原文用&quot;并不多&quot;（少），选项换成&quot;没有&quot;（零），一字之差。细节判断题最常在这类量词上设坑：多/少、几乎/全部、并不/没有，核对时把这些词圈出来逐字比对。</span></div>"}, {"q_num": 20, "type": "片段阅读-细节判断", "answer": "B", "analysis_html": "<p>先看设问——&quot;说法<strong>错误</strong>的是&quot;。</p><p>材料：家文化是体现民族特质和精神风貌的民族文化，是中华民族在数千年繁衍生息中形成和发展的家庭文化样态；中国传统文化随着<strong>生产力的进步</strong>而发展、随着<strong>家庭生产的发展</strong>而演进；因而父祖长辈对子孙的教育，除了遵循<strong>一般的社会要求</strong>之外，还深深打上家庭、家族的独特烙印，并在世代延续、演进的沉淀累积中形成各具特色的家文化。</p><p>对照选项：</p><ul><li>A&quot;家文化体现了中华民族特质和精神风貌&quot;：对应首句&quot;体现民族特质和精神风貌&quot;，正确。</li><li>C&quot;家文化是中国传统文化的基石&quot;：由&quot;家是文化根基、传统文化随家庭生产演进&quot;整体推出，方向合理（有合理空间）。</li><li>D&quot;家庭教育要遵循一般的社会要求&quot;：对应&quot;除遵循一般社会要求外&quot;，正确。</li><li>B&quot;中国传统文化随着家文化的发展而发展，家文化是在世代延续中累积沉淀下来的&quot;：后半句对，前半句错——传统文化是&quot;随着<strong>生产力进步、家庭生产发展</strong>&quot;而发展，不是&quot;随着家文化发展&quot;，偷换概念，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">B 是&quot;半对半错&quot;里最阴的坑：后半句&quot;沉淀累积下来&quot;是原文的，前半句被偷梁换柱（生产力/家庭生产→家文化）。别看到后半句对就急着选，把整句拆开逐字对。C 虽无确定对应，但在&quot;确定错&quot;和&quot;不确定&quot;之间，选确定错的，这是标准择优。</span></div>"}]}, {"set_num": 6, "set_name": "拔高刷题六", "questions": [{"q_num": 1, "type": "片段阅读-标题", "answer": "D", "analysis_html": "<p>先看设问——可做文段标题的是，直接点明考标题。标题题有个省事的角度：先看文段里有没有&quot;设问+回答&quot;的结构，因为答案常常就藏在这个回答里。</p><p>读文段。开头先给种质资源下定义——携带生物遗传信息、有实际或潜在利用价值的载体；紧接着一句&quot;<strong>种质就是种子吗</strong>？&quot;这是设问，一问出来我们的神经要立刻绷紧：后面必有回答。果然，&quot;实际上二者不能画等号&quot;，这就是核心态度。后面举例把范畴铺开：农作物种质资源涵盖栽培种、野生种、濒危种的繁殖材料，不仅有果实籽粒，还有苗根茎叶花、组织细胞和DNA片段等；一个&quot;可见&quot;收束——<strong>种质资源的范畴比种子大得多</strong>。再往下&quot;种业是农业的芯片&quot;&quot;种质资源是源头和基础、地位分外凸显&quot;，全是在讲它<strong>重要</strong>。</p><p>所以一句话主旨：种质资源不等于种子，范畴更大、地位重要，保护不能只盯种子。</p><p>逐项对比：</p><ul><li>A&quot;小小种子……&quot;：话题就错了。全文讲的是<strong>种质</strong>（质量的质），不是种子，对象说错。</li><li>B&quot;精准发力，打造种质资源强国&quot;：文段只强调重要性和地位，没说&quot;如何建强国&quot;，对策无中生有。</li><li>C&quot;由点及面全面推动种业振兴&quot;：同样没提&quot;振兴、复兴&quot;，无中生有。</li><li>D&quot;种质资源保护不应止于种子&quot;：正好对应&quot;设问+回答&quot;和&quot;范畴比种子大得多&quot;，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">标题题看到&quot;……就是……吗&quot;这类设问，先锁定后面的回答做预判答案，再带着它回原文验证，比从头精读快得多。这里的坑是选项把&quot;种质&quot;偷换成&quot;种子&quot;——一字之差，话题就偏了。</span></div>"}, {"q_num": 2, "type": "片段阅读-标题", "answer": "A", "analysis_html": "<p>这道题先抓主题词。全文反复在讲<strong>低轨互联网星座</strong>（后面又叫&quot;星座组网&quot;&quot;星座卫星&quot;），讲它给用户提供覆盖更广的电信服务，并跟地面基站做对比。</p><p>顺着读。首句：低轨互联网星座重要功能之一，就是给身处地球的手机用户提供全方位覆盖的电信服务。第二句：星座组网投用后，普通用户在<strong>任何地方</strong>都能用手机连卫星信号上网——注意&quot;低轨互联网星座&quot;和&quot;星座组网&quot;是一个东西，只是换了说法。接着话锋一转讲地面基站：容量有限、受地形地貌影响、只覆盖不足6%的地表；全量铺设成本过高不现实。而太空中的星座卫星能更大范围覆盖偏远地区、海洋等区域，成为&quot;更优解&quot;。合起来一句话——<strong>星座组网补地面基站短板、覆盖更广，是全球通信的关键</strong>。</p><p>逐项对比：</p><ul><li>B&quot;技术迭代：基站通信的落幕&quot;：两个问题。①&quot;技术迭代&quot;没说出新技术是什么（就是星座组网）；②&quot;落幕&quot;太重，原文只说星座卫星是&quot;更优解&quot;，没说基站就被淘汰了。</li><li>C&quot;卫星通信：信号地表全域覆盖&quot;：①&quot;卫星通信&quot;丢掉了&quot;星座&quot;这个限定，概念放大；②&quot;全域覆盖&quot;过重，原文是&quot;更大范围覆盖&quot;，不是全覆盖。</li><li>D&quot;星座互联：通信服务震荡革命&quot;：&quot;震荡革命&quot;指向不明——到底快、便宜还是范围大，没说清。</li><li>A&quot;星座组网：全球通信的钥匙&quot;：&quot;星座组网&quot;是原文词，&quot;全球通信&quot;对应更广覆盖，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">专业名词一般不替换：原文明明有&quot;星座组网&quot;，就没有必要换成更大的&quot;卫星通信&quot;。同义替换是留给非专业词的，词越专业、越该用原词。</span></div>"}, {"q_num": 3, "type": "片段阅读-标题", "answer": "C", "analysis_html": "<p>总起句很规整，读完就把两个主角抓住了。首句讲&quot;微波辅助催化技术&quot;是处理填埋场废塑料、实现高值利用的新技术，而<strong>特制的催化剂（Zn/b-ZnO）和微波</strong>的独特作用，是它让塑料垃圾重生的关键。也就是说全文要讲&quot;催化剂+微波&quot;这两样东西。</p><p>后面分别说。催化剂由两个功能单元组成：b-ZnO 吸收微波能量并转化为局部热量，就像给塑料垃圾搭了个<strong>烹饪炉</strong>；原位生成的 Zn 团簇像<strong>菜刀</strong>，负责切断塑料分子里顽固的 C-C 键。微波则像<strong>厨师</strong>，通过选择性加热处理垃圾；相比传统加热，微波能精准找到催化剂只对它加热，反应更快、更省能量。整段是&quot;催化剂/微波&quot;并列，催化剂内部再分&quot;炉子/菜刀&quot;两小支。</p><p>一句话主旨：塑料垃圾处理靠的是<strong>催化剂和微波协同发力</strong>。</p><p>逐项对比：</p><ul><li>A&quot;从塑料到资源：原子簇-氧化物的协同效应&quot;：只落在催化剂这一边（氧化物跟催化剂相关），把微波整个丢了，片面。</li><li>B&quot;告别能量浪费：微波选择性加热技术&quot;：只讲微波，丢了催化剂，片面。</li><li>D&quot;微波助力塑料垃圾高值利用&quot;：同样只讲微波、没有催化剂，片面。</li><li>C&quot;微波与催化剂的烹饪二重奏&quot;：两个大概念都覆盖，&quot;烹饪&quot;正好呼应&quot;烹饪炉+菜刀+厨师&quot;这组厨房比喻，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">并列概括，先数清楚有哪几个并列项（这里是催化剂+微波），再看选项覆盖度：A 只讲催化剂、B/D 只讲微波，谁只占一半谁就片面。C 把两样都收到了。</span></div>"}, {"q_num": 4, "type": "片段阅读-标题", "answer": "B", "analysis_html": "<p>这道题不少同学选了 C，错就错在没想清楚&quot;贡献&quot;和&quot;获奖&quot;谁是因、谁是果。先读文段。</p><p>在《联合国防治荒漠化公约》缔约方大会高等级会议上，<strong>王文彪</strong>获颁联合国&quot;全球治沙领导者奖&quot;——注意是<strong>首届</strong>。这个奖是公约组织倡导发起的，用来表彰全球治沙领域作出卓越贡献的个人。在中国政府支持下，王文彪带领亿利资源 25 年绿化库布其沙漠 5000 多平方公里，占全球荒漠化面积的七千分之一。</p><p>文段的信息点里，&quot;政府支持&quot;&quot;治沙&quot;都只是铺垫，真正的主角是<strong>王文彪 25 年的治沙成果换来了联合国表彰</strong>。</p><p>逐项对比：</p><ul><li>A&quot;中国政府支持企业治沙&quot;：政府支持只是背景，成果才是重点，片面。</li><li>D&quot;库布其的中国治沙人&quot;：只点了对象&quot;治沙人&quot;，既没说成果、也没说获奖，空。</li><li>C&quot;中国治沙人为治理荒漠化做出卓越贡献&quot;：容易误选，但&quot;卓越&quot;这个词太虚——贡献到底有多大，它没量出来。</li><li>B&quot;中国人治沙收到联合国表彰&quot;：获奖是贡献的<strong>果</strong>，最具体也最有说服力，还能反推出&quot;贡献大到联合国都来颁奖&quot;的程度，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">同时出现&quot;因&quot;和&quot;果&quot;两个选项时，优先选&quot;果&quot;——果比因更具体、更能体现程度。这里&quot;A 因扎实却模糊，B 果直接量化了功劳&quot;，果大于因。代入生活也很好懂：说&quot;你成绩很好&quot;，远不如&quot;你成绩好到全省第一&quot;来得明确。</span></div>"}, {"q_num": 5, "type": "片段阅读-标题", "answer": "B", "analysis_html": "<p>这套里几个标题题都要警惕&quot;引子陷阱&quot;，第五题就是典型。文段开头的&quot;井&quot;和后文的&quot;内卷躺平&quot;全是例子，观点夹在中间。</p><p>开头说每个人都处于特定时空、有自己的活动空间，我们坚信的真理往往是&quot;井底&quot;的真理，只适用于我们生活的那口&quot;井&quot;；一旦青蛙有勇气跳出井，就会理解<strong>真理的相对性</strong>——&quot;井&quot;只是引子。接着&quot;换言之&quot;：在具体时空下真理是绝对的，比如二维平面里三角形内角和是 180°，但进入三维就不成立了——这是<strong>第一个例子</strong>。&quot;我们的价值评判标准也是同理&quot;，再拿&quot;内卷&quot;&quot;躺平&quot;之争举例——<strong>又一个例子</strong>，说明这种争执是特定条件下的产物。</p><p>所以结构是&quot;引子＋观点＋两个例子&quot;,一句话主旨：<strong>真理是相对的</strong>（只在特定条件下才绝对）。</p><p>逐项对比：</p><ul><li>A&quot;&quot;井&quot;里与&quot;井&quot;外&quot;：&quot;井&quot;只是引出观点的小引子，不是全文要说的对象。</li><li>C&quot;世界维度决定思想高度&quot;：&quot;维度&quot;只出现在二维三维那个例子里，是例子内容，不能当观点。</li><li>D&quot;&quot;内卷&quot;&quot;躺平&quot;的辩证统一&quot;：内卷躺平同样只是例子，不是中心。</li><li>B&quot;&quot;相对&quot;才是真理&quot;：直接对应核心词&quot;真理的相对性&quot;，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">遇到前后都是例子、观点藏在中间的结构，抓中间那句话。判断某个词是不是引子，可反向验证：选项里根本没以&quot;井&quot;&quot;内卷&quot;为标题对象，说明出题人不考它们，别把例子当主题词。</span></div>"}, {"q_num": 6, "type": "片段阅读-标题", "answer": "B", "analysis_html": "<p>这道题要先抓两个转折，再想清楚&quot;土星&quot;到底重不重要。读材料。</p><p>&quot;卡西尼&quot;号是人类迄今最雄心勃勃的太空探索项目之一，也是 20 世纪最后一艘行星际探测大飞船；预计 2017 年 9 月 15 日进入土星大气层、发回土星大气成分数据——但这也是我们和它<strong>永别</strong>的时候，它会燃烧殆尽。终极使命倒计时已启动，但&quot;卡西尼&quot;号的生命正进入<strong>最辉煌</strong>的时刻。对团队来说，这段旅程才是惊心动魄的决战，它将回传数据直至消陨在土星怀抱。</p><p>两个转折，一说&quot;永别&quot;，二说&quot;最辉煌&quot;,后文&quot;土星任务&quot;只是它最后阶段&quot;在哪发光&quot;的具体细节。一句话主旨：<strong>卡西尼号进入生命的最终章，却在最后时刻仍发光发热</strong>。</p><p>逐项对比：</p><ul><li>A&quot;卡西尼号的太空探索之旅&quot;：&quot;之旅&quot;是全程，文段只讲最后的阶段，范围过大。</li><li>C&quot;卡西尼号完成土星死亡穿越&quot;：&quot;完成&quot;时态错，原文是&quot;预计将进入&quot;，尚未发生。</li><li>D&quot;卡西尼号——星际探测的最后辉煌&quot;：①&quot;星际探测的最后&quot;≠卡西尼号最后的辉煌，卡西尼号结束了星际探测并没结束；②&quot;最后辉煌&quot;体现的是&quot;过了巅峰&quot;，不等于&quot;最终章/消亡&quot;。</li><li>B&quot;卡西尼号踏上壮丽最终章&quot;：&quot;最终章&quot;对应永别、&quot;壮丽&quot;对应最辉煌，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">纠结&quot;为什么不写土星&quot;时，反向验证一下：四个选项里都没有把&quot;土星&quot;当主题，说明&quot;土星&quot;根本不是本题考点，是你一开始把次要细节当成了重点。中心永远是&quot;这是它最后阶段却仍辉煌&quot;，而不是&quot;它最后干了哪件事&quot;。</span></div>"}, {"q_num": 7, "type": "片段阅读-标题", "answer": "A", "analysis_html": "<p>先看结构。前面在讲候鸟面临的问题，转折之后给出&quot;聪明的办法&quot;，而这个办法要结合后文实验才明确。</p><p>候鸟为躲避天敌和高温日晒，迁徙时选择夜间飞行；飞越墨西哥湾等屏障时甚至不眠不休连续飞 24 小时；长期缺觉会极度疲惫、灵活性降低，中途休息更危险。&quot;然而&quot;表转折——最新研究表明，候鸟自有一套聪明的解决办法。办法是什么？科学家观测 7 只<strong>斯文氏夜鸫</strong>：这种惯常夜飞的鸟白天休息并非完全放松，通常<strong>睁着一只眼睛</strong>；脑电波显示它们只有<strong>半个大脑处于标准休眠状态</strong>。</p><p>这里要分层看：睁一只眼闭一只眼是<strong>外在现象</strong>，脑电波显示的&quot;半脑休眠&quot;才是<strong>本质机制</strong>。一句话主旨：候鸟靠&quot;半个大脑休、半个大脑醒&quot;解决缺觉危险。</p><p>逐项对比：</p><ul><li>B&quot;斯文氏夜鸫的秘技&quot;：夜鸫只是观测对象／例子，不是中心；&quot;秘技&quot;也没讲明是什么。</li><li>D&quot;你的夜晚，我的白天&quot;：对应前面昼夜迁徙的铺垫，与&quot;办法&quot;无关。</li><li>C&quot;睁一只眼，闭一只眼&quot;：只是表面现象，且文段说的是观测到的夜鸫如此，不能推成所有候鸟都这样。</li><li>A&quot;半梦半醒之间&quot;：&quot;半醒&quot;对睁眼、&quot;半梦&quot;对半脑休眠，挖到了本质，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">现象与本质二选一时，优选挖到本质的那一个。睁眼闭眼是动作表象，脑电波揭示的&quot;半脑休眠&quot;才是真办法；C 停留在&quot;看见什么&quot;，A 落到&quot;到底是什么&quot;。</span></div>"}, {"q_num": 8, "type": "片段阅读-标题", "answer": "A", "analysis_html": "<p>先抓转折词&quot;但你可能想象不到&quot;——这种句式一出，就是要告诉你不为人知的东西。</p><p>开头先说&quot;冬虫夏草&quot;是两种生物生存竞争的结果：虫草菌利用蝙蝠蛾幼虫当养料，人们采到的是真菌菌株和虫壳，现在被当作神奇的药物。&quot;但你可能想象不到&quot;，这么著名的药材，明代《本草纲目》里竟找不到记载，直到清代乾隆年间才出现在吴仪洛编的《本草从新》中。所以对中药家族来说它算是一种<strong>新药</strong>；而《本草从新》里也只提到它保肺益肾、止血化痰等<strong>一般功效</strong>，神奇功效是后来才被认识的。</p><p>一句话主旨：你可能不知道——冬虫夏草其实是新药、功效也是后来才知道的，像个科普冷知识。</p><p>逐项对比：</p><ul><li>B&quot;冬虫夏草的前世今生&quot;：&quot;前世今生&quot;要求完整起源、发展、演变的脉络，文段只点&quot;明代无、清代有&quot;来论证它是新药，没有完整的演变史。</li><li>C&quot;《本草纲目》与冬虫夏草&quot;：《本草纲目》只是&quot;找不到记载&quot;的对比项，不是中心。</li><li>D&quot;冬虫夏草是什么&quot;：首句下定义只是引出，转折后的内容才是重点。</li><li>A&quot;你不知道的冬虫夏草&quot;：&quot;你可能想象不到&quot;正好对应&quot;你不知道&quot;，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;前世今生&quot;这类词不能硬套——它要求一条完整的时间发展线，而文段只举了明清两个点来论证&quot;新药&quot;。作者用清代不是为了讲&quot;起源&quot;，而是为了说明&quot;离我们不远、并非老药&quot;，把这个结论拔掉、单拿时间点当前世，就是强行解读。</span></div>"}, {"q_num": 9, "type": "片段阅读-标题", "answer": "D", "analysis_html": "<p>这道题正确率很低，问题就出在没分清&quot;速度快&quot;和&quot;体量大&quot;是两个点。文段前后堆满数据，中间有一句概括。</p><p>刘江介绍，1～4 月快递业务量完成 <strong>170.7 亿件</strong>，同比增长 <strong>24.8%</strong>，是同期服务业生产指数增速的 3 倍多，领先现代服务业；更可喜的是，行业<strong>不仅长&quot;块头&quot;，&quot;肌肉&quot;也跟着长</strong>，质量不断提高。1～4 月业务收入累计 <strong>2135.4 亿元</strong>、同比增长 22.8%；日均处理 1.6 亿件、最高 1.8 亿件，单月已接近 50 亿件。</p><p>读数据要读出两个点：一是<strong>增速快</strong>（各种同比增长、领先），二是<strong>体量大</strong>（170 多亿件、2000 多亿收入、单月近 50 亿件）。一句话主旨：快递行业<strong>快与大兼备</strong>。</p><p>逐项对比：</p><ul><li>B&quot;农村快递增长迅猛&quot;：&quot;农村&quot;全文没提，无中生有。</li><li>C&quot;快递应补齐短板&quot;：全文都是正向数据，没有&quot;短板&quot;，无中生有。</li><li>A&quot;快递行业，跑出加速度&quot;：只体现&quot;增长快&quot;，罩不住&quot;体量大&quot;，片面。</li><li>D&quot;快递高位运行&quot;：排除 A、B、C 后只剩 D；&quot;高位&quot;既可指增速高、也可指体量大，能统摄两个点，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;加速度&quot;只能体现快，体现不出总量大——就像从 1 分涨到 50 分，速度很快，但 50 分依旧很低。并列里同时有&quot;快+大&quot;两个点，单讲其一就是片面。遇到不认识的词（如&quot;高位&quot;）别急着排，用排除法排除掉有硬伤的，剩下的就选它。</span></div>"}, {"q_num": 10, "type": "片段阅读-细节判断", "answer": "D", "analysis_html": "<p>这道题题干问&quot;最可能摘自文章&quot;，等于在考全文中心、让你给文章拟个标题方向。</p><p>读全文。知识产权是智力劳动成果的专有权利、社会财富的重要来源——下定义；当前我国正从知识产权<strong>引进大国向创造大国</strong>转变、从<strong>追求数量向提高质量</strong>转变——讲变化；正制定 2035 强国战略纲要和&quot;十四五&quot;规划；建设知识产权强国，一方面从国家战略高度<strong>全面加强知识产权保护</strong>、激发全社会创新活力；另一方面让专利创造重心<strong>向高价值专利倾斜</strong>、推动创新成果向现实生产力转化。合起来就是两个对策：<strong>保护和转化</strong>，全都围绕&quot;知识产权+创新&quot;展开。</p><p>一句话主旨：保护知识产权就是保护创新。</p><p>逐项对比：</p><ul><li>A《超越反垄断，更应关注知识产权问题》：&quot;反垄断&quot;全文没提，无关。</li><li>B《知识产权与中小企业发展》：&quot;中小企业&quot;没提，无关。</li><li>C《为激发创新活力提供坚强产权保护》：&quot;激发创新活力&quot;只对应第一方面（片面），而且&quot;产权&quot;比&quot;知识产权&quot;概念放大、丢了&quot;知识&quot;这个限定。</li><li>D《保护知识产权就是保护创新》：主题词&quot;知识产权&quot;准确，&quot;保护创新&quot;把保护和转化都收进去了，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">选标题先锁主题词——全文是&quot;知识产权&quot;，&quot;产权&quot;是放大了的概念，不精确。两个选项都含&quot;创新&quot;时，就比主题词的精度：&quot;知识产权&quot;精确、&quot;产权&quot;泛化，细分之下 D 胜出。</span></div>"}, {"q_num": 11, "type": "片段阅读-词句理解", "answer": "A", "analysis_html": "<p>词句理解题，先定位&quot;从这个意义上说&quot;、&quot;意义&quot;两个字指代的是<strong>前文</strong>。</p><p>看前文：送外卖作为一种平台化的服务型劳动，既是&quot;<strong>力气活</strong>&quot;，也是&quot;<strong>情感活</strong>&quot;。&quot;从这个意义上说&quot;，外卖劳动与工厂劳动有显著区别——所以&quot;这个意义&quot;指的就是前一句&quot;<strong>力气活+情感活</strong>&quot;这个双重属性。后面再讲流水线是改造物、没有过多沟通、情感需求不高，而骑手更多与人打交道、充满交流，这些都是用来<strong>区分外卖与工厂</strong>的后续内容，不是&quot;意义&quot;本身。</p><p>一句话：它指的是外卖劳动兼具体力与情感的双重属性。</p><p>逐项对比：</p><ul><li>B&quot;平台化服务型劳动需要更高水平的人际沟通能力&quot;：&quot;更高水平&quot;是脑补，原文只说&quot;更多与人打交道&quot;。</li><li>C&quot;劳动者与劳动对象之间是否涉及人际互动&quot;：这是后面区分外卖和工厂的标准，不是&quot;意义&quot;本身。</li><li>D&quot;服务业对劳动者综合素质的要求高于制造业&quot;：&quot;综合素质&quot;&quot;高于&quot;无中生有、表述过重。</li><li>A&quot;外卖劳动兼具体力消耗与情感互动的双重属性&quot;：直接对应&quot;力气活+情感活&quot;，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">指代题一般就近指上一句；上一句如果是例子就跳过找观点。本题&quot;意义&quot;直接承接前一句的定义，B、C、D 都在讲后文的内容，做这种题其实不用通读全文，找准指代点即可。</span></div>"}, {"q_num": 12, "type": "片段阅读-词句理解", "answer": "C", "analysis_html": "<p>还是指代题，先找&quot;这个&quot;在哪——&quot;从这个角度来看&quot;里的&quot;这个&quot;，指<strong>紧前面那一句</strong>，而不是更早的第一句。</p><p>紧前面一句说：在执法过程中，法律不再仅仅是纸面上的文字，而是以鲜活的形式在社会生活中得到<strong>具体体现和感知</strong>。这句话的意思就是<strong>执法让&quot;纸面上的法律&quot;变成&quot;社会生活里能被具体感知的法律&quot;</strong>，也就是&quot;法律具体化&quot;。&quot;这个角度&quot;指的就是这一句。</p><p>后面&quot;执法不仅是政府把法律付诸实践、更是一种普遍有影响力的法律传播方式&quot;，是顺着这个角度往下说的延伸，不是被指代的对象。</p><p>逐项对比：</p><ul><li>A&quot;执法的理论影响力&quot;：&quot;理论影响力&quot;没提，无中生有。</li><li>B&quot;执法活动的广泛性&quot;：&quot;广泛性&quot;对应第一句&quot;直接、全面且系统融入社会&quot;，不是&quot;这个&quot;就近指的那句。</li><li>D&quot;执法全面融入社会&quot;：也是第一句的内容，选它等于跳过了就近句、去找更早的句子。</li><li>C&quot;执法让法律具体化&quot;：对应&quot;不再是纸面上的文字、具体体现和感知&quot;，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;这个&quot;的指代要看它紧挨的那一句，别往前乱跳。选项里&quot;融入社会&quot;&quot;广泛性&quot;都在考你&quot;会不会跳到更早的第一句去&quot;，能守住&quot;就近&quot;原则就不会掉坑。</span></div>"}, {"q_num": 13, "type": "片段阅读-细节判断", "answer": "D", "analysis_html": "<p>这道题是词句&quot;解释正确&quot;，其实是四个小判断题。挨个查。</p><p>文段说：一种科学观点认为，地球上 CO2 浓度增加将使植物光合作用能力提高、有助于农作物生长；而<strong>更多的人</strong>认为，CO2 浓度增加会导致&quot;温室效应&quot;、使气温急剧上升，造成南北极冰雪融化、沿海土地被淹没。</p><ul><li>A 光合作用：植物利用光能，将 CO2 转化为&quot;氢水化合物&quot;。光合作用是把二氧化碳和水转化成有机物（碳水化合物），不是&quot;氢水化合物&quot;，且文段根本没给光合作用下定义，无中生有＋表述错误。</li><li>B 温室效应：地球气温急剧上升的结果。原文是&quot;CO2 浓度增加→温室效应→气温上升&quot;，温室效应是<strong>因</strong>、气温上升是<strong>果</strong>，选项因果颠倒。</li><li>C CO2 浓度：二氧化碳。CO2 才是二氧化碳，&quot;浓度&quot;是它的含量，把物质的浓度说成物质本身，偷换概念。</li><li>D 更多的人：反对第一种观点的人。第一个观点说 CO2 有好处，第二个观点说 CO2 有坏处，一好一坏，更多人就是持相反观点的人，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这类题就当一个一个的判断题做，常见坑是三类：因果颠倒（温室效应/气温）、偷换概念（浓度=物质）、无中生有（氢水化合物）。&quot;反对&quot;不要求字面完全相反——你说好、我说坏，就是反对，不需要逐条怼回去。</span></div>"}, {"q_num": 14, "type": "片段阅读-词句理解", "answer": "A", "analysis_html": "<p>先看&quot;有效应对&quot;在哪——尾句，问它指什么。看字面就知道它该是个<strong>对策</strong>（怎么在立法层面解决问题）。</p><p>读结构。首句说《民法总则》颁行后将展开民法典<strong>分编</strong>立法；然后&quot;期待&quot;在分编立法中进一步强化对个人人格尊严的保护、彰显人文关怀精神。为什么要这么做？因为互联网、大数据时代高科技有被误用滥用的风险，威胁隐私权等人格权；举例&quot;人肉搜索&quot;、盗取信息邮件泛滥，严重侵害人格权、危及财产人身安全，所以&quot;需要在立法层面作出有效应对&quot;。</p><p>核心抓两点：一是&quot;分编立法&quot;只是形式（总则像大纲，写完要分册细化），<strong>它本身不是对策</strong>；二是真正的对策是&quot;在分编里加<strong>人格权立法</strong>、强化人格权保护&quot;。</p><p>逐项对比：</p><ul><li>B&quot;通过分编立法，彰显人文关怀的时代精神&quot;：&quot;分编立法&quot;只是&quot;总则→分册&quot;的编写形式，不是对策；&quot;彰显人文关怀&quot;是期待/愿景，也不是具体做法。</li><li>C&quot;强化对&#x27;人肉搜索&#x27;等不法行为的打击&quot;：&quot;人肉搜索&quot;是例子，且&quot;打击&quot;偏离&quot;立法&quot;这条途径。</li><li>D&quot;注重互联网和大数据时代的法治研究&quot;：&quot;法治研究&quot;没提，与&quot;人格权&quot;无关。</li><li>A&quot;加快人格权立法，提升人格权保护水平&quot;：正是&quot;立法层面应对侵害人格权&quot;的具体对策，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;有效应对&quot;=问对策，对策是&quot;加人格权立法&quot;，不是&quot;怎么写分编&quot;这个形式。别把&quot;形式&quot;当&quot;内容&quot;——分编只是大纲写完要分章分册，具体在分编里写什么才是对策。</span></div>"}, {"q_num": 15, "type": "片段阅读-词句理解", "answer": "B", "analysis_html": "<p>这道题最容易搞混的是文段里其实有<strong>两个&quot;这&quot;</strong>，问的是后一个。先定位。</p><p>体育竞技掺入越来越多经济利益，会驱使一些人走向极端；虽然目前运动员的自然能力仍占主导，但是如果有一天科技足以超越自然赋予的力量，运动员日常不需严格训练而是通过仪器、手术来增强体质，<strong>这（第一个这）</strong>与驾驶摩托车参加百米竞赛是否还有本质区别？<strong>这（第二个这）</strong>不仅是抛给体育界的问题，也将成为科学的难题。</p><p>第一个&quot;这&quot;指&quot;通过仪器、手术增强体质&quot;（即 A 项）；第二个&quot;这&quot;往前看，指代的是&quot;如果科技超越自然力量、运动员不训练靠仪器增强体质&quot;这<strong>整个假设命题</strong>，也就是&quot;科技手段的作用超过运动员的自然能力&quot;。</p><p>逐项对比：</p><ul><li>A&quot;通过仪器、手术来增强体质&quot;：是第一个&quot;这&quot;（&quot;这与骑摩托参赛没区别&quot;）的指代对象，不是第二个&quot;这&quot;。</li><li>C&quot;让运动员的自然能力占据主导地位&quot;：与文段相反，文段讲的是科技超过自然、不再靠自然训练。</li><li>D&quot;体育竞技在经济利益驱使下走向极端&quot;：是第一句的背景，离第二个&quot;这&quot;太远且被转折带过。</li><li>B&quot;科技手段的作用超过运动员的自然能力&quot;：第二个&quot;这&quot;指代的总话题，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">一句话里连出两个&quot;这&quot;时，先分清问的是哪个。就近的第一层&quot;这&quot;指具体做法，往上一层概括的&quot;这&quot;才指整个假设命题。指代要看它就近那句在概括谁，别把两个层级混成一层。</span></div>"}, {"q_num": 16, "type": "片段阅读-词句理解", "answer": "B", "analysis_html": "<p>这是词句理解里比较难的一道，难在它玩的是&quot;观点+例子&quot;。先看&quot;这种情况&quot;的位置。</p><p>&quot;但是&quot;之后先给了一个<strong>观点句</strong>：由于武戏技术难度大、人才培养周期长、成材率低、演员易受伤、舞台活跃周期短、排演耗时耗人耗力等多方面原因，<strong>武戏传承一度面临较大挑战</strong>。紧接着是&quot;曾经有一段时间……&quot;：武戏演员青黄不接、剧目日渐萎缩，尤其老一辈艺术家的相继离世，许多剧目和&quot;独门绝技&quot;鲜见舞台、几近失传……&quot;这种情况&quot;引发了戏曲界的普遍担忧。</p><p>注意&quot;曾经有一段时间……几近失传&quot;整段是<strong>举某个时间段当例子</strong>，论证上面的&quot;武戏传承面临挑战&quot;这一观点。指代遇到&quot;观点+例子&quot;时，要跳过例子去找观点，所以&quot;这种情况&quot;指的不是&quot;演员断层、剧目失传&quot;这些现象，而是上面的观点句。</p><p>逐项对比：</p><ul><li>A&quot;武戏演员断层衍生负面连锁反应&quot;：是&quot;曾经一段时间&quot;那个例子本身，例子不当指代对象。</li><li>C&quot;文戏和武戏的发展出现严重失衡&quot;：是第一句&quot;有文有武&quot;引出来的内容，不是所指。</li><li>D&quot;一些剧目和绝活濒临失传&quot;：也是例子里的具体表现，现象非观点。</li><li>B&quot;武戏传承面临多方面的严峻挑战&quot;：对应观点句&quot;技术难度大、周期长、成材率低、易受伤……面临较大挑战&quot;，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">观点+例子的指代，跳过例子找观点。判断标准：前一句是&quot;某段时间/某个人&quot;这类具体事例时，它大概率是例子，真正被指代的是它上面的观点句。</span></div>"}, {"q_num": 17, "type": "片段阅读-词句理解", "answer": "C", "analysis_html": "<p>这题有点绕，但把指代链拆开就清楚了。先读句子。</p><p>&quot;在像居里夫人这样一位崇高人物结束她一生的时候，我们不要仅仅满足于回忆她的工作成果对人类已经作出的贡献。第一流人物对于时代和历史进程的意义，在其道德品质方面，也许比单纯的<strong>才智成就</strong>方面更大。即便是<strong>后者</strong>（才智成就），<strong>它们</strong>取决于品格的程度，也远超过通常所认为的那样。&quot;</p><p>这里有两层指代链：&quot;它们&quot;承接的是&quot;后者&quot;，&quot;后者&quot;承接的是&quot;才智成就&quot;。所以&quot;它们&quot;＝<strong>单纯的才智方面的成就</strong>。最后那句晦涩的话只是补充说明&quot;即使才智成就，跟品格的关联也比我们以为的大&quot;，读不懂也不影响做题。</p><p>逐项对比：</p><ul><li>A&quot;第一流人物对于时代和历史进程的意义&quot;：这是&quot;品德+才智&quot;的总，是&quot;前者+后者&quot;之和，不是&quot;后者&quot;单独。</li><li>B&quot;道德方向的意义比才智成就方面还要大&quot;：是作者对品德与才智的比较，不是&quot;它们&quot;指代的对象。</li><li>D&quot;远超过常人的品质&quot;：属于&quot;品格程度&quot;的表述，与&quot;它们&quot;无关。</li><li>C&quot;单纯的才智方面的成就&quot;：&quot;它们&quot;→&quot;后者&quot;→&quot;才智成就&quot;，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">指代词叠指代词时，一层层往前推：&quot;它们&quot;推&quot;后者&quot;、&quot;后者&quot;再推&quot;才智成就&quot;。最后一句读不懂也没关系，指代链本身清晰就够做题，别被绕口的句子带偏。</span></div>"}, {"q_num": 18, "type": "片段阅读-主旨理解", "answer": "C", "analysis_html": "<p>这道题其实是给&quot;干扰致偏&quot;找一个比喻式的概括。先读它到底做了什么。</p><p>干扰致偏是对抗精确制导武器打击的有效手段。精确制导武器威胁大，关键在能<strong>直击要害</strong>；高精度打击的前提是要锁定目标、实时接收<strong>制导修正信号</strong>。如果制导信号被压制干扰、修正信息不准确，武器就打不准、威力大减。接着对比着说：传统伪装防护是&quot;<strong>易容术</strong>&quot;把目标藏起来；干扰致偏则是给来袭导弹戴&quot;<strong>磨砂镜</strong>&quot;，让它<strong>看不清、瞄不准</strong>，使制导机构沿错误方向偏离目标；而且它对无法转入地下的重要阵地目标防护更实用。</p><p>一句话主旨：干扰致偏＝让精确制导武器看不清、瞄不准、跑偏。</p><p>逐项对比：</p><ul><li>A&quot;伪装防护技术的&#x27;烟雾弹&#x27;&quot;：&quot;烟雾弹/易容术&quot;指的是<strong>传统</strong>伪装术（藏起来让你看不见），不是干扰致偏；干扰致偏是让你<strong>看错</strong>，不是看不见。</li><li>B&quot;导弹制导信号的&#x27;跟踪器&#x27;&quot;：干扰致偏是&quot;干扰/压制&quot;信号，不是&quot;跟踪&quot;信号，方向说反。</li><li>D&quot;地上阵地目标的&#x27;防护伞&#x27;&quot;：&quot;防护阵地&quot;是干扰致偏带来的<strong>效果/价值</strong>，不是它本身的机制。</li><li>C&quot;精确制导武器的&#x27;迷魂散&#x27;&quot;：&quot;看不清、瞄不准、偏离目标&quot;正是&quot;迷魂散&quot;的效果，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">别把两个近义比喻搞混：烟雾弹是&quot;藏起来让敌人找不到&quot;，磨砂镜/迷魂散是&quot;让敌人看错了、打偏&quot;。干扰致偏干的是后者——给你看的方向是错的，让你打在错误的地方。</span></div>"}, {"q_num": 19, "type": "语句衔接", "answer": "A", "analysis_html": "<p>先定位最后一句的&quot;这&quot;：&quot;&#x27;家天下&#x27;是政治尚贤目的的异化。<strong>这也</strong>从侧面说明了政治尚贤问题的矛盾点，已经从政权问题转换成政治问题。&quot;</p><p>&quot;这&quot;紧承前面，而&quot;家天下是政治尚贤目的的异化&quot;这句话本身比较抽象、答案里也没有直接对应，怎么办？往前找它在解释什么——第一句：&quot;当禅让制逐渐退出历史舞台，&#x27;<strong>禅让制</strong>&#x27;<strong>转向&#x27;家天下&#x27;</strong>，天下变成了帝王的&#x27;私产&#x27;，政治尚贤的目的就发生了<strong>根本性转变</strong>。&quot;这说的正是那个&quot;转变&quot;。后面讲禅让制模糊化夺权过程、李世民&quot;禅让&quot;让李渊当太上皇，都是例子，不重要。</p><p>所以&quot;这&quot;指代的是——<strong>&quot;禅让制&quot;向&quot;家天下&quot;转向</strong>。</p><p>逐项对比：</p><ul><li>B&quot;李世民通过&#x27;禅让&#x27;让李渊变成&#x27;太上皇&#x27;&quot;：例子，不是所指。</li><li>C&quot;禅让制糊（模糊）化了政治夺权的过程&quot;：这是禅让制<strong>自身的特点</strong>，不是那个&quot;转变&quot;。</li><li>D&quot;李世民夺取权利的过程与尚贤理念相违背&quot;：也是例子的细节。</li><li>A&quot;&quot;禅让制&quot;向&quot;家天下&quot;转向&quot;：对应&quot;转向家天下、天下成帝王私产、尚贤目的根本转变&quot;，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">指代的内容看不懂、答案里又没有对应时，就往前找&quot;它到底在解释什么&quot;。最后一句要说明的&quot;矛盾点转变&quot;，源头正是开头那句&quot;禅让制→家天下&quot;的根本转向，别抓成禅让制自身的某个特点。</span></div>"}, {"q_num": 20, "type": "片段阅读-细节判断", "answer": "B", "analysis_html": "<p>最后这题考的是&quot;爆炸&quot;是比喻还是夸张，以及它到底指什么。先读材料。</p><p>杨振宁还是化学实验员时，工作开展并不顺利。他朋友开玩笑说：&quot;凡是有杨振宁的地方，就会有爆炸。&quot;后来经过思考比较，杨振宁决定从化学转入物理领域，并由此展现自己的风采，最终于 1957 年与李政道联手获诺贝尔物理学奖。</p><p>关键推手是后文&quot;<strong>转行物理</strong>&quot;——为什么转？因为化学做得不顺利、总出&quot;爆炸&quot;事故，说明他在化学上<strong>操作失误严重</strong>。选项要先排除无中生有的，再排除自相矛盾的。</p><p>逐项对比：</p><ul><li>A&quot;比喻，指做实验时被同事围得水泄不通&quot;：&quot;被围观&quot;无中生有，全文只说工作不顺利。</li><li>C&quot;比喻，指化学实验成果多成为爆炸性新闻&quot;：&quot;爆炸性新闻&quot;无中生有。</li><li>D&quot;夸张，指开展的化学实验项目极具危险性&quot;：若真那么危险、就是写实，那就不是&quot;夸张&quot;了——自相矛盾，且&quot;极具危险性&quot;也没有支撑。</li><li>B&quot;夸张，指杨振宁化学实验操作失误严重&quot;：&quot;工作不顺利&quot;&quot;有他的地方就爆炸&quot;&quot;转行物理&quot;三点都指向实验总失误，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;比喻还是夸张&quot;先排无中生有（围观、新闻），再排自相矛盾的（真有危险→写实→就不是夸张）。最后用&quot;转行物理&quot;反向验证：他化学做得不行、次次&quot;爆炸&quot;，才转去物理。玩笑是用夸张手法调侃他操作失误，别当真理解成真危险。</span></div>"}]}, {"set_num": 7, "set_name": "拔高刷题七", "questions": [{"q_num": 1, "type": "片段阅读-主旨理解", "answer": "A", "analysis_html": "<p>先看题目在问什么——&quot;这段文字最可能介绍的是什么&quot;，这是<strong>主旨理解</strong>，找的是文段中心，不是接着往下猜。这道题老师在讲的时候一度把题型标成了接语，随即纠正说&quot;其实是个中心题&quot;，但最后得出结论：无论当中心还是当接语，答案都是同一个，所以我们先把文段读透。</p><p>开头交代背景，地球遭受无数次小天体撞击，绝大多数是小行星，超高速撞地表、爆炸，形成<strong>陨石坑</strong>。接着一个设问&quot;科学家如何搜寻陨石坑&quot;，答案随即跟上：线索之一是形状，因为高角度撞击让陨石坑多呈环形；但&quot;<strong>但</strong>&quot;一转——环形成因很多，火山喷发等地质活动也能形成环形坑，不一定都是小行星撞的。于是关键来了：进一步甄别要靠寻找撞击的&quot;指纹&quot;证据，即小行星撞击瞬间的高压高温会让岩石矿物<strong>冲击变质</strong>，科学家通过提取这类冲击变质证据来确定环形坑的成因。一句话主旨：<strong>怎么分辨出真正的陨石坑，靠的是冲击变质证据</strong>。</p><p>逐项对比：</p><ul><li>B&quot;地质活动是环形坑的形成原因&quot;：文段里地质活动只是被拿来当&quot;环形成因多、要排除&quot;的陪衬，不是主角，且它本身不解决&quot;怎么分辨&quot;的问题，排除。</li><li>C&quot;陨石坑出现与小行星撞击有关&quot;：这是首句引出的背景，不是后文重点，排除。</li><li>D&quot;小行星撞击会引起岩石矿物的冲击变质&quot;：中间挪挪，它只说撞击产生变质这层原理，丢掉了&quot;寻找、辨别陨石坑&quot;这根主线，属于文段里的分析环节，不是结论，排除。</li><li>A&quot;甄别陨石坑的关键是提取矿物的冲击变质证据&quot;：<strong>同义替换</strong>了文段的中心——&quot;甄别&quot;对应&quot;搜寻/分辨&quot;，&quot;提取冲击变质证据&quot;对应尾句，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这道题老师重点讲了接语与中心的一层关系：<strong>当答案里只有一个选项踩中文段核心话题时，接语答案和中心答案可以是一样的</strong>。所以别一看到&quot;结尾句&quot;就慌着往后猜，先判断这题到底问的是什么；问中心就抓&quot;搜寻陨石坑靠冲击变质证据&quot;这个结论，问接语也照样落在 A，因为其余三项话题都不在主线里。</span></div>"}, {"q_num": 2, "type": "片段阅读-下文推断", "answer": "C", "analysis_html": "<p>接语题，问&quot;接下来最有可能谈论的&quot;。先读文段：电商促销期间巨头逼卖家&quot;二选一&quot;、微信封杀淘宝客、苹果微信打赏风波，这些事件扰乱市场；&quot;随着流量红利褪去，马太效应开始显现&quot;；最后一句点出新话题——<strong>许多互联网企业已深入渗透并改变着我们生活的方方面面</strong>。</p><p>读下来能看到一个清晰的<strong>由例到类</strong>的推进：前面拿电商的恶性竞争当引子，甩出&quot;红利褪去、马太效应&quot;这个变化，然后把镜头从&quot;电商&quot;拉宽到&quot;互联网企业&quot;整体，说它们正在渗透生活的方方面面。后面要接，自然是沿着这个新话题展开——讲讲互联网企业具体怎么影响、怎么扩张。</p><p>逐项对比：</p><ul><li>A&quot;电商的促销策略&quot;、B&quot;电商削弱了人们的消费能力&quot;：都还停在&quot;电商&quot;这个引子上。材料里电商只是引出话题的<strong>例子</strong>，后面已经切换到&quot;互联网企业&quot;这个大主体了，再讲电商就跑偏了，排除。</li><li>D&quot;互联网企业如何盈利&quot;：&quot;盈利&quot;涉及钱，而原文&quot;深入渗透、改变生活的方方面面&quot;强调的是<strong>范围广、覆盖面大</strong>，跟赚钱没有关系，无中生有，排除。</li><li>C&quot;互联网企业如何快速扩张&quot;：&quot;方方面面&quot;就是范围变广、变大，<strong>同义替换</strong>成&quot;扩张&quot;，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">接语题最典型的套路就是<strong>抓尾句的核心新话题</strong>。本题前面&quot;电商&quot;是引子不做主角，尾句冒出的新话题是&quot;互联网企业渗透生活&quot;，而&quot;方方面面&quot;约等于&quot;扩张&quot;。判断 D 为什么错，就看它换没换话题：&quot;盈利&quot;是另一个维度（钱），跟&quot;范围广&quot;不是一码事——展开一定是围绕同一话题的要素，不能另起一个话题。</span></div>"}, {"q_num": 3, "type": "片段阅读-下文推断", "answer": "B", "analysis_html": "<p>接语题。文段先讲海洋碳汇成了新热点、国际社会日益看重、我国海域广阔条件扎实、沿海省份纷纷在核算、交易试点上探索，铺垫到一半，&quot;<strong>然而</strong>&quot;一个转折——由于起步晚，规章制度、行业规范、技术标准都缺乏，放眼国际也还没有被广泛认可的标准，一个活跃的交易市场远未形成，&quot;对我们既是挑战，更是机遇&quot;。</p><p>转折之后抛出的是<strong>问题</strong>：标准缺失、市场未形成。接语题里，尾句说问题，后面按常规脉络要么对问题展开、要么提对策。这里顺下去，最该说的就是&quot;这个标准体系该怎么建&quot;。</p><p>逐项对比：</p><ul><li>A&quot;我国海洋碳汇相关制度规范标准现状&quot;：问题本身是&quot;缺乏&quot;，现状就是&quot;没有&quot;，再讲现状等同于<strong>重复</strong>。展开项得有&quot;具体&quot;两个字才叫展开（比如&quot;具体现状&quot;），这里没有，排除。</li><li>C&quot;对国际海洋碳汇交易市场的远景展望&quot;：材料说的是<strong>我国的</strong>挑战与机遇，落到&quot;国际&quot;上话题就跑偏了，排除。</li><li>D&quot;沿海各省份探索海洋碳汇的具体实践&quot;：沿海探索这段出现在&quot;然而&quot;之前，已被转折甩在身后，不会拐回去再讲，排除。</li><li>B&quot;我国海洋碳汇交易标准体系建设路径&quot;：尾句&quot;标准缺乏&quot;提问题，B 直接给<strong>对策</strong>——怎么建设，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">记住接语的常规脉络：<strong>问题后面接分析，分析后面接对策</strong>；当尾句落在&quot;问题&quot;上，优先想对策。本题 A 和 D 是易混点：A 是&quot;现状&quot;（=缺什么，属于重复），D 是&quot;实践&quot;（本该放在转折前），只有 B 是&quot;建设路径&quot;这个真对策。另外文中&quot;标准&quot;就是&quot;海洋碳汇交易标准&quot;，别因为原文简写成&quot;标准&quot;就怀疑它换了话题。</span></div>"}, {"q_num": 4, "type": "片段阅读-下文推断", "answer": "A", "analysis_html": "<p>接语题。开头说&quot;舞台艺术&quot;与&quot;剧场艺术&quot;几乎成了同义词，马上&quot;<strong>然而</strong>&quot;转折：艺术创作萌芽于日常生活，剧场只是舞台艺术发展过程中的一个<strong>重要载体</strong>，不是本质；&quot;<strong>基于剧场空间形成的剧场思维</strong>&quot;不能看成本质属性，要随舞台艺术发展而变。最后落到——服务人民是出发点，人在哪里舞台就在哪里，现在网民 10.32 亿、互联网极大改变了审美习惯，言下之意是<strong>人都到网上了，剧场思维也得往互联网方向转</strong>。</p><p>这一路读下来，真正的主角是<strong>剧场思维</strong>，结论是&quot;它要突破、要转向&quot;。</p><p>逐项对比：</p><ul><li>B&quot;舞台艺术如何做到善于求新求变&quot;：讲的是整个&quot;舞台艺术&quot;这个大概念，而材料聚焦的是剧场思维这一块，话题大了，不精准，排除。</li><li>C&quot;舞台艺术与剧场艺术如何相伴相生&quot;：这是首句引出的背景，后文已经翻篇，排除。</li><li>D&quot;舞台艺术应该如何摆脱剧场而生&quot;：偷换概念。要&quot;变&quot;的是<strong>剧场思维</strong>，不是把剧场这个实体给扔了——去网上演出也照样需要场地、镜头，不是凭空演。把&quot;思维&quot;换成了&quot;剧场实体&quot;，排除。</li><li>A&quot;舞台艺术创作如何主动突破原有的剧场思维&quot;：<strong>&quot;剧场思维&quot;</strong>四个字踩准了话题，且&quot;主动突破&quot;呼应了&quot;要变&quot;，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">接语题思考量低在&quot;抓话题词&quot;这件事上——本题只有 A 带着&quot;剧场思维&quot;这个关键词，其余三项都没踩中。陷阱是 D：&quot;摆脱剧场&quot;和&quot;摆脱剧场思维&quot;差的是一个词，前者是实体、后者是观念，考点就藏在这。看到&quot;剧场载体不重要→思维要变&quot;这层递进，就不会被 D 带偏。</span></div>"}, {"q_num": 5, "type": "片段阅读-下文推断", "answer": "B", "analysis_html": "<p>接语题，问引言接下来讲什么。文段讲海外游学热：各种名目吸引家长，收入提高、理念改变、政策优化让它&quot;应时当令&quot;，游与学又&quot;寓教于乐&quot;，家长也指望孩子放松身心、开拓视野。最后一句收束——&quot;<strong>其出发点是好的</strong>&quot;。</p><p>这道题的破题点全在这六个字上。日常说话里，&quot;出发点是好的、初心是好的&quot;这类话，后面几乎永远跟着一个转折：&quot;<strong>但是结果并不怎么样</strong>&quot;。它跟&quot;无可厚非&quot;一样，是个<strong>暗含转折的提示词</strong>：前面夸它火、夸它理念好，藏着的下文一定是&quot;现实里游学搞得并不好&quot;。</p><p>逐项对比：</p><ul><li>A&quot;游学的价值&quot;：价值是&quot;好的一面&quot;，而转折提示我们要说的是&quot;不好的结果&quot;；而且&quot;寓教于乐、放松身心&quot;这些价值前面已经说过了，重复，排除。</li><li>C&quot;游学的内容&quot;：转折接的是&quot;这么干之后的社会效果如何&quot;，不是&quot;游学本身学什么&quot;。拿补课举例：目的是让你提分，结果越补越差，下文学的是&quot;效果差&quot;，不是&quot;补课内容&quot;。方向错了，排除。</li><li>D&quot;游学的历史发展&quot;：完全无关，排除。</li><li>B&quot;游学的市场状况&quot;：<strong>市场状况=这件事落地后的结果</strong>——火不火、乱不乱、有没有人买单，正是&quot;出发点是好的&quot;背后要接的转折，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">记住这一类转折提示词：<strong>&quot;出发点是好的&quot;&quot;初心是好的&quot;&quot;本意是好的&quot;</strong>，它们本身就在暗示后面要讲坏结果。知道这个点，考到基本是送分；不知道，就会在 A、C 之间瞎纠结。切记转折转的不是&quot;内容&quot;，是&quot;结果/效果&quot;。</span></div>"}, {"q_num": 6, "type": "片段阅读-下文推断", "answer": "C", "analysis_html": "<p>接语题。&quot;字如其人&quot;能看出人的<strong>人品、性格</strong>——首句抛出这个话题；中间举总统签名引发热议、笔迹专家断言其性格作例子，落到&quot;笔迹像镜子，能反映 5000 多种<strong>人格特征</strong>&quot;。&quot;人格特征&quot;不就是开头说的&quot;人品性格&quot;吗？到此，<strong>人品性格这条线已经讲完了</strong>。真正的新话题藏在最后半句：&quot;<strong>还能预示一些疾病征兆</strong>&quot;。</p><p>一个&quot;还&quot;字，把话说完了之后又往外拽出一个新话题——疾病。接语题里，前面话题已经&quot;讲完&quot;了，&quot;还/还能&quot;带出来的就是下一段要展开的对象。</p><p>逐项对比：</p><ul><li>A&quot;笔迹与性格的关系&quot;、B&quot;笔迹与人品的关系&quot;：这两条都是开头已经展开论述过的话题，再往下不会拐回去讲，排除。</li><li>D&quot;笔迹与职业的关系&quot;：全文压根没提过职业，无中生有，排除。</li><li>C&quot;笔迹与疾病的关系&quot;：正是&quot;还能预示疾病征兆&quot;引出的新话题，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这是接语题的常规送分结构：<strong>前文把话题 A（人品性格）讲完，然后用&quot;还能/此外/另&quot;引出话题 B（疾病），下文就接 B</strong>。判断的抓手是那个&quot;还&quot;字，它标志前面的内容已经收束、新话题刚刚冒出。</span></div>"}, {"q_num": 7, "type": "片段阅读-下文推断", "answer": "C", "analysis_html": "<p>接语题。&quot;千里马是赛出来的&quot;、真正的伯乐是创业创新的实践，前面都在讲创业创新<strong>积极的一面</strong>；一个&quot;<strong>相反</strong>&quot;转到反面——处于创业创新活跃期的青年，<strong>如果得不到施展才华的机会</strong>，不仅浪费丰厚的人力资本，还会抑制进取心、加重上升通道壅塞、引发失望不满。</p><p>这就是典型的<strong>反面论证</strong>：&quot;得不到机会&quot;就会有一串坏结果。反着说问题，正着就要给对策——既然缺的是&quot;机会&quot;，下文自然该讲&quot;怎么提供机会&quot;。</p><p>逐项对比：</p><ul><li>A&quot;创业与创新的关系&quot;、B&quot;创业、创新的重要性&quot;：材料的反面论证不是讲这两者，跟后文承接不上，排除。</li><li>D&quot;青年应该怎样去创业、创新&quot;：这是&quot;号召青年去创业&quot;，而文段说的是青年<strong>缺机会、需要机会</strong>，主体该是&quot;给机会的人&quot;，方向反了，排除。</li><li>C&quot;如何提供创业、创新的机会&quot;：针对反面论证的&quot;得不到机会&quot;，直接落到&quot;给机会&quot;的对策上，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">反面论证的标志是&quot;<strong>如果……得不到/不……，就会……</strong>&quot;，后面接对策才是正确走向。另一个要点：对策的<strong>内容比主体更重要</strong>。C 里&quot;青年&quot;这个主体没写也没关系，因为它踩中了&quot;提供机会&quot;这个核心；其他三项连&quot;机会&quot;这个话题都没有，纠结&quot;青年&quot;纯属多余。</span></div>"}, {"q_num": 8, "type": "片段阅读-下文推断", "answer": "C", "analysis_html": "<p>接语题。先说法治是&quot;应然&quot;，各类规则浩如烟海，然后&quot;<strong>但</strong>&quot;转折出重点——<strong>国家法律体系和党内法规体系</strong>是最有影响力的两大规则体系；十八届四中全会的《决定》把&quot;完备的法律规范体系&quot;和&quot;完善的党内法规体系&quot;纳入中国特色社会主义法治体系，确立总目标。</p><p>抓一下真正的话题：前面铺垫一堆，落脚说到底是谁？是<strong>国家法律 + 党内法规这两个体系（我们叫它 X、Y）</strong>，以及&quot;把它们俩放进法治体系&quot;这件事。所以下文该围绕 X、Y 展开——讲怎么把这两者<strong>衔接、协调、融合</strong>进体系里。</p><p>逐项对比：</p><ul><li>A&quot;中国特色社会主义法治体系的建构&quot;：错在焦点。材料讲的是&quot;把 X、Y 塞进体系里怎么塞&quot;，不是&quot;这个体系本身怎么搭&quot;。话题对象搞错了，排除。</li><li>B&quot;依法治国建设全面小康社会的构想&quot;：完全没提，无脑排除。</li><li>D&quot;建立健全党内法规体系的对应措施&quot;：只有&quot;党内法规&quot;一个，丢了&quot;国家法律&quot;，<strong>片面</strong>，排除。</li><li>C&quot;党内法规与国家法律的衔接和协调&quot;：把 X、Y 都带上了。要把两个东西放进一个体系里，必然涉及二者的衔接、融合，这是&quot;纳入&quot;过程中的具体环节，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这题给了一个&quot;无脑做法&quot;：<strong>真正的核心话题是&quot;国家法律 + 党内法规&quot;这俩</strong>，答案里只有 C 在同时聊这两个，其余要么聊体系本身、要么只聊一个。接语题看不懂细节时，就抓&quot;尾句/转折后反复出现的那两个词&quot;，选项里唯一同时踩中两者的就是答案。这里 C 不是最完美（最漂亮该是&quot;如何纳入&quot;），但它是对比之下唯一正确的。</span></div>"}, {"q_num": 9, "type": "片段阅读-下文推断", "answer": "B", "analysis_html": "<p>接语题。文段说&quot;特定的中国品牌可能会在十年内成为全球现象&quot;，靠质量、异国风味和定价行销；再引广告公司总经理的话——如果还有一个国家有创立国际品牌的最大潜力，那就是中国。结论很明白：<strong>中国最有潜力创造国际品牌</strong>。下文就该围绕&quot;有潜力&quot;这条线展开，讲讲这份潜力具体落在谁身上。</p><p>逐项对比：</p><ul><li>A&quot;中国创造国家品牌的潜力巨大&quot;：错在偷换，&quot;国际品牌/全球现象&quot;被写成了&quot;<strong>国家</strong>品牌&quot;，范围换了；即便改成&quot;国际&quot;，它也只是尾句的原样重复，没有展开，排除。</li><li>C&quot;创造国际品牌需要时间和资金&quot;：&quot;资金&quot;全文一个字没提，纯<strong>无中生有</strong>，排除。</li><li>D&quot;某些特定的中国品牌即将走向世界&quot;：这就是首句内容的复述，属于<strong>重复</strong>，没往下展开，排除。</li><li>B&quot;最有希望创造世界品牌的中国商品&quot;：说中国有潜力，自然要落到具体是哪个公司、哪个产品有机会长成世界级品牌，这就是恰到好处的<strong>展开</strong>，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">接语题里&quot;重复&quot;和&quot;展开&quot;的界线：选项只会把尾句的意思再陈述一遍（&quot;即将成为全球现象&quot;），这是重复；选项往前再推一步、落到&quot;具体是哪些/哪个&quot;（&quot;最有希望的商品&quot;），这才是展开。本题 A 的&quot;国家品牌&quot;和 D 的&quot;走向世界&quot;本质上都停在原句，只有 B 把话题具体化了。</span></div>"}, {"q_num": 10, "type": "片段阅读-下文推断", "answer": "B", "analysis_html": "<p>接语题。前面大段在铺青光眼的定义、类型、病理、高眼压损害，读得越往后越该意识到，这些都在为最后一句铺垫——&quot;因此，<strong>了解青光眼的发病特点</strong>，及早发现和治疗是非常重要的&quot;。一个&quot;因此&quot;，说明这是<strong>分总结构</strong>，前面都不重要，真正要接的是&quot;发病特点&quot;。</p><p>&quot;发病特点&quot;指的是它发病后的具体表现，说白了就是<strong>症状</strong>。</p><p>逐项对比：</p><ul><li>A&quot;青光眼是如何引起的&quot;：引起=病程/病因（为什么得这个病），而&quot;发病特点&quot;是&quot;得了之后有什么表现&quot;，完全是两码事。老师用感冒举例最清楚：受凉是&quot;如何引起&quot;（病因），流鼻涕是&quot;发病特点&quot;（症状），不能混，排除。</li><li>C&quot;青光眼的检查内容&quot;、D&quot;青光眼的治疗方法&quot;：跟&quot;发病特点&quot;没有关系，后文不会接这两个，排除。</li><li>B&quot;青光眼的具体症状&quot;：<strong>&quot;具体症状&quot;= 发病特点的同义替换</strong>，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">分总结构里&quot;因此/所以&quot;之后才是接的点，前面再长都是铺垫。易错的是 A——很多人把&quot;发病特点&quot;和&quot;如何引起&quot;混为一谈，其实一个问&quot;得病后长什么样&quot;（症状），一个问&quot;为什么得病&quot;（病因）。接语题接的是&quot;特点&quot;，就选&quot;症状&quot;。</span></div>"}, {"q_num": 11, "type": "片段阅读-下文推断", "answer": "A", "analysis_html": "<p>接语题。国家艺术团演出季开幕，亮点是惠民、票价 80 元以下；&quot;<strong>但</strong>&quot;转折——高端演出市场门票&quot;高的吓人&quot;，一场歌剧数百上千元不罕见，&quot;与国外相比，我们某些高端演出票价相对较高&quot;。读下来，整段落脚的词只有一个——<strong>票价</strong>（太高）。</p><p>下文当然还是聊票价，围绕票价展开。</p><p>逐项对比：</p><ul><li>B&quot;我国高端演出的受众定位&quot;、C&quot;国外剧院演出的周期&quot;、D&quot;我国高端演出的剧目&quot;：受众、演出周期、剧目，跟&quot;票价&quot;完全不是一个话题，属于<strong>无关项</strong>，接语题不能这样横向乱引，排除。</li><li>A&quot;国外高端演出票价&quot;：既然前面说&quot;比国外还高&quot;，后面顺势介绍国外票价多少、做个对比，正是围绕票价的<strong>展开（举例/比较）</strong>，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这道题讲清了一个重要认知：<strong>接语的&quot;展开&quot;是围绕同一话题的要素展开</strong>（原因、分析、对策、意义、举例比较），不是话题的横向关联。文段聊&quot;票价&quot;，你就只能接&quot;票价高为什么、怎么解决、跟谁比&quot;这些，不能&quot;由票价联想到受众、周期、剧目&quot;。所以 B、C、D 一眼就排掉，剩下 A 直接锁定。</span></div>"}, {"q_num": 12, "type": "片段阅读-下文推断", "answer": "B", "analysis_html": "<p>接语题。粉丝力量崛起&quot;无论喜不喜欢都得正视&quot;；业内说它是<strong>双刃剑</strong>——有好有坏，接着展开它的重要性（粉丝推动影视剧），又&quot;但&quot;一转，说它改变了文化产业生态、泥沙俱下、危机频现；最后落到&quot;<strong>当下</strong>&quot;——如果希望粉丝文化被历史看见，粉丝就应<strong>正视和善用自己的权力</strong>。</p><p>尾句是结论，也是对策：正视、善用。下文要接，就该围绕&quot;正视善用&quot;怎么展开——说白了就是一种<strong>反思</strong>。</p><p>逐项对比：</p><ul><li>A&quot;粉丝力量的作用&quot;：作用等于&quot;双刃剑、有好有坏&quot;的展开，前面已经讲过了，重复，排除。</li><li>C&quot;粉丝力量的重要性&quot;：这也是前文分析过的内容，排除。</li><li>D&quot;粉丝力量的危险性&quot;：危险性只是&quot;双刃剑&quot;里&quot;坏的一面&quot;，前文&quot;危机频现&quot;已经点到，属于旧话题的重复；而且尾句重心是对策（正视善用），不是单纯强调危害，排除。</li><li>B&quot;粉丝力量的反思&quot;：&quot;正视和善用自己的权力&quot;正是一种反思、复盘式的走向，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">尾句是<strong>对策</strong>时，下文接对策的展开。&quot;正视善用&quot;对应的心态就是&quot;反思&quot;，所以 B 是对的。A、C、D 都在重复前面&quot;作用/重要性/危险性&quot;这套旧分析，重心没跟上尾句的转折升级。判断时盯紧那个&quot;当下/应该&quot;——它标志作者开始说做法了。</span></div>"}, {"q_num": 13, "type": "片段阅读-下文推断", "answer": "A", "analysis_html": "<p>这道题问的是&quot;<strong>最不可能</strong>讲述的&quot;，是<strong>选非</strong>。先摆出接语题选非的排序规则：<strong>矛盾项 &gt; 无关项 &gt; 重复项</strong>。矛盾项后面铁定不能接，无关项次之，重复项其实可以当展开（不算致命）。</p><p>文段介绍中微子：宇宙中数量最多的次原子粒子之一，穿透人体，不带电、靠弱相互作用、极难捕获，有电子、缪子、陶子三种类型，在传播中因量子效应相互转换，这就是<strong>中微子振荡</strong>。全文都在讲中微子这个粒子本身的<strong>性质与现象</strong>。</p><p>逐项对比：</p><ul><li>A&quot;中微子对地球环境的影响&quot;：&quot;地球环境&quot;全文一个字没提，是完完全全的<strong>无关项</strong>，割裂最彻底。</li><li>B&quot;科学家对中微子性质的研究&quot;：性质（不带电、弱相互作用）提过了，但重复可以当展开，<strong>可能</strong>会接。</li><li>C&quot;中微子振荡现象的物理意义&quot;：振荡现象讲过了，聊它的意义，<strong>可能</strong>会接。</li><li>D&quot;捕获各类型中微子的科学设备&quot;：极难捕获≠捕不到，正因为难，才更值得介绍靠什么设备抓到，<strong>可能</strong>会接。</li></ul><p>A 是唯一彻底无中生有的话题，选 A。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">选非题的等级：<strong>矛盾 &gt; 无关 &gt; 重复</strong>。关键陷阱在 D——很多人以为&quot;极难捕获&quot;跟&quot;聊捕获设备&quot;矛盾，其实&quot;极难&quot;是有概率、能实现，不是&quot;完全不能&quot;，所以不矛盾。B、C 属于&quot;重复但可展开&quot;，都不是&quot;最不可能&quot;的。只有 A 这种话题完全割裂的无关项，才是铁打的最不可能。</span></div>"}, {"q_num": 14, "type": "片段阅读-下文推断", "answer": "A", "analysis_html": "<p>接语题。开头给&quot;战略决策&quot;下定义；接着说推进中国式现代化要把握全局局部、当前长远等一系列关系，不断提高七种思维能力；最后一句收束——&quot;<strong>这离不开高水平战略研究与战略咨询的支撑</strong>&quot;。</p><p>前面&quot;战略决策&quot;只是个引子，真正的落脚点是<strong>战略研究与战略咨询</strong>。接语题里，一个话题刚被引出来时，第一步常规动作就是——<strong>下定义</strong>：先讲清楚它是什么。</p><p>逐项对比：</p><ul><li>B&quot;进行战略研究与咨询的艰巨性&quot;：文段没说它&quot;难&quot;，无中生有；就算要讲难度，也应放在下完定义之后，轮不到现在，排除。</li><li>C&quot;战略决策、研究与咨询的中心任务&quot;：把&quot;战略决策&quot;和&quot;研究咨询&quot;并列了，但文段里决策是引子、研究咨询才是落脚点，二者不是并列关系，话题混了，排除。</li><li>D&quot;战略咨询对战略决策的价值所在&quot;：只聊&quot;咨询&quot;一个，把&quot;研究&quot;丢掉了；研究咨询是个整体，硬拆一半出来讲，怎么算都不对，排除。</li><li>A&quot;何为战略研究与战略咨询&quot;：引出话题后就该解释它是什么，正是<strong>下定义</strong>这一步，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">接语题的逻辑链条就是&quot;<strong>是什么→为什么→怎么办</strong>&quot;：一个新话题被引出来后，最优先接的是&quot;是什么（下定义）&quot;。本题 A 一放出来几乎无敌，因为引出后第一步必然是定义，其他几个要么无中生有、要么只拆一半话题。记住：整体话题不能拆开只聊一个。</span></div>"}, {"q_num": 15, "type": "片段阅读-下文推断", "answer": "B", "analysis_html": "<p>接语题。1945 年抗战胜利后上海恢复 30 年代的出版中心地位，文学期刊数量遥遥领先，到 1949 年这一地位被北京取代；最后一句点出关键——&quot;<strong>这其中发生的媒介生态的变化成为中国大陆文学转型的重要因素</strong>&quot;。</p><p>&quot;重要因素&quot;四个字把镜头聚焦到了<strong>媒介生态的变化</strong>上。下文要接，自然是围绕这个话题展开：先说清媒介生态是什么（下定义），再说它的变化带来的意义和影响。</p><p>逐项对比：</p><ul><li>A&quot;抗战胜利前后上海的书刊出版状况&quot;：&quot;上海&quot;是前文已经讲完的旧话题，不会拐回去，排除。</li><li>D&quot;上海作为中国书刊出版中心的地位如何得而复失&quot;：同样是前文的上海旧话题，排除。</li><li>C&quot;媒介生态因素对中国现当代文学转型的意义&quot;：有&quot;意义&quot;却少了&quot;下定义&quot;这步；更要命的是偷换概念——原文是&quot;<strong>中国大陆文学</strong>&quot;，这里写成&quot;中国<strong>现当代</strong>文学&quot;，不是一个东西，排除。</li><li>B&quot;媒介生态的概念及其变化的意义和影响&quot;：<strong>&quot;概念&quot;=下定义，&quot;意义和影响&quot;=展开</strong>，完整覆盖了&quot;媒介生态变化&quot;这个话题的全部走向，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">尾句&quot;XX 的重要因素&quot;里的 XX 就是下文要展开的核心话题。本题 B 之所以&quot;完美&quot;，是因为它做到了<strong>下定义 + 讲意义</strong>两段都齐；C 输在两个地方——少了下定义，还把&quot;大陆文学&quot;偷换成&quot;现当代文学&quot;。接语题抓话题时，顺手扫一眼选项里的<strong>概念偷换</strong>。</span></div>"}, {"q_num": 16, "type": "片段阅读-下文推断", "answer": "C", "analysis_html": "<p>接语题，这是本套里的难题之一，正确率极低，但它考的是你能不能&quot;读进去&quot;。文段：城市患上住房挤、交通堵、环境污等&quot;城市病&quot;，<strong>表面上看</strong>可以通过减少需求、缩小供需差距来解决；&quot;<strong>但是</strong>&quot;——从城市整体角度看，需求由市场规律决定的劳动力等要素集聚决定，与城市吸引力、辐射力相关，人为控制集聚规模相对市场力量&quot;微不足道&quot;。</p><p>翻译一下：<strong>&quot;表面靠减少需求&quot;这条路，实际上走不通</strong>——你想靠把人数压下去来解决，可人该来的还是会来，人为控制挡不住。&quot;表面…但是…&quot;这个结构，本身就是&quot;表面可行、实际不行&quot;的提示。</p><p>既然&quot;减少人&quot;不行，那怎么办？反过来——<strong>把盘子做大</strong>：人减不掉，就把交通、环境这些设施搞好，提高城市的承载力。</p><p>逐项对比：</p><ul><li>A&quot;协调供需关系是治理城市病的关键&quot;：&quot;协调供需/减少需求&quot;就是开头说的&quot;表面办法&quot;，已经被&quot;但是&quot;否定掉了，还选它就是把被推翻的旧方案当答案，排除。</li><li>B&quot;控制人口是治理城市病的关键&quot;、D&quot;控制城市规模是治理城市病的关键&quot;：本质都是&quot;人为控制&quot;，可行性已经被原文驳倒；再说&quot;控制&quot;这个词本身是&quot;往小了管&quot;，理解成&quot;扩大&quot;不合常理，排除。</li><li>C&quot;治理城市病要加强环境、交通建设&quot;：正好对应&quot;扩盘子&quot;——减不了人，就把环境、交通治理好来提高承载力，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">表面…但是…的结构里，&quot;但是&quot;后面否定的东西绝不能选。本题 A、B、D 都踩在&quot;减少需求/控制规模&quot;这同一套被否定的老路上，只有 C 是&quot;换一种思路做增量&quot;。有人问 C 不解决住房，老师点得透：住房这种结构性难题写作者自己都给不出解法，自然也不考你；能解决的（环境、交通）先解决，这就是最合理的接续。</span></div>"}, {"q_num": 17, "type": "片段阅读-下文推断", "answer": "D", "analysis_html": "<p>接语题里的&quot;最不可能涉及&quot;，<strong>选非</strong>。文段：中国古代书画鉴定是鉴定里最复杂、最有难度的部分；《功甫帖》真伪之争演变成媒体论战；&quot;全民收藏&quot;和发达网络让更多人熟悉了&quot;双钩廓填&quot;等术语，但绝大多数人面对考证文章莫衷一是，冷僻的学术问题变成了热闹的娱乐焦点。</p><p>话题围绕&quot;中国古代书画鉴定&quot;及其在当下网络时代的遭遇展开。选非的排序还是那套：矛盾 &gt; 无关 &gt; 重复。</p><p>逐项对比：</p><ul><li>A&quot;如何正确认识中国古代书画鉴定&quot;、B&quot;中国古代书画鉴定该如何发展&quot;：都紧扣&quot;中国古代书画鉴定&quot;这个话题，<strong>可能</strong>接，排除。</li><li>C&quot;网络时代学术该保持怎样的警醒&quot;：文段反复在讲学术议题变成娱乐焦点，顺着提出&quot;要保持警醒&quot;的对策，讲得通，<strong>可能</strong>接，排除。</li><li>D&quot;中国古代是如何鉴定书画真伪的&quot;：这里偷换了概念——文段的&quot;中国古代书画鉴定&quot;是指<strong>现代人鉴定&quot;古代的书画&quot;</strong>（古画是宾语），而 D 变成了&quot;<strong>古代（时候）</strong>是如何鉴定书画的&quot;（&quot;古代&quot;成了时间状语）。说白了，一个是&quot;鉴定古代书画&quot;，一个是&quot;古代鉴定书画&quot;，完全是两码事，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这题的坑非常隐蔽：<strong>&quot;中国古代书画鉴定&quot;是&quot;鉴定中国古代书画&quot;的倒装表达</strong>，宾语是画、时间是现在；D 却把它读成&quot;中国古代的时候鉴定书画&quot;。别看串——&quot;古代&quot;到底是修饰&quot;书画&quot;还是修饰&quot;鉴定&quot;，一个是宾语定语、一个是时间状语，方向整个反了。</span></div>"}, {"q_num": 18, "type": "片段阅读-下文推断", "answer": "B", "analysis_html": "<p>接语题，也是难度很高的一道（当年的正答率只有 23%）。文段：先秦创造了灿烂的青铜文明，商代后期达到鼎盛；鼎是宗庙重器、王权象征，所以王朝更迭叫&quot;定鼎&quot;&quot;迁鼎&quot;；最后说，中国古代青铜艺术展是国博改扩建后推出的重要专题展，展出<strong>国博馆藏的一批古代青铜器</strong>。</p><p>落脚点在最后——这是一个<strong>展览</strong>，展的是<strong>青铜器</strong>。下文的舞台上就是这些青铜器，接下来自然要介绍具体的青铜器（比如某件重器）。</p><p>逐项对比：</p><ul><li>A&quot;中国古代青铜文明的悠久历史&quot;：这是首句提过的背景，后文不会拐回去讲它，排除。</li><li>C&quot;国家博物馆改扩建的意义&quot;：改扩建只是&quot;展览&quot;这件事的来由/过程，重点是&quot;展出了什么&quot;，讲扩建意义就跑偏了，排除。</li><li>D&quot;古代青铜器在王朝更迭中扮演的角色&quot;：这是前文&quot;定鼎、迁鼎&quot;那段背景，同属旧话题，排除。</li><li>B&quot;后母戊鼎的传奇经历、丰富内涵&quot;：后母戊鼎正是商代青铜器的典型代表、是&quot;展出的青铜器&quot;之一，把这个具体重器拿出来讲，就是顺理成章的<strong>展开</strong>，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这题的价值在心态：<strong>别怕&quot;看似无中生有&quot;的选项</strong>。很多人不认识后母戊鼎、又在文段里找不到它，就不敢选 B，转去 A、C、D 里硬凑一个。但接语（乃至中心题）里&quot;必中选项&quot;经常和原文&quot;几乎不沾边&quot;——它其实是话题的<strong>具体展开</strong>。当其他三项都确定错时，那个看似陌生的选项反而就是答案。排除法要敢用到底。</span></div>"}, {"q_num": 19, "type": "片段阅读-下文推断", "answer": "C", "analysis_html": "<p>接语题。文段是引言：北京何来？王光镐在《北京——人类文明的圣殿》里讲述了北京的<strong>地脉、人脉、城脉、文脉、气脉</strong>诸类，逐一对应——地理特征（地脉）、史前年代（人脉）、文明早期（城脉）、帝都拓展（文脉）、民族多元一统与信仰（气脉）。</p><p>这是一个<strong>多并列</strong>结构：地、人、城、文、气五条线并排。接语题里遇到多并列，规律很固定——<strong>按并列的顺序一个一个展开</strong>，先说第一条，再说第二条……所以下文该从&quot;地脉&quot;讲起。</p><p>逐项对比：</p><ul><li>A&quot;北京文脉的多元融合&quot;、&quot;B&quot;北京人脉的古老悠远&quot;、&quot;D&quot;北京城脉的底蕴深厚&quot;：文、人、城，顺序都比&quot;地脉&quot;靠后，不会跳着先讲，排除。</li><li>C&quot;北京地脉的特别之处&quot;：排在最前面的就是&quot;地脉&quot;，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">多并列的接语题是&quot;送分固定题型&quot;：原文按照 A、B、C、D 的顺序并列列举，下文就按这个顺序<strong>从头往后一个个展开</strong>。本题&quot;地脉、人脉、城脉、文脉、气脉&quot;对应 C、B、D、A，第一顺位是&quot;地脉&quot;，锁定 C。看到&quot;（诸多 XXX）&quot;式的总起并列，先顺手给它们排个号，答案就出来了。</span></div>"}, {"q_num": 20, "type": "片段阅读-下文推断", "answer": "B", "analysis_html": "<p>接语题。郑板桥说&quot;聪明难、糊涂难、由聪明而转入糊涂更难&quot;，画论说&quot;大拙便是巧处，大巧更是拙处&quot;。&quot;表面看来&quot;，糊涂和拙都是较高境界；&quot;问题是你千万别忘了&quot;——<strong>那糊涂是从聪明生出来的，拙朴是巧妙之后达到的</strong>。</p><p>&quot;表面看来……但别忘了……&quot;这个结构，同样在转折：糊涂、拙是&quot;高境界&quot;没错，但它的<strong>前提</strong>是先有聪明、先用巧。所以下文要强调的不是&quot;去糊涂&quot;，而是——<strong>你得先成为一个聪明人</strong>。</p><p>逐项对比：</p><ul><li>A&quot;人们要揣着明白装糊涂&quot;：材料讲的是&quot;聪明到头自然显得糊涂&quot;（大智若愚），没让你&quot;装糊涂&quot;；&quot;揣着明白装糊涂&quot;多了个&quot;装&quot;，方向不对，排除。</li><li>C&quot;做人处事该糊涂时就糊涂&quot;、D&quot;聪明人该糊涂时就糊涂&quot;：这俩都在聊&quot;什么时候该装糊涂、何时选择糊涂&quot;，而文段讲的是糊涂的<strong>前提</strong>（先聪明），不是何时糊涂，方向反了，排除。</li><li>B&quot;人们要先学聪明再学笨&quot;：<strong>&quot;先学聪明&quot;正对应&quot;糊涂是从聪明生出来的&quot;</strong>，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;表面看来……（实际上）但别忘了……&quot;是转折提示，&quot;别忘了&quot;后面才是作者真正想说的——糊涂的前提是聪明。C、D 都在问&quot;何时糊涂&quot;，但文段压根没讨论&quot;时机&quot;，讨论的是&quot;顺序/前提&quot;。抓住&quot;那糊涂是从聪明出来的&quot;这句，答案只会是先聪明。</span></div>"}]}, {"set_num": 8, "set_name": "拔高刷题八", "questions": [{"q_num": 1, "type": "语句衔接", "answer": "A", "analysis_html": "<p>先看横线位置——它在文段最后，紧接&quot;____服务群众才会更加精准、更有实效&quot;，所以这一空要填出&quot;让服务更精准&quot;的方法。</p><p>顺着读。&quot;用家常话将政策解释清只是第一步&quot;，一个&quot;只是&quot;先把&quot;解释清&quot;降格了——还不够；&quot;更需要读懂群众家常话背后的喜怒哀乐&quot;才是重点。为什么？因为家常话里有群众的<strong>关切点</strong>、有政策落地的<strong>发力点</strong>：下面&quot;社会救助&quot;不是抽象名词而是张大爷的医药费、&quot;产业援兴&quot;是李大姐柑橘园里的累累硕果，都是用具体例子证明家常话背后藏着群众的真实需求。由此推出：要精准、要实效，就得先抓准这些关切点、需求点。</p><p>对比选项：</p><ul><li>A&quot;找准大家的关切事&quot;：&quot;找准&quot;对应后文&quot;精准&quot;，&quot;关切&quot;对应前文&quot;关切点&quot;，前后完美衔接，选 A。</li><li>B&quot;将群众的需求装心里&quot;：只&quot;装心里&quot;不够，核心不是需求放哪儿，而是要先<strong>找到、读懂</strong>群众真正需要什么。</li><li>C&quot;多下笨功夫啃硬骨头&quot;：这是&quot;攻坚克难&quot;的意思，文段根本没提难点、困难，无中生有。</li><li>D&quot;常进老乡门常聊家里事&quot;：看着接了&quot;家常话&quot;，但光聊够不到&quot;精准&quot;——只是多了接触，和&quot;精准&quot;没有必然联系。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">语句衔接讲究&quot;前后都搭&quot;。这题最大的坑是 D——被&quot;家常话&quot;三个字带跑。判断标准很简单：若填 D，后面结果应该是&quot;拉近了距离、沟通了感情&quot;，而题干结果偏偏是&quot;更精准、更实效&quot;，方向对不上就果断排除；A 与&quot;精准、关切&quot;严丝合缝，才是答案。</span></div>"}, {"q_num": 2, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>这道题横线在段中，前后读下来都在讲同一件事——故宫学<strong>大而全</strong>，所以中间这空八成要顺着这个方向填。</p><p>前文：故宫学研究已实现对中华民族现代文明的有力阐释，已发展成为一门独立的综合性交叉学科，内容包括明清宫廷史、故宫文物、院史等，具备整体性、综合性、实践性、跨学科性、国际性等特点。后文：从学科建设看，它是继敦煌学之后又一依托世界文化遗产地发展起来的综合性学科，涉及的命题不止故宫文物，还包括明清乃至传统中国的国家形态、政权运作、经济制度、文化理念等。前面说&quot;综合&quot;，后面还说&quot;综合&quot;，前后一致，中间就该填一个&quot;它是个涉及面很广的大活&quot;。</p><p>对比选项：</p><ul><li>A&quot;故宫学成为……治院理念的重要组成部分&quot;：全文没提&quot;治院理念&quot;，无中生有。</li><li>B&quot;还承担了另外一个重要使命&quot;：&quot;使命&quot;是任务、要完成的目标，后文只讲它对中华文明有价值、有意义，没讲任何任务，排除。</li><li>C&quot;因此都历史性带有中国自主的学术意味&quot;：一是&quot;都&quot;字用法别扭（主语就故宫学一个）；二是前文明写&quot;国际性&quot;、学科又依托世界文化遗产，得不出&quot;中国自主&quot;。</li><li>D&quot;是不断开放，面向未来的一个非常重要的大学科&quot;：&quot;大学科&quot;承接前文的&quot;综合、涉及面广&quot;，&quot;开放&quot;对应国际、跨学科、依托世界，&quot;面向未来&quot;对应它仍在不断发展。D 是对&quot;综合性&quot;的承上启下，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">B、D 都带点&quot;没直接讲&quot;的色彩，但 B 整句都是无中生有，D 至少还挂着&quot;大学科&quot;能对接前文的&quot;综合性&quot;。考场上分不出时，就比谁还剩着能对上的词——D 有、B 没有。衔接题很多纠结点不是靠找到完美答案，而是靠比较择优。</span></div>"}, {"q_num": 3, "type": "语句衔接", "answer": "A", "analysis_html": "<p>这题开头的横线是整段的总起，下面全是例子和总结，所以先看后面在说什么。</p><p>袁隆平一生扎根稻田培育杂交水稻、&quot;时代楷模&quot;张玉滚坚守深山小学二十余载、&quot;大国工匠&quot;高凤林焊接火箭发动机、&quot;人民楷模&quot;王继才 32 年坚守开山岛……这些人来自稻田、学校、工厂、海岛，分属农业、教育、工业、国防，各不相同；收尾又用&quot;一位位典型、一次次洗礼&quot;、全社会&quot;认同&quot;&quot;效仿&quot;&quot;崇德向善&quot;来总结。这么多例子、这么多行业、这么浓的氛围，翻来覆去其实就一个字——<strong>多</strong>。</p><p>对比选项：</p><ul><li>A&quot;处处可见光彩绽放的职业道德之花&quot;：&quot;处处可见&quot;正好呼应&quot;多&quot;——典型多、行业多、氛围浓，选 A。</li><li>B&quot;职业道德建设开创新局面、展现新气象&quot;：&quot;新局面、新气象&quot;要么是无中生有（文段没这么直接说），要么就是&quot;多&quot;的模糊说法，不如 A 明确。</li><li>C&quot;&quot;敬事而信&quot;&quot;鞠躬尽瘁&quot;的敬业精神代代相传&quot;：&quot;代代相传&quot;是时间上的传承（一代传一代、师徒相续），文段讲的是<strong>各行各业</strong>各有人才，没有时间传承关系；而且&quot;敬业&quot;太窄，王继才守岛靠的是信念与担当，不能全塞进&quot;敬业&quot;里。</li><li>D&quot;每个行业都践行着……工匠精神&quot;：&quot;工匠精神&quot;只出自高凤林焊接发动机那一个例子，是例子的一部分，既片面又非重点。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">总起句填空中，先数一数后面的例子&quot;在并列什么&quot;。本题例子横跨农业、教育、工业、国防，总结又用&quot;一位位、一次次、全社会、浓厚&quot;，落点就是&quot;多、广&quot;；C 的&quot;代代相传&quot;偷偷换成了时间维度，跟&quot;跨行业&quot;不是一回事，别被&quot;传&quot;字带偏。</span></div>"}, {"q_num": 4, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>这题横线前面是个分号，明显是并列：前一句&quot;通过更新提升基础设施____&quot;，后一句&quot;通过打造 15 分钟生活圈、增建配套设施及专项服务设施，满足物质和精神需求&quot;。那么前一句填的，就该是<strong>基础设施带来的好处</strong>。</p><p>关键是想清楚&quot;基础设施&quot;带来的是什么好处。水、暖、气、电、网、路、消防、安防，这些跟&quot;好不好看&quot;没关系，跟&quot;住着舒不舒服&quot;直接相关——今天断水断电、明天断气断网，日子就难过了；把这些搞好了，提升的是<strong>居住质量</strong>。</p><p>对比选项：</p><ul><li>A&quot;小区的内外环境旧貌换新颜&quot;：这是外在视觉的翻新（刷墙、绿化、搞得漂亮），而水电气网是<strong>功能</strong>的提升，不是样貌的变化，排除。</li><li>B&quot;可以极大提高居民的居住质量&quot;：基础设施都是居住的底子，提升它们就是提高居住质量，选 B。</li><li>C&quot;大大提升居民的幸福生活指数&quot;：太宏观了。它适合做<strong>尾句</strong>的总结（美好生活，两个分句合起来），不能单独对应&quot;基础设施&quot;这一半，对应不上就排除。</li><li>D&quot;可以让小区改造工作事半功倍&quot;：全文讲的是给居民带来的好处，没提改造自身的效率高低，无中生有。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">两个&quot;通过……可以……&quot;排比，句式一致，填句也要跟上&quot;可以带来好处&quot;的结构——所以一眼能看出 A、C 跟排比句式不搭。再看 A 把&quot;功能提升&quot;误解成&quot;外观翻新&quot;，D 讲成&quot;改造效率&quot;，都错位。抠清&quot;基础设施=宜居&quot;这层，B 就稳了。</span></div>"}, {"q_num": 5, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>先看结构——&quot;然而&quot;是转折，前面的&quot;科学家得以绕过传媒中介普及成果&quot;说的是技术给科学家带来的<strong>方便</strong>；那么转折之后，就该讲技术带来的另一面，方向先锁定在&quot;对科学家的影响&quot;上。</p><p>往后读。&quot;专家场域与大众讨论场域并存、专业话语与日常交流交织&quot;，传播复杂多样；关键在下一句：走向在线公共场域的科学家&quot;不再只是知识的生产者，更成为被观看、被评判、被期待的公共人物&quot;，接着&quot;如何理解、扮演并反思其传播角色&quot;成了根本问题。抓住两个词的变化：以前是&quot;生产者&quot;，现在是&quot;公共人物&quot;——<strong>角色</strong>的定位变了，重头戏是&quot;扮演好这个角色&quot;。</p><p>对比选项：</p><ul><li>A&quot;算法加持下……使科学传播产生悖论&quot;：文段只说&quot;媒介技术&quot;更迭，没提&quot;算法&quot;；后文是&quot;复杂、多样&quot;，也不是&quot;悖论&quot;（矛盾对立），无中生有。</li><li>C&quot;科学家需要根据不同的场域情况及时调整传播方式&quot;：文段变的是&quot;角色扮演&quot;，没说要改&quot;传播方式&quot;，偷换对象。</li><li>D&quot;科学家能否取得公众信任是科学传播的关键问题&quot;：&quot;公众信任&quot;是尾句的效果、意义，不是核心；核心是&quot;当好角色&quot;。而且 D 跟前文的&quot;技术对科学家好&quot;搭不上，起不了转折。</li><li>B&quot;技术方面的便利也给科学家的角色带来了深刻变革&quot;：&quot;技术便利&quot;承上，&quot;角色变革&quot;引下，正是&quot;生产者→公共人物&quot;的概括，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">转折挖空，先想&quot;前半句好话、后半句另一面&quot;的对应。真正的落点是&quot;角色&quot;而非&quot;信任&quot;——尾句&quot;不再只是技术问题，更关乎……&quot;里，核心是前面那个&quot;如何理解并扮演角色&quot;，别被
