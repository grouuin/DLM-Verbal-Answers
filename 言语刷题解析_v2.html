uot;跌宕起伏&quot;：起起伏伏、有高有低——既和&quot;高低错落&quot;近义并列，又正是&quot;音调高低变化跳动&quot;，和&quot;乐章、音符&quot;的比喻完美呼应，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这题是&quot;双轨对应&quot;：既要满足顿号<strong>并列</strong>（近义），又要满足后文<strong>比喻</strong>（音乐）。只满足一个（比如&quot;高低错落&quot;能和&quot;起伏&quot;并列，但还要能搭上&quot;乐章&quot;）不算到位。别只看词能不能形容建筑群，要看整体对应。</span></div>"}, {"q_num": 8, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;公立医院要____公共卫生职责&quot;。</p><ul><li>A&quot;贯彻&quot;、D&quot;推行&quot;：贯彻配&quot;政策、方针、精神&quot;，推行配&quot;方案、制度&quot;，都不能配&quot;职责&quot;，排除。</li><li>B&quot;落实&quot;职责、C&quot;履行&quot;职责都能讲，先留。</li></ul><p>第二空&quot;这是坚持公立医院的____重要目标&quot;。后面&quot;人民健康、看病可负担、得实惠&quot;。</p><ul><li>关键词&quot;公立&quot;——公立医院的核心属性就是<strong>公益</strong>（不以盈利为目的），&quot;公对公&quot;，B&quot;公益性&quot;直白、准确。</li><li>A&quot;保障性&quot;、D&quot;惠民性&quot;都&quot;凑合能用但不够精准&quot;，C&quot;协作性&quot;最差——文段压根没讲&quot;医院跟谁合作&quot;。</li></ul><p>所以选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;公益≠完全免费&quot;，是不以盈利为<strong>目的</strong>（医保就是国家贴钱）。别因为&quot;看病还要花钱&quot;就排斥&quot;公益性&quot;。第一空&quot;职责&quot;只能配&quot;履行/落实&quot;，&quot;贯彻/推行&quot;对象是政策制度。</span></div>"}, {"q_num": 9, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;____的阻隔，是阻碍情感交流的原因&quot;，后面&quot;语音、视频……是缩短<strong>空间</strong>距离&quot;。</p><ul><li>前文问题、后文对策要对应：既然对策是&quot;缩短空间距离&quot;，阻隔就是&quot;空间/地域&quot;。</li><li>A&quot;时空&quot;：时空＝时间＋空间，但文段只有空间、没有时间，词义&quot;超了&quot;（多余），排除。</li><li>C&quot;环境&quot;（生活条件）、D&quot;信息&quot;跟&quot;地理距离&quot;都没必然关联，排除。</li><li>B&quot;地域&quot;：地域的间隔（你在东北我在安徽）就是空间阻隔，选 B。</li></ul><p>第二空&quot;语音聊天、视频通话，其____便是缩短空间距离&quot;，&quot;初衷&quot;（本来的目的）验证通行。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;词义超了&quot;和&quot;词义不足&quot;一样错：一个词能拆成 A＋B 两部分，若 B 部分文段没有，就是语义过多，不能选（&quot;时空&quot;里有&quot;时&quot;但文段没时间）。这是近义词辨析的重要角度。</span></div>"}, {"q_num": 10, "type": "逻辑填空", "answer": "A", "analysis_html": "<p>第二空是核心：李白为什么想在这首诗上争高下？——因为在他擅长的领域，崔颢竟取得了杰出成就，他心里放不下。</p><ul><li>关键点：<strong>李白没输</strong>，两首诗谁高谁下最终&quot;没有定论&quot;，他只是&quot;没赢&quot;而不爽。</li><li>B&quot;望尘莫及&quot;（远远比不过）、C&quot;心有不甘&quot;（输了不服）、D&quot;自惭形秽&quot;（觉得不如人、惭愧）——全都预设&quot;李白输了&quot;，但文段并没有输赢结论，他正是自认为厉害才去争，这三个全错。</li><li>A&quot;耿耿于怀&quot;：在心里一直挂念、难以释怀（惦记着没争出个结果），正合&quot;没输也没赢、但不甘心&quot;，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这道题的&quot;下意识的坑&quot;是很多人默认&quot;李白输了&quot;。看清逻辑：没定论＝没输。<strong>心有不甘、望尘莫及、自惭形秽都要求&quot;已经输了&quot;或&quot;自认不如&quot;</strong>，代入题干才能发现用不上。</span></div>"}, {"q_num": 11, "type": "逻辑填空", "answer": "C", "analysis_html": "<p>公众号拔高刷题里，这道题正确率四成，坑在第二空&quot;修剪&quot;。</p><p>第一空&quot;____市场和趋势&quot;：</p><ul><li>B、D 的&quot;明察&quot;（明察秋毫）侧重<strong>看得细、辨是非</strong>；对&quot;趋势&quot;要的是&quot;看透本质、预判未来&quot;，用得是&quot;洞察&quot;，不是&quot;看得细&quot;，排除 B、D，留 A、C。</li></ul><p>第二空&quot;以监管之剪____那些歪枝烂花&quot;：</p><ul><li>烂花就要<strong>剪掉、除掉</strong>，是&quot;剔除&quot;。</li><li>A&quot;修剪&quot;是坑：修剪是一整套行为（修修枝、剪剪花，整体维护一棵树/一盆花）；对&quot;已经烂掉的花&quot;，你要么不要它、直接剪掉，谈不上&quot;修&quot;。所以对&quot;歪枝烂花&quot;这个具体对象，用&quot;剔除&quot;才准，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;修剪＝整体行为，剔除＝针对具体烂枝&quot;。烂掉的东西不存在&quot;修&quot;，只能&quot;除&quot;。这考的是<strong>词义的范围</strong>：大动作（修剪）包含小动作（剔除烂花），题干给的是小动作的对象，就选小动作的词。</span></div>"}, {"q_num": 12, "type": "逻辑填空", "answer": "A", "analysis_html": "<p>读题干：一场场宣传宣讲、一个个思政课堂，都在____广东的生动实践。</p><ul><li>B&quot;倾诉&quot;：把内心的情绪、委屈<strong>宣泄</strong>出来（心情不好找朋友倾诉），对象是情感，不是&quot;实践&quot;，排除。</li><li>C&quot;倾听&quot;：是&quot;听&quot;，但这里是宣讲（你要讲，群众听），主体和方向都反了，排除。</li><li>D&quot;传达&quot;：①搭配错——传达配&quot;精神、指令&quot;，不配&quot;具体实践&quot;；②太<strong>生硬机械</strong>——跟群众宣讲要有感情、接地气，传达像&quot;照本宣科下命令&quot;，感情色彩不符，排除。</li><li>A&quot;诉说&quot;：把内容、故事、情感讲出来，且带感情，配&quot;宣讲、实践&quot;最贴，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这题抓两个点：一是<strong>对象搭配</strong>（倾诉配情感、传达配指令精神、倾听是&quot;听&quot;），二是<strong>感情色彩</strong>（宣讲要接地气、有温度，排除生硬的&quot;传达&quot;）。</span></div>"}, {"q_num": 13, "type": "逻辑填空", "answer": "C", "analysis_html": "<p>第一空&quot;进一步____了强大力量&quot;。</p><ul><li>关键区分&quot;凝聚&quot;和&quot;汇聚&quot;：<strong>汇</strong>＝把东西单纯聚在一起（像水汇流成河，只是放在一块）；<strong>凝</strong>＝不仅聚在一起，还拧成一股、心往一处使（像几根钢筋拧成一根大钢筋），体现&quot;万众一心&quot;。</li><li>&quot;强大力量&quot;要的是凝心聚力、一起发力，不是单纯堆放，故选&quot;凝聚&quot;，留 A、C。</li></ul><p>第二空&quot;____了宏伟蓝图&quot;：</p><ul><li>&quot;擘画&quot;专配<strong>长远规划、未来蓝图</strong>，&quot;擘画蓝图&quot;是现成好搭配；&quot;描摹&quot;是照着原样画、复刻，配蓝图不如&quot;擘画&quot;。锁 C。</li></ul><p>第三空&quot;____了改革强音&quot;：&quot;发出强音&quot;&quot;奏出强音&quot;都说得通，不必死抠（老师认为都不错），前两空已足以定 C，选 C。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;凝聚 vs 汇聚&quot;是高频辨析：汇聚＝聚在一起，凝聚＝聚成一体、同心同力（对应&quot;力量、人心&quot;）；&quot;擘画&quot;配蓝图/规划（指向未来），&quot;描摹&quot;配当下已有之物（复刻原样）。</span></div>"}, {"q_num": 14, "type": "逻辑填空", "answer": "A", "analysis_html": "<p>文段讲新疆植物在特殊地理气候下&quot;具备多样性、逆境的结构机能，携带多样的功能性机能&quot;。</p><p>第一空&quot;具备____逆境的结构与机能&quot;。这是<strong>适者生存</strong>——环境恶劣，谁适应谁活，不适应就淘汰。</p><ul><li>A&quot;适应&quot;直接对应进化论里&quot;适者生存&quot;的固定用法，最优。</li><li>B&quot;克服&quot;（主观努力扭转局面）、C&quot;扭转&quot;（扭转局面）、D&quot;突破&quot;（突破封锁）——都带<strong>强烈主观能动性</strong>，可植物是被动筛选的（冻死一批、活下一批），没有&quot;去克服、去突破&quot;的主观行为，三个都太强、不准确。</li></ul><p>第二空&quot;____了多样的功能性机能&quot;，&quot;携带&quot;（具备这些机能）通顺验证。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这题老师明确建议<strong>用&quot;最优选＋验证&quot;做，不要硬排 B/C/D</strong>：一眼看到&quot;适应&quot;（适者生存）就是最优，第二空&quot;携带&quot;能通，直接选 A 走人。B/C/D 的硬伤（主观性太强）不是秒排项，硬抠反而浪费时间。</span></div>"}, {"q_num": 15, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;生长在____之家&quot;，前面&quot;大清重臣之后&quot;。</p><ul><li>A&quot;花天酒地&quot;：吃喝玩乐、沉溺享乐，贬义。而后面说她外祖父殚精竭虑挽救大清、&quot;值得敬佩&quot;，是个好家庭，消极词不能用，排除 A。</li><li>B&quot;钟鸣鼎食&quot;（富贵之家）、C&quot;鼎鼎有名&quot;（名气大）、D&quot;鲜衣美食&quot;（生活优渥）都说得通，先留。</li></ul><p>第二空&quot;外祖父殚精竭虑、____，虽未成功但值得敬佩&quot;。</p><ul><li>C&quot;费尽心机&quot;、D&quot;挖空心思&quot;：都是<strong>贬义</strong>（费力盘算、动坏心思），和&quot;值得敬佩&quot;不合，排除。</li><li>B&quot;惨淡经营&quot;：费尽心思、苦心谋划经营，是<strong>褒义</strong>好词，正合&quot;殚精竭虑挽救危局&quot;，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;惨淡经营&quot;是褒义词（苦心谋划），&quot;费尽心机/挖空心思&quot;是贬义词——靠感情色彩就锁 B。&quot;花天酒地&quot;明显消极，先排掉。成语填空先看褒贬，往往能直接确定。</span></div>"}, {"q_num": 16, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;看大意、____地看故事消磨时间&quot;。</p><ul><li>C&quot;一目十行&quot;：读得快。读得快≠看大意（有人读得快也读得细），这是<strong>速度</strong>和<strong>质量</strong>两码事，排除。</li><li>D&quot;漫不经心&quot;：态度随意、不专心，带贬义（批评马虎）。文段说的是&quot;阅读方式&quot;（看大意 vs 细品），不是&quot;态度散漫&quot;，排除。</li><li>A&quot;走马观花&quot;（粗略浏览）、B&quot;囫囵吞枣&quot;（不咀嚼、不消化）都能表&quot;不细看&quot;，留。</li></ul><p>第二空&quot;细细品味，去寻找构思、寻找文外的寓意&quot;，去哪里找？——<strong>去文章的字里行间</strong>找。</p><ul><li>&quot;字斟句酌&quot;是一字一字推敲（多用于写作、措辞），不是&quot;找&quot;；&quot;全神贯注&quot;形容状态；&quot;片言只语&quot;是零碎少量的话，细品肯定不是&quot;只言片语&quot;里找。</li><li>B&quot;字里行间&quot;正是&quot;文章文字里面&quot;，对应&quot;去字句里找构思、找寓意&quot;，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第一空真题干是对应点&quot;消磨时间、看大意&quot;，但三词都能&quot;不细看&quot;，区分要第二空。第二空看逻辑：找构思→去哪儿找→&quot;字里行间&quot;（文章里面）。&quot;一目十行&quot;考的是&quot;快≠粗&quot;这个易混点。</span></div>"}, {"q_num": 17, "type": "逻辑填空", "answer": "A", "analysis_html": "<p>说&quot;社会治理重心在基层，最大的是____&quot;，后文&quot;强化党在基层组织的<strong>领导核心</strong>地位&quot;。</p><ul><li>关键对应&quot;核心&quot;：核心在<strong>中间</strong>，党在中间当&quot;主心骨&quot;，周围的人围绕它形成圈——这是&quot;稳定&quot;，不是&quot;方向&quot;。</li><li>B&quot;晴雨表&quot;（反映局势变化）、D&quot;温度计&quot;（衡量好坏）都指向&quot;看形势好坏&quot;，但党领导不是用来&quot;看好坏&quot;的，排除。</li><li>C&quot;指南针&quot;（指引方向）：方向一般说&quot;领头、灯塔、走在前面带路&quot;；文段讲的是&quot;以党为核心围绕工作&quot;，是&quot;主心骨、稳定&quot;而非&quot;带方向&quot;，排除。</li><li>A&quot;压舱石&quot;（镇住船身、稳定全局），选 A。</li></ul><p>再补一个搭配角度：&quot;最大的&quot;修饰——指南针要的是&quot;准&quot;、不需要&quot;大&quot;；压舱石<strong>越大越重越稳</strong>，&quot;最大的压舱石&quot;才配得上，A 更优。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">两个抓手：①&quot;核心（在中间）→稳定&quot;而非&quot;方向&quot;；②&quot;最大的&quot;配&quot;压舱石&quot;（需要大而稳）更顺，指南针要&quot;准&quot;不要&quot;大&quot;。任一角度都能锁 A。</span></div>"}, {"q_num": 18, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;无法____其现实的思想内核&quot;。</p><ul><li>&quot;内核&quot;是<strong>内在、抽象、精神层面</strong>的东西。</li><li>A、D&quot;重建&quot;侧重实体（重建家园、重建秩序、重建体系）或制度框架，不配抽象内核，排除。</li><li>B、C&quot;重塑&quot;：塑造，偏<strong>内在精神</strong>（重塑三观），配&quot;思想内核&quot;更好。</li></ul><p>第二空&quot;未能摘取本属于他但又____的光环&quot;。</p><ul><li>B&quot;高不可及&quot;：太高、够不着，配&quot;摘取光环&quot;（往上伸手摘，摘不到因为太高）正合适。</li><li>C&quot;望尘莫及&quot;：侧重&quot;差距大、远远赶不上&quot;，且多用于<strong>两者比较</strong>（我赶不上你）；这里没有两个主体的比较，是自己够不够得到的问题，不如&quot;高不可及&quot;准。</li></ul><p>选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;重建/重塑&quot;看对象虚实：重建配实体/架构，重塑配精神内核。&quot;摘取→往上→高&quot;：&quot;望尘莫及&quot;是平面横向的&quot;赶不上&quot;，&quot;高不可及&quot;是纵向的&quot;够不着&quot;，配合&quot;摘光环（往上）&quot;选&quot;高&quot;。</span></div>"}, {"q_num": 19, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第二空是最好破的：&quot;排队 3 小时不再是____&quot;——排 3 小时的第一反应是&quot;太熬人、难受&quot;，是&quot;<strong>煎熬</strong>&quot;。</p><ul><li>这题老师建议<strong>用最优选＋验证</strong>：一眼定&quot;煎熬&quot;，再看第一、三空验证。</li></ul><p>第三空&quot;为此花费数十元不再____的消费，而是犒劳自己的小确幸&quot;。</p><ul><li>D&quot;奢侈&quot;太夸张：几十块钱算&quot;有点贵&quot;，绝不到&quot;奢侈&quot;，排除。</li><li>A&quot;轻率&quot;（随便、不慎重）：反义应是&quot;慎重&quot;，但后文&quot;犒劳自己&quot;是精神收获，不是&quot;慎重&quot;，对不上。</li><li>B&quot;单纯&quot;：就不再是&quot;纯粹的消费&quot;，而附加了精神价值（小确幸），正准，选 B。</li></ul><p>第一空&quot;奶皮子糖葫芦精准____了年轻人&#x27;怀旧＋猎奇&#x27;心理&quot;——&quot;击中&quot;（产品像射中人心）最贴；&quot;捕捉&quot;主体应是<strong>商家</strong>（商家捕捉心理、产品击中人心），放这里对象错。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">主攻最直白的第二空&quot;排队 3 小时＝煎熬&quot;，秒定方向再验证，比纠结第一空省力气。&quot;奢侈&quot;配&quot;数十元&quot;太夸张、&quot;轻率&quot;反义应是&quot;慎重&quot;却对不上&quot;犒劳自己&quot;——都靠代入现实感受排除。</span></div>"}, {"q_num": 20, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>第一空&quot;少一些____，与&#x27;短视（妄为）&#x27;并列&quot;。前面&quot;科学规划、理性决策&quot;，&quot;科学&quot;和&quot;理性&quot;是<strong>近义并列</strong>，所以后面两个也要近义并列。</p><ul><li>A&quot;心烦意乱&quot;（内心烦躁）：是情绪状态，跟&quot;做事风格、规划行为&quot;无关，排除。</li><li>C&quot;好高骛远&quot;（目标太高、脱离实际）：和&quot;短视（只看眼前）&quot;一个是&quot;太远&quot;、一个是&quot;太近&quot;，<strong>意思相反</strong>，做不了近义并列，排除。</li><li>B&quot;急功近利&quot;（只顾眼前、贪功）对应&quot;短视&quot;，D&quot;心浮气躁&quot;（浮躁不冷静、鲁莽）对应&quot;妄为&quot;，两个都能填，先留。</li></ul><p>第二空&quot;让规划蓝图变成群众____的现实生活&quot;。</p><ul><li>B&quot;脍炙人口&quot;：专形容<strong>诗文好、人人称赞</strong>，完全不搭，排除。</li><li>D&quot;喜闻乐见&quot;：受群众欢迎、喜爱，正合，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">两个动作：①看<strong>近义并列</strong>——&quot;短视&quot;和&quot;好高骛远&quot;方向相反（近vs远），不能并列；&quot;心浮气躁&quot;对应&quot;妄为（鲁莽）&quot;，能并列。②第二空&quot;脍炙人口&quot;只能配诗文，直接排除 B。别只盯着&quot;短视&quot;看半截，漏了&quot;妄为&quot;。</span></div>"}]}, {"set_num": 14, "set_name": "拔高刷题十四", "questions": [{"q_num": 1, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;更为____的是……可能是为了依赖而独立，也可能是为了独立而依赖&quot;。后文是对&quot;它&quot;的说明：独立和依赖<strong>交叉交织、分不清</strong>。</p><ul><li>A&quot;可惜&quot;是惋惜，文段没讲任何遗憾，排除。</li><li>C&quot;重要&quot;只是&quot;事情重要&quot;，填不出&quot;交叉混合&quot;这层意思，排除。</li><li>B&quot;复杂&quot;：错综复杂、理不清，正好对应&quot;两者交叉交织&quot;；D&quot;麻烦&quot;偏消极（麻烦事、不好处理），而这里只是客观描述一种现象，没有&quot;坏&quot;的色彩，所以 B 更准。</li></ul><p>第二空&quot;孰是孰非的讨论____，但每个父母至少应该知道这两种观念存在&quot;——&quot;但&quot;转折：讨论没有结论，可你至少得知道。</p><ul><li>B&quot;莫衷一是&quot;：没有一个统一看法、讨论无定论，正好填&quot;讨论没结果&quot;，与&quot;但至少要知道&quot;转折丝滑。</li><li>D&quot;由来已久&quot;：强调时间久远，和&quot;知不知道&quot;没有关联，排除。</li></ul><p>第三空&quot;两种相互____的观念&quot;，&quot;龃龉&quot;（本意牙齿不合，引申分歧、抵触）对应&quot;两种观念有冲突&quot;，选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第一空关键在&quot;复杂 vs 麻烦&quot;：复杂＝客观理不清，麻烦＝主观觉得是坏事；文段&quot;独立依赖交叉&quot;是客观现象，用&quot;复杂&quot;。第二空&quot;莫衷一是&quot;填&quot;讨论（没定论）&quot;，可以和&quot;由来已久（时间长）&quot;一辨就明。</span></div>"}, {"q_num": 2, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>第一空&quot;诗意____，信仰缺席&quot;。&quot;缺席&quot;＝没有、是 0 的状态。</p><ul><li>A&quot;贫乏&quot;、C&quot;匮乏&quot;：都是&quot;少、不丰富&quot;，不是&quot;无&quot;，跟&quot;缺席（0）&quot;不对应，排除。</li><li>B&quot;缺乏&quot;、D&quot;缺失&quot;都能填&quot;缺＝接近 0&quot;，先留。</li></ul><p>第二空&quot;貌似自由，实则____&quot;，&quot;枷锁/桎梏&quot;都表束缚，字形都对，分不出，回到第一空抠更细。</p><p>第一空 B、D 再比：<strong>及物/不及物</strong>。B&quot;缺乏&quot;是及物动词，习惯说&quot;缺乏 XX&quot;（缺乏观念、缺乏维生素），几乎不说&quot;XX 缺乏&quot;；而&quot;缺失&quot;及物不及物都行（&quot;诗意缺失&quot;&quot;缺失诗意&quot;都顺）。这里题面是&quot;诗意____&quot;（宾语在前），所以&quot;缺乏&quot;搭配不顺，选 D。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">先逻辑排除&quot;少≠无&quot;的 A、C；第二空分不出再回第一空做&quot;语法级&quot;辨析——&quot;缺乏&quot;只能&quot;缺乏 XX&quot;不习惯&quot;XX 缺乏&quot;，&quot;缺失&quot;两者皆可。这类按日常说话习惯去套即可。</span></div>"}, {"q_num": 3, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>第一空&quot;分享会给人一种____的满足感，将空谈错认为____&quot;。看&quot;错认为&quot;——满足感是&quot;错&quot;来的，所以是<strong>假的</strong>。</p><ul><li>&quot;虚假&quot;最直接；A&quot;想象&quot;（想出来的、不真）也沾边，先留。</li><li>B&quot;即时&quot;、C&quot;暂时&quot;强调<strong>时间长短</strong>，而文段说的是&quot;真与假&quot;、不是&quot;长与短&quot;，排除。</li></ul><p>第二空&quot;将空谈错认为____&quot;——定了目标、分享出去，就以为<strong>自己已经做过了</strong>（买课就当听过了）。</p><ul><li>D&quot;实践&quot;：把&quot;说&quot;当成&quot;做了&quot;，正是&quot;错认&quot;的内容。</li><li>A&quot;目的&quot;：定目标本来就是目的，谈不上&quot;错认为&quot;，排除。</li></ul><p>所以选 D。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第一空抓&quot;错认为→假&quot;（真假的判断，排除&quot;短暂&quot;这些时间维度的）；第二空抓&quot;空谈错当成了行动/实践&quot;。这题考一个心理现象：说出来的目标会给人&quot;已完成&quot;的假满足。</span></div>"}, {"q_num": 4, "type": "逻辑填空", "answer": "A", "analysis_html": "<p>第一空&quot;作风建设并非一朝一夕之功……尤需____&quot;，后面&quot;十年不够二十年、二十年不够三十年&quot;全都提示<strong>长期</strong>。</p><ul><li>A&quot;绵绵用力&quot;：持续不断、久久为功地下功夫，正合&quot;长期常抓&quot;。</li><li>B&quot;壮士断腕&quot;（果断割舍）、C&quot;重典治乱&quot;（乱象严重时用重法）、D&quot;和风细雨&quot;（方式温和）——三个跟&quot;时间长&quot;都没有关联，排除。</li></ul><p>第二空&quot;做到____&quot;验证：&quot;化风成俗&quot;（把好风气经过长期教化转成习俗）与&quot;夯实作风、凝聚人心&quot;契合。而 B&quot;栉风沐雨&quot;是奔波劳苦、C&quot;移风易俗&quot;是&quot;破旧&quot;（这里只讲立新风、没讲破除）、D&quot;浇风薄俗&quot;是贬义（不良风气），都不如 A。选 A。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第一空就是抓&quot;长期&quot;这个对应点，四个成语里只有&quot;绵绵用力&quot;有时间维度。&quot;重典治乱&quot;配&quot;要用重法&quot;、&quot;壮士断腕&quot;配&quot;痛下决心&quot;，和&quot;十年不够二十年&quot;的久久为功不是一回事。</span></div>"}, {"q_num": 5, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;城市治理转向____&quot;，题眼是后文&quot;城市即人&quot;&quot;激发人的参与感归属感&quot;。</p><ul><li>关键理解&quot;转向&quot;：以前围绕<strong>城市（宏观）</strong>治理，现在围绕<strong>人（微观个体）</strong>治理，这是&quot;从宏观到微观&quot;的变化。&quot;精细化&quot;正是从粗放的宏观走向具体到人，最准。</li><li>A&quot;人性化&quot;太直白——&quot;原词对应&quot;往往是坑；C&quot;个性化&quot;是&quot;定制化、一人一样&quot;，文段没讲；D&quot;便捷化&quot;是转向带来的<strong>结果</strong>（方便），不是&quot;转向本身&quot;，排除。</li></ul><p>第二空&quot;更是____空间和社会联结空间&quot;。</p><ul><li>参与感、归属感、烟火气、人情味都是<strong>情感</strong>，&quot;情感空间&quot;最贴。</li><li>A&quot;休闲&quot;是休息娱乐，文段根本没讲休息，排除。</li></ul><p>所以选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">两个易错点：①&quot;转向&quot;考的是&quot;从宏观（城市）到微观（人）&quot;＝&quot;精细化&quot;，&quot;人性化&quot;是原词陷阱、&quot;便捷化&quot;是结果不是转向；②第二空&quot;物理空间→情感空间&quot;是实与虚的对应（物理是实体，反之是内在情感）。</span></div>"}, {"q_num": 6, "type": "逻辑填空", "answer": "A", "analysis_html": "<p>第一空&quot;缠绵悱恻，才能____，深入万物的核心&quot;。&quot;缠绵悱恻&quot;＝情感深浓。</p><ul><li>A&quot;一往情深&quot;：情感深厚专一，正好。</li><li>B&quot;一如既往&quot;（没变化）不涉及情感深；C&quot;一气呵成&quot;（连贯流畅、写作丝滑）不涉及情感；D&quot;一见倾心&quot;（初见即爱慕）有矛盾——&quot;缠绵才能一见倾心&quot;逻辑反了，也排除。</li></ul><p>第二空&quot;超旷空灵，才能为镜中花水中月，____，无迹可寻&quot;。要填&quot;没有痕迹&quot;。</p><ul><li>A&quot;羚羊挂角&quot;：恰是&quot;羚羊夜里把脚挂树上、地上不留脚印&quot;，诗文中形容意境超脱、无迹可寻，完美对应&quot;无迹可寻&quot;。</li><li>B&quot;雪泥鸿爪&quot;（往事留下浅痕迹）与&quot;无迹&quot;矛盾；C&quot;神来之笔&quot;（灵感绝妙）与痕迹无关；D&quot;天马行空&quot;（想象力奔放）与痕迹无关。</li></ul><p>选 A。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第二空即便不认识&quot;羚羊挂角&quot;也能靠字面猜：脚挂起来不沾地、就没脚印——刚好呼&quot;无迹可寻&quot;；&quot;雪泥鸿爪&quot;有&quot;爪印&quot;反而和&quot;无迹&quot;相反。看字面义估成语，是常识。</span></div>"}, {"q_num": 7, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>第一空&quot;获得感、安全感更加____、更可持续&quot;，顿号表并列，空要跟&quot;持续（长久）&quot;近义。</p><ul><li>A&quot;充裕&quot;：形容数量多（资金充裕、时间充裕），配&quot;安全感&quot;不当，排除。</li><li>C&quot;权威&quot;：公信力，与安全感获得感无关，排除。</li><li>B&quot;满足&quot;（达到需要）、D&quot;充实&quot;（实实在在、饱满）都能保留，但&quot;充实&quot;更能体现&quot;获得感很强、很实在&quot;，D 更贴。</li></ul><p>第二空&quot;严厉打击侵权行为，____知识产权惩罚性赔偿制度&quot;。</p><ul><li>B&quot;建立&quot;错——这种惩罚性赔偿制度<strong>本来就有</strong>，不是要新建。</li><li>D&quot;落实&quot;：把制度真正执行到位、用在实处，与&quot;严厉打击&quot;呼应，选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第一空&quot;更可持续&quot;是并列点，锁定&quot;长久、实在&quot;之意（排除&quot;充裕&quot;这类数量词）；第二空&quot;建立 vs 落实&quot;看制度是否已有——已有就&quot;落实&quot;，没有才&quot;建立&quot;。</span></div>"}, {"q_num": 8, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;人工智能成为……经济发展的____&quot;。</p><ul><li>&quot;催化剂、引擎、动力源、加速器&quot;四个都说得通，但&quot;引擎&quot;是<strong>高频热门词</strong>（科技、动力发展类文章最爱用），可作为优先选项记着。</li></ul><p>第二空&quot;____人工智能发展机遇&quot;是题眼。</p><ul><li>&quot;珍惜、把握、用好&quot;都隐含&quot;机遇已经摆在眼前、别弄丢&quot;；但文段说的是&quot;赢得主动权、要加快发展&quot;，机遇<strong>还没到手</strong>，需要自己动手去抢、去抓。</li><li>B&quot;抢抓&quot;：主动去抢占、抓住，还带&quot;抢时间、紧迫&quot;的意思，和&quot;加快发展、赢得主动&quot;的急迫感最合。其他三个都差点。</li></ul><p>第三空&quot;生产力整体____&quot;验证：&quot;跃升&quot;（大幅提升）恰当。选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第二空区分&quot;机遇是否已经给到&quot;：已经到手→珍惜/把握/用好；还没到手→抢抓（主动+紧迫）。&quot;抢抓机遇&quot;是政论高频搭配，&quot;引擎&quot;是科技类高频词，两个都可做积累。</span></div>"}, {"q_num": 9, "type": "逻辑填空", "answer": "A", "analysis_html": "<p>题眼&quot;在养老举措、制度设计等各方面____更多同理心&quot;。</p><ul><li>A&quot;灌注&quot;：把心血、情感&quot;注&quot;进去（课程里灌注了很多心血，把情感注入其中），符合&quot;把同理心注入到养老设计里&quot;。</li><li>B&quot;灌溉&quot;（浇地）、D&quot;灌制&quot;（制作录音制品）明显无关，排除。</li><li>C&quot;灌输&quot;最迷惑：灌输＝<strong>向外传输</strong>（老师把知识灌输给学生、填鸭式教学），是&quot;传给别人知道&quot;；而这里是把心思情感&quot;注入其中&quot;，是<strong>向内注</strong>，不是向外传，排除。</li></ul><p>所以选 A。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;灌注（向内注入）vs 灌输（向外传输）&quot;是易混点：灌注配&quot;心血、情感、精神&quot;注入到什么里；灌输配&quot;知识、思想&quot;传给别人。一个往里注、一个往外输。</span></div>"}, {"q_num": 10, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>题眼&quot;通过绕弯路、走远路，出其不意打击敌人<strong>侧后方的薄弱点</strong>，以达到____的奇袭效果&quot;。</p><ul><li>B&quot;避实击虚&quot;：避开敌人实力强的正面、攻打薄弱处，与&quot;打击薄弱点&quot;完美呼应，选 B。</li><li>A&quot;反客为主&quot;：主客身份互换，文段没讲身份变化。</li><li>C&quot;声东击西&quot;：假装打东、实际打西（有<strong>假动作</strong>）；文段只是绕路找弱处打，没有&quot;声东&quot;的迷惑动作。</li><li>D&quot;暗度陈仓&quot;：表面做一套、暗中做一套（有伪装），文段也没有假动作。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">抓&quot;薄弱点↔击虚&quot;的直接对应，B 秒锁。C、D 的共同坑是&quot;假动作、迷惑&quot;——文段没有&quot;声东&quot;或&quot;明修栈道&quot;式的伪装，只是迂回穿插绕开正面去偷袭弱处。</span></div>"}, {"q_num": 11, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>第一空&quot;21 世纪最具____的文化产业&quot;（市场/潜力/前景/潜能）、第二空&quot;模式做相应____&quot;（推进/改变/整改/调整）都不怎么分，直接看第三空。</p><p>第三空&quot;精彩的原创故事内容才是____观众的本质所在&quot;。</p><ul><li>前文&quot;上游下游严重脱节、只见投入未见收益、没形成资金循环&quot;——说明<strong>当下基本没什么观众</strong>。</li><li>A&quot;创造&quot;观众：观众能造出来吗？不能，排除。</li><li>B&quot;留住&quot;：留住的前提是&quot;本来就有&quot;，现在没观众，光留没用，排除。</li><li>C&quot;保障&quot;观众：跟原创故事无关，排除。</li><li>D&quot;吸引&quot;：先吸引人来，才有后续，选 D。</li></ul><p>第一、二空 &quot;潜能&quot;&quot;调整&quot;验证都通。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">三空题不要被前面两空困住——这道题前两空都不好做，就看第三空&quot;没观众→先吸引（不是留住）&quot;。抓清楚&quot;有没有观众&quot;这个前提，&quot;创造/留住/吸引&quot;就分开了。</span></div>"}, {"q_num": 12, "type": "逻辑填空", "answer": "C", "analysis_html": "<p>第一空&quot;开拓出传统文化 IP 活化的新____&quot;。</p><ul><li>B&quot;途经&quot;是动词（中途经过、路过），不做名词，排除。</li><li>D&quot;路子&quot;太口语，配&quot;三驾马车、挖掘、揭示冰山一角&quot;这类偏正式表述不顺，基本排除。</li><li>A&quot;途径&quot;、C&quot;路径&quot;都表&quot;路&quot;，先留。</li></ul><p>第二空&quot;挖掘和____&quot;用顿号并列。&quot;挖掘&quot;是&quot;开发&quot;的动作（拿铲子挖）。</p><ul><li>A&quot;阐述&quot;、B&quot;阐释&quot;、D&quot;阐明&quot;都只有&quot;说明、解读&quot;的意思，词义单一。</li><li>C&quot;阐发&quot;＝阐（阐述）＋发（开发、发扬光大）——既有&quot;解读&quot;又有&quot;开发发扬&quot;，和&quot;挖掘&quot;并列更工整，也对得上后文&quot;市场开发、财富&quot;。选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第二空考&quot;词义丰富度&quot;：&quot;阐发&quot;比&quot;阐述/阐释/阐明&quot;多一个&quot;发（开发发扬）&quot;，而文段既有&quot;挖掘（开发）&quot;的并列、又有&quot;市场开发&quot;的呼应，所以&quot;发&quot;这层意思用得上，词义丰富就成了优势（用得上叫丰富，用不上才叫多余）。</span></div>"}, {"q_num": 13, "type": "逻辑填空", "answer": "C", "analysis_html": "<p>第一空&quot;开发者抱持____的傲慢心态&quot;，前面&quot;对<strong>草根力量</strong>保持敬畏&quot;。</p><ul><li>关键词&quot;草根&quot;——傲慢是针对&quot;草根（基层、下面）&quot;的。C&quot;高高在上&quot;是&quot;在上&quot;，傲慢对&quot;下&quot;，正好和&quot;草根&quot;呼应，选 C。</li><li>A&quot;唯我独尊&quot;：谁都看不起（不限于草根），没有&quot;草根&quot;这个限定，只是搭配上&quot;傲慢&quot;，和文段无对应。</li><li>B&quot;闭门造车&quot;（不跟外界交流）、D&quot;固步自封&quot;（守旧不求进步）——本身根本不强调傲慢，也不指向草根，都是自己脑补的&quot;自视甚高&quot;，排除。</li></ul><p>第二空&quot;不能____市场规律&quot;，&quot;逃脱&quot;验证：不论技术还是商业模式都不能逃脱市场规律，通顺。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这题核心是&quot;傲慢是有指向的&quot;——傲慢的对象是&quot;<strong>草根</strong>（下）&quot;，所以选本身带&quot;上对下&quot;的&quot;高高在上&quot;，而不是只和&quot;傲慢&quot;沾边、但没指向的&quot;唯我独尊、闭门造车&quot;。对应要找全，不能只抓&quot;傲慢&quot;一个词。</span></div>"}, {"q_num": 14, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>题眼&quot;东部发展腾飞，衍生出的诗文更是____&quot;（数量多），后面&quot;恍然西部文学像荒地&quot;。</p><ul><li>A&quot;鳞次栉比&quot;：形容房屋建筑排列整齐，配诗文不当，排除。</li><li>D&quot;汗牛充栋&quot;：形容<strong>书籍</strong>多。诗文是&quot;作品、文章&quot;，不一定是成册成书，对象不符，排除。</li><li>C&quot;恒河沙数&quot;：像恒河的沙那么多，程度<strong>极重</strong>（多到数不清），一般用于无法计数的抽象事物（如烦恼）；&quot;诗文&quot;是个可数的具体事物，用它太重、不搭，排除。</li><li>B&quot;俯拾皆是&quot;：到处都是、多而<strong>易得</strong>——正合&quot;东部诗文多得随处都有&quot;，选 B。</li></ul><p>再补一个形象呼应：前文说&quot;西部像荒地&quot;，那东部这头就是&quot;荒地已长满花草果实&quot;，果实在地上<strong>弯腰俯拾</strong>即可得——&quot;俯拾皆是&quot;的字面（俯身捡地上的东西）也暗合&quot;地/果实&quot;，比&quot;恒河沙数（河的意象）&quot;更贴。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;汗牛充栋&quot;配书、&quot;俯拾皆是&quot;配诗文作品（多且易得）、&quot;恒河沙数&quot;程度过重（数不清、多用于抽象）——三个&quot;表多&quot;的成语各有限定，这道题靠对象和程度就锁 B。</span></div>"}, {"q_num": 15, "type": "逻辑填空", "answer": "A", "analysis_html": "<p>题眼&quot;通识性与学术性常常构成<strong>冲突</strong>&quot;。第二空先破：有冲突→要&quot;<strong>平衡</strong>&quot;（像跷跷板两边不均，把它平衡过来），这是最常见、最合适的搭配。</p><p>再看第一空&quot;____的著作多有存在&quot;（存在有冲突、难两全的著作）。</p><ul><li>A&quot;顾此失彼&quot;：顾了这头顾不了那头，是<strong>客观</strong>难以兼顾（时间有限，顾了言语就少做资料），正合&quot;通识、学术有冲突、难两全&quot;。</li><li>B&quot;厚此薄彼&quot;：有偏向、重视一方轻视一方，是<strong>主观偏心</strong>。文段是&quot;做不到兼顾&quot;的客观现实，不是&quot;我要捧谁贬谁&quot;，排除。</li><li>C&quot;轻重失宜&quot;：安排不当。文段没讲&quot;安排妥不妥当&quot;，排除。</li><li>D&quot;此消彼长&quot;：形容<strong>两方关系</strong>一增一减，但这里主语是&quot;著作&quot;（一个主体），搭配不当，排除。</li></ul><p>所以选 A。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第二空&quot;冲突→平衡&quot;是固定逻辑（有冲突就求平衡）。第一空区分&quot;顾此失彼（客观难兼） vs 厚此薄彼（主观偏心）&quot;——关键看有没有&quot;主观选择&quot;；再看 D&quot;此消彼长&quot;主语应是&quot;两者关系&quot;、不能形容单个&quot;著作&quot;。</span></div>"}, {"q_num": 16, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>第一空&quot;成为美猴王、降妖除魔是每个读者儿时的____&quot;。</p><ul><li>&quot;降妖除魔&quot;是<strong>不可能实现</strong>的虚构想象，不能说是&quot;愿望、梦想&quot;（那都有实现可能），排除 A、B。</li><li>C&quot;遐想&quot;（思索想象）缺乏&quot;强烈渴望&quot;这层；D&quot;幻想&quot;＝虚构的、不可能实现的想象，最贴，选 D。</li></ul><p>第二空&quot;在游戏里将它____&quot;。</p><ul><li>C&quot;体验&quot;不说&quot;将它体验&quot;（只说&quot;体验生活/体验情景&quot;），&quot;将 X 体验&quot;语序别扭，排除。</li><li>A&quot;达成&quot;（达成愿望）第一空已排；D&quot;实现&quot;（实现幻想）通顺。</li></ul><p>第三空&quot;中国古典风格____的作品&quot;，&quot;浓郁&quot;（风格浓郁）最好，&quot;厚重&quot;多配文化底蕴而不配&quot;风格&quot;。</p><p>选 D。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第一空关键分&quot;可实现 vs 不可实现&quot;：愿望、梦想都趋向可实现，降妖除魔是纯虚构→&quot;幻想&quot;；第二空&quot;实现幻想&quot;是固定好搭配，而&quot;将它体验&quot;属语序不通。</span></div>"}, {"q_num": 17, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;这种____的想象&quot;——&quot;小枫一夜偷天酒，却倩孤松掩醉容&quot;，是<strong>拟人＋夸张</strong>（枫树偷喝天上的酒）。</p><ul><li>拟人＋夸张带来的效果是<strong>有趣、好玩</strong>，不是&quot;逼真&quot;。</li><li>A&quot;栩栩如生&quot;是逼真、像活的一样，可&quot;偷天酒&quot;是夸张虚构的，谈不上逼真，排除。</li><li>所以填&quot;妙趣横生&quot;（有妙趣、好玩的想象）B。</li></ul><p>第二空&quot;____的他们考虑更多的是枫树偷喝的是茅台还是威士忌&quot;——现代人想的是<strong>现实中的酒</strong>，和古人的&quot;偷天酒（浪漫虚构）&quot;对比，是&quot;务实（关注现实）&quot;。</p><ul><li>C&quot;世故&quot;（圆滑）、D&quot;市侩&quot;（庸俗、唯利是图，贬义）都不对；A&quot;现实&quot;也勉强，但 B&quot;务实&quot;更准确对应&quot;考虑实际喝的酒是什么&quot;。</li></ul><p>选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第一空要识别&quot;拟人＋夸张＝有趣&quot;而非&quot;逼真&quot;（偷天酒不真实，所以不是栩栩如生）；第二空抓&quot;偷天酒（虚）vs 茅台威士忌（实）&quot;的古今对比，锁定&quot;务实&quot;。文段不批判现代人，别脑补贬义。</span></div>"}, {"q_num": 18, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;十年燕园的____&quot;——人受环境的长期熏陶滋养。</p><ul><li>A、C&quot;浸染&quot;：染＝沾染（不良风气），偏贬义，排除。</li><li>B、D&quot;浸润&quot;：润＝滋润、长期熏陶，偏好，先留。</li></ul><p>第二空&quot;深厚的人文____&quot;。</p><ul><li>&quot;深厚&quot;配&quot;底蕴&quot;（积累沉淀）比配&quot;素养&quot;（修养，本身不表多寡）更搭，选带&quot;底蕴&quot;的 B、C。</li></ul><p>第三空&quot;被相互间的怒火所____&quot;。</p><ul><li>&quot;吞噬&quot;：噬——吞咬，常与&quot;火&quot;搭配（火海吞噬）；&quot;吞没&quot;：没，三点水，本意被大水淹没（洪水吞没），配&quot;怒火（火）&quot;不如&quot;吞噬&quot;。</li></ul><p>综合选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">三个空都是&quot;看偏旁/字面猜词义&quot;：染（沾染、贬）、润（滋润、褒）；底蕴（有积累、配&quot;深厚&quot;）优于素养（中性）；吞噬（火）优于吞没（水）。汉语组词有规律，看字面能猜个大概。</span></div>"}, {"q_num": 19, "type": "逻辑填空", "answer": "C", "analysis_html": "<p>题眼&quot;得体说话、灵活办事，____&quot;——空要呼应&quot;得体、灵活、有分寸&quot;。</p><ul><li>A&quot;一个萝卜一个坑&quot;：一人占一岗、人岗匹配，和说话办事无关，排除。</li><li>B&quot;落地有声&quot;：说话有分量、有气势，强调的是&quot;气势&quot;不是&quot;得体分寸&quot;，排除。</li><li>D&quot;见风使舵&quot;：看形势改变立场，投机圆滑，是<strong>贬义</strong>，不能修饰&quot;得体灵活&quot;，排除。</li><li>C&quot;可钉可铆&quot;：本意严丝合缝，引申为说话办事精准、有分寸、恰到好处，正合&quot;得体灵活&quot;，选 C。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;可钉可铆&quot;就算不认识，也能从字面（&quot;可以钉、可以铆&quot;＝能精确卡到位）猜到&quot;恰到好处、灵活又精准&quot;，和&quot;得体、灵活&quot;呼应。贬义词&quot;见风使舵&quot;先排，剩下靠对应锁定。</span></div>"}, {"q_num": 20, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;过程是____的粗糙&quot;、第二空&quot;____的肤浅&quot;。先看一个规律——&quot;A 的 A&quot;式的<strong>字面重复</strong>是坑：</p><ul><li>A&quot;粗枝大叶的粗糙&quot;＝粗的粗，&quot;浅尝辄止的肤浅&quot;＝浅的浅，修饰词和中心词字面重复，不选（除非其他全错）。</li></ul><p>看 B&quot;走马观花（看过程不细）的粗糙&quot;——&quot;过程中走马观花＝粗糙&quot;搭得很顺；&quot;蜻蜓点水（做事不深入）的肤浅&quot;——&quot;做事蜻蜓点水＝肤浅&quot;也顺。</p><ul><li>C&quot;马马虎虎&quot;（做事马虎）勉强，但第二空&quot;目睫之论&quot;是形容<strong>言论/见解</strong>短浅，主语是&quot;调研过程&quot;不是言论，不搭。</li><li>D&quot;不求甚解&quot;（主观不想深究、多配学习）、&quot;略知皮毛&quot;（人的认知浅），配&quot;过程肤浅&quot;都不当。</li></ul><p>选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这道题最核心是识别&quot;粗枝大叶的粗糙、浅尝辄止的肤浅&quot;这种<strong>修饰词与中心词字面重复</strong>（大的大、浅的浅），是典型套路；剩下的&quot;走马观花配过程、蜻蜓点水配肤浅&quot;很板正，一眼锁 B。</span></div>"}]}, {"set_num": 15, "set_name": "拔高刷题十五", "questions": [{"q_num": 1, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;14 亿多人整体迈向现代化，规模超过现有发达国家总和，艰巨性和复杂性____&quot;。总人多、规模大，说明艰巨性和复杂性<strong>很大、空前</strong>。</p><ul><li>A&quot;无与伦比&quot;：形容事物完美、好到没有能比的，一般搭配好的东西去夸赞（&quot;无与伦比的美&quot;），拿来搭配&quot;艰巨性、复杂性&quot;这种中性偏难的事不合适，排除。</li><li>C&quot;无以复加&quot;：到极点、不能再增加，程度比&quot;前所未有&quot;更重，有点像&quot;空前绝后&quot;到头了。但&quot;空前&quot;能推出，&quot;绝后&quot;推不出——过几年人口还可能更多、更复杂，当下只能说&quot;以前没有过&quot;，不能说&quot;到头了&quot;，排除。</li><li>D&quot;异乎寻常&quot;：不一般、特殊，虽然也能用，但第二空更要紧，先放。</li></ul><p>第二空&quot;既不好高骛远，也不因循守旧……坚持稳中求进、循序渐进&quot;——关键词是&quot;稳、循序渐进&quot;。</p><ul><li>A&quot;清醒&quot;强调头脑明白，D&quot;主动&quot;强调自发出力，这些跟&quot;稳、慢慢来、有分寸&quot;没关系；B&quot;耐心&quot;正好对应&quot;稳中求进、不能急也不能停&quot;，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;前所未有&quot;只能推出&quot;空前&quot;，推不出&quot;绝后&quot;（因为未来还有变数），所以比&quot;无以复加（到头了）&quot;更准。第二空抓&quot;稳中求进、循序渐进&quot;对应的&quot;耐心&quot;——不急不躁、稳稳地走。</span></div>"}, {"q_num": 2, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>第一空&quot;来时鲜花铺满路，去时已____&quot;。这道题最大的坑是 B、C——看到&quot;花&quot;，就下意识填&quot;花凋落&quot;。但<strong>主语是什么</strong>？是&quot;路&quot;，不是&quot;花&quot;。</p><ul><li>花是铺在路上、用来形容&quot;路&quot;如何的托衬。路&quot;鲜花铺满&quot;的反面，是&quot;路荒芜了&quot;（花凋落了才导致路荒芜），主谓要搭&quot;路&quot;。</li><li>B&quot;凋落&quot;、C&quot;凋谢&quot;主语只能是&quot;花&quot;，不能是&quot;路&quot;——&quot;路凋落了&quot;讲不通，排除。</li></ul><p>第二空&quot;一棵树知道何时休眠、何时____、何时奋力开花&quot;。</p><ul><li>休眠之后要先&quot;醒过来&quot;，才有后面的开花结果。&quot;苏醒&quot;与&quot;休眠&quot;呼应（睡了就醒）。</li><li>A、C&quot;清醒&quot;是形容<strong>人头脑</strong>清醒（人迷糊了才要清醒一下），树的生命状态不能用&quot;清醒&quot;，排除。选 D。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">逻辑填空第一大坑就是&quot;看一个词就乱搭&quot;，要盯住<strong>主语</strong>：这里&quot;路&quot;不能&quot;凋落&quot;，只能&quot;荒芜&quot;。发现坑的办法是看选项——如果 B、C 都靠&quot;鲜花→凋落&quot;成立，那 A、D 一定另有一层（搭配主语&quot;路&quot;），反过来想就能避开。</span></div>"}, {"q_num": 3, "type": "逻辑填空", "answer": "A", "analysis_html": "<p>第一空&quot;部分绿色产品初始成本较高，消费者____&quot;。</p><ul><li>A&quot;知易行难&quot;：知道应该做（道理都懂），但做起来难（太贵买不起）——正合&quot;懂了绿色消费重要，但成本高做不了&quot;。</li><li>B&quot;不明所以&quot;：不懂、不知道原因。但消费者<strong>知道</strong>成本高（文段明说了&quot;成本较高&quot;），是&quot;懂但买不起&quot;，不是&quot;不懂&quot;，排除。</li><li>C&quot;拒之门外&quot;：完全拒绝。可文段是&quot;全面普及有挑战&quot;，即已经有一部分人接受、一部分没实现，&quot;全体都拒绝&quot;程度太重，排除。</li><li>D&quot;望而却步&quot;：看到难处就退缩。词义上大体能用，但不如 A 精准（A 还有&quot;知&quot;和&quot;行&quot;的对比），且&quot;望而却步&quot;多用被动、偏重。</li></ul><p>第二空&quot;推动绿色消费从&#x27;可选&#x27;变&#x27;必选&#x27;，需要____&quot;——后面三个分号是<strong>三个对策并列</strong>（完善制度、创新技术、强化导向）。</p><ul><li>&quot;多管齐下&quot;＝多手段同时发力，正好概括三个并列的对策。</li><li>&quot;集思广益&quot;＝收集大家意见，文段是&quot;使手段&quot;不是&quot;收集意见&quot;，排除。</li></ul><p>第三空&quot;真正让绿色消费&#x27;____&#x27;，从生态环境保护倡导转化为切实的经济激励&quot;——经济激励＝让人能<strong>赚到钱/得利</strong>。</p><ul><li>A&quot;有利可图&quot;：可以获利，正好呼应&quot;经济激励&quot;，选 A。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第一空用&quot;有因果对应&quot;的方法排除 B：成本高→买不起→难普及，是&quot;行难&quot;，不是&quot;不明所以&quot;（别自己脑补消费者不懂）。第三空&quot;经济激励↔有利可图&quot;是硬对应。三个并列对策→要个字面上&quot;多&quot;的词&quot;多管齐下&quot;。</span></div>"}, {"q_num": 4, "type": "逻辑填空", "answer": "A", "analysis_html": "<p>题眼&quot;商用落地&quot;、后面&quot;不是一蹴而就&quot;。</p><ul><li>核心抓字面上的反向对应：既然要&quot;落地&quot;，没落地时就在<strong>空中</strong>；都能落地了，&quot;空中楼阁&quot;就不成立——所以精确呼应是&quot;空中楼阁&quot;。</li><li>&quot;海市蜃楼&quot;侧重&quot;虚幻、非真实&quot;，但自动驾驶即使没落地也是真实存在的东西，只是&quot;难以落实&quot;，不是&quot;虚幻&quot;，排除。</li><li>&quot;明日黄花&quot;＝过时的事物，与&quot;落不落地&quot;无关，排除。</li><li>&quot;无中生有&quot;＝凭空捏造，自动驾驶应用不是捏造出来的，排除。</li></ul><p>选 A。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">成语填空最爱考&quot;形象化/字面呼应&quot;：看到&quot;落地&quot;就想&quot;空中&quot;，&quot;空中楼阁（没有落地的楼）&quot;直接锁。做题时可以顺着原文的关键词去找字面上的反向对应，往往比逐词辨析更快。</span></div>"}, {"q_num": 5, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;接近美、欣赏美、才能发现美……美学提升心灵&quot;——四个词净化/涵养/培育/涤荡意思都沾边，不好硬排，先放。</p><p>第二空是题眼：&quot;发展&#x27;村字头&#x27;文化绝不是____，而是要<strong>结合实际情况、探索最适合本地区的路径</strong>&quot;——这就是&quot;因地制宜&quot;。</p><ul><li>因地制宜的反面＝同质化、千篇一律（各地都一样、不结合本地）。</li><li>B&quot;千篇一律&quot;＝都是同一个样，正好对应&quot;不结合本地、搞成一样&quot;，锁定。</li><li>A&quot;急于求成&quot;（求快）、C&quot;天马行空&quot;（想法脱离实际）、D&quot;缘木求鱼&quot;（方法错误、达不成目的）都跟&quot;结不结合本地&quot;没有必然对应，排除。</li></ul><p>第一空&quot;涵养美丽心灵&quot;验证：涵养＝滋养、熏陶（长期浸润心灵），通顺。选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第二空整句话讲的是&quot;因地制宜&quot;，所以只能挑它的反面词&quot;千篇一律（同质化）&quot;。&quot;天马行空&quot;只对到&quot;脱离实际&quot;，但文段不但要&quot;结合实际&quot;还要&quot;适合本地&quot;，是完整一个词&quot;因地制宜&quot;，C 只对了一半，失分。别只看半句。</span></div>"}, {"q_num": 6, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>题眼&quot;犹如&quot;——表比喻，前后必须有<strong>形象呼应</strong>。前面说植物&quot;密集排列、贴地生长&quot;，后面&quot;犹如____&quot;。</p><ul><li>B&quot;抱团取暖&quot;：天冷了大家挤在一起、抱成一团，首先&quot;取暖&quot;呼应&quot;低温&quot;，其次&quot;抱团（挤一块）&quot;呼应&quot;密集排列、贴地&quot;，两层形象都扣上，选 B。</li><li>A&quot;铜墙铁壁&quot;：填的是&quot;坚固、防御&quot;。但&quot;墙&quot;是一整面、不是&quot;一个一个紧密靠一起&quot;，跟&quot;密集排列&quot;没呼应；且墙防御的是敌人，&quot;抵御低温&quot;也用不上&quot;墙&quot;，排除。</li><li>C&quot;蚍蜉撼树&quot;：力量小却想撼动大树，词义（不自量力）完全不对。</li><li>D&quot;星罗棋布&quot;：数量多、分布广而<strong>散</strong>，跟&quot;密集排列&quot;（紧挨着）正好相反，排除。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;犹如&quot;后面必须能做比喻且作用到位：抱团＝挤在一起＝密集排列，取暖＝抵御低温，两层都呼应对应才能选。A 只有&quot;坚固&quot;却没有&quot;密集、抵御低温&quot;的对应，属于&quot;单点对应但比喻作用不充分&quot;。</span></div>"}, {"q_num": 7, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;劳动力市场权利结构____&quot;，后文解释&quot;劳动者缺乏议价能力，不得不接受条件&quot;——企业权力过大、劳动者没权力，是<strong>不平衡</strong>。</p><ul><li>A&quot;紊乱&quot;＝秩序乱、分不清（乱糟糟），文段是&quot;不对等、不公&quot;不是&quot;乱&quot;，排除。</li><li>C&quot;扭曲&quot;能用（不正常的、弯的），但不如 B&quot;失衡（不平衡）&quot;直白准确。</li><li>D&quot;痼疾&quot;＝顽固老毛病，文段说的是一种结构状态、不是&quot;老毛病&quot;，排除。</li></ul><p>第二空&quot;不得不接受____的条件&quot;。</p><ul><li>&quot;不得不&quot;是强制、被动，语气很重，所以空要配<strong>重</strong>的词。&quot;苛刻（过于严苛）&quot;比&quot;不利（不好）&quot;更重、更带贬义，选 B。（&quot;严格&quot;偏中性可褒，&quot;苛刻&quot;偏贬，这里老板是按&quot;坏&quot;讲的，B 更贴。）</li></ul><p>第三空&quot;监管的____为变相剥削留下空间&quot;，后文&quot;认定困难、处罚力度不足&quot;。</p><ul><li>&quot;缺位&quot;＝完全没有监管，但文段是&quot;认定难、处罚不足&quot;——有监管、只是跟不上、不给力，是&quot;滞后&quot;而不是&quot;没有&quot;，排除缺位，选&quot;滞后&quot;。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第二空抓&quot;文段用词重、空也填重&quot;：不得不接受→苛刻（重），而不是&quot;不利（轻）&quot;。第三空区分&quot;滞后（跟不上）vs 缺位（完全没有）&quot;，后文&quot;认定难、处罚不足&quot;是有而不力，所以是滞后。</span></div>"}, {"q_num": 8, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>题眼&quot;一次次火箭腾飞、一项项航空成就，____出航天人接续奋斗的轨迹&quot;。</p><ul><li>D&quot;勾勒&quot;：画大概的轮廓、框架。成就是&quot;一项项&quot;的成果，只能看出<strong>大致的</strong>奋斗轨迹（不能详细到每一天每一步），&quot;勾勒轨迹&quot;是标准好搭配，选 D。</li><li>A&quot;见证&quot;：见证事件、见证历史，主体一般是&quot;人/时代&quot;作见证者，&quot;成就见证轨迹&quot;不通。</li><li>B&quot;描摹&quot;：照着原样、原物去画，偏&quot;复刻&quot;，没有&quot;大概轮廓&quot;这层意思。</li><li>C&quot;创造&quot;：创造成绩、创造成果，但不搭&quot;轨迹&quot;（轨迹不是凭空创造出来的）。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;勾勒&quot;是个超高频考词，就记一个点：它专配&quot;<strong>大概、粗略、框架</strong>&quot;。这里成就是&quot;拿一项项成就去反推的轨迹&quot;，必然只能看出大意、不能精确，&quot;勾勒&quot;正好。</span></div>"}, {"q_num": 9, "type": "逻辑填空", "answer": "C", "analysis_html": "<p>题眼&quot;让收藏在禁宫、陈列在大地、书写在古籍里的东西<strong>都活起来</strong>&quot;，后面&quot;让其价值深入人心&quot;。</p><ul><li>原来东西是&quot;收藏、陈列、书写&quot;地<strong>藏着/摆着</strong>，让它&quot;活起来、深入人心&quot;，就是把东西<strong>拿出来、让人接触到、了解它</strong>——这是&quot;传播&quot;。</li><li>A&quot;保护&quot;：保存起来，可它本来就是保存状态（藏在宫里），再说保护等于没变，不能&quot;活起来&quot;，排除。</li><li>B&quot;创新&quot;：文段根本没讲&quot;用什么新形式、新手法&quot;，是读者自己加出来的；&quot;人心入脑&quot;对应的是&quot;让大家知道&quot;，不是&quot;新&quot;，排除。</li><li>D&quot;开发&quot;：多用于产业化、商业化赚钱，文段没讲用非遗赚钱，排除。</li></ul><p>选 C。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这题和中心理解题同理：不要<strong>超出文段内容</strong>自行脑补。&quot;活起来&quot;两个字最朴素的对应是&quot;拿出来→传播&quot;，而不是&quot;创新/开发&quot;这类需要额外假设的词。文段没提的东西，再&quot;合理&quot;也不能选。</span></div>"}, {"q_num": 10, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>题眼&quot;科学与艺术、理性与感性的边界正在____&quot;（注意&quot;正在&quot;是过程）。</p><ul><li>A&quot;消遁&quot;：遁＝逃跑、逃匿，边界不会&quot;逃&quot;，排除。</li><li>C&quot;消除&quot;：一般指<strong>主观地去除掉</strong>不好事物（消除隐患、隔阂），而这里边界模糊是<strong>客观现象</strong>，没人主动去&quot;消除&quot;，排除。</li><li>B&quot;消失&quot;（中性，彻底没了）vs D&quot;消弭&quot;（针对性地消除不好事物，且含<strong>逐步淡化</strong>的过程）：</li></ul><ul><li>①看过程：前句&quot;正在____&quot;，&quot;正在&quot;提示这是<strong>进行中的过程</strong>。&quot;消弭&quot;含&quot;逐步淡化&quot;的过程义，&quot;消失&quot;是&quot;彻底没了&quot;的结果义，过程对应用&quot;消弭&quot;。</li><li>②看色彩：消除边界之后，艺术和科学能交融（是<strong>好事</strong>），说明边界本身是<strong>不好的、阻碍</strong>。&quot;消弭&quot;专接&quot;不好的东西（鸿沟、分歧、隔阂）&quot;，而&quot;消失&quot;是中性。</li></ul><p>选 D。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;消弭&quot;是积累型考词，记住两点：①接<strong>负面事物</strong>（消弭分歧/隔阂）；②含<strong>逐步、过程</strong>义（配&quot;正在&quot;）。&quot;消除&quot;偏主观、目的性，&quot;消失&quot;偏中性、结果义。</span></div>"}, {"q_num": 11, "type": "逻辑填空", "answer": "A", "analysis_html": "<p>题眼&quot;人绝不能抛弃生育养育自己的土地，失去这种____，便失去良知&quot;。</p><ul><li>先用&quot;词义范围&quot;排 D：C&quot;激情&quot;（激动、短暂）和 D&quot;情感&quot;（喜怒哀乐都是感情，太泛）都没具体指向——&quot;情感&quot;范围过大，除非 A、B 都错才会用。排除 C、D。</li></ul><p>A&quot;眷恋&quot;vs B&quot;眷念&quot;，差在&quot;恋（依恋）&quot;和&quot;念（思念/惦记）&quot;：</p><ul><li>①看词重：&quot;绝不能抛弃、失去良知&quot;程度重，所以要填<strong>重</strong>的词。恋爱、依恋是&quot;舍不得分离&quot;，比&quot;想念（心里记挂）&quot;更重、更舍不得，选重一点的&quot;眷恋&quot;。</li><li>②看搭配：&quot;眷恋&quot;常搭<strong>故土、家乡</strong>（眷恋故土、恋家）；&quot;思念/想念&quot;常搭<strong>人</strong>（思念远方亲人）。这里对象是&quot;土地&quot;，&quot;眷恋&quot;更贴。</li></ul><p>选 A。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">辨析只差一个字的词，先比&quot;词的重轻&quot;（恋＞念），再比&quot;搭配对象&quot;（眷恋故土 vs 思念故人）。两个角度都指向 A，就很稳。</span></div>"}, {"q_num": 12, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第二空是题眼：&quot;泛音则如天籁，有一种入仙之感&quot;，要填的词得有&quot;神仙的感觉&quot;。</p><ul><li>&quot;萧瑟&quot;＝秋风萧瑟、悲凉伤感，跟&quot;仙、天籁&quot;毫无关系，排除 C、D。</li><li>&quot;清冷&quot;＝高冷、空灵、不接地气（仙女、嫦娥那种清冷高洁），正合&quot;入仙之感&quot;。保留 A、B。</li></ul><p>再看第一空和第三空收尾：</p><ul><li>第一空&quot;散音松沉而____，让人起远古之思&quot;：C&quot;幽远&quot;（幽深静）的&quot;幽&quot;、D&quot;渺远&quot;（缥缈虚无）的&quot;渺&quot;都是<strong>加了原文没有的义</strong>——这里只体现&quot;远（远古）&quot;，没有&quot;幽静&quot;也没有&quot;缥缈&quot;，这两个词&quot;词义超了&quot;，排除。A&quot;遥远/旷远&quot;都表&quot;远&quot;，可。</li><li>第三空&quot;按音……细微悠长，时如人____语，时如人心之绪，缥缈多变&quot;：强调&quot;多变、丰富&quot;。</li><li>&quot;繁复&quot;＝繁琐复杂，带一点贬义；&quot;丰富&quot;＝种类多、变化多，中性偏褒。描述天籁般的琴韵用&quot;丰富&quot;更好。</li></ul><p>三个空合起来选 B（旷远、清冷、丰富）。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第二空&quot;入仙↔清冷（高冷、空灵）&quot;是核心，&quot;萧瑟&quot;带悲凉一下就排掉。&quot;幽/渺&quot;是&quot;词义超了&quot;又一个实例——原文只写&quot;远&quot;，你填&quot;幽远/渺远&quot;就多塞了&quot;幽静/缥缈&quot;进去。</span></div>"}, {"q_num": 13, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>第一空&quot;通过数码方式，把文字图片信息____到以光电磁为介质的设备中&quot;。</p><ul><li>A&quot;记忆&quot;：一般说&quot;人脑/大脑记忆&quot;，主语对应能力是&quot;人&quot;，不能&quot;通过数码方式记忆到设备里&quot;，排除。</li><li>剩下 B&quot;存储&quot;、C&quot;保存&quot;、D&quot;记录&quot;都能表&quot;存进去&quot;，先留。</li></ul><p>第二空&quot;再借助____的设备来读取、复制和传输&quot;。用小技巧：第二空有时能跟前文或常理呼应。</p><ul><li>&quot;特定&quot;＝针对性的（哪类信息配哪类设备），而&quot;专门（专用）&quot;其实也接近，但看 A 第一空已排，B/C/D 里：</li><li>&quot;先进&quot;不行——文段没说要&quot;技术先进&quot;才能读，排除。</li><li>&quot;固定&quot;＝不变、不能换。但文段没要求&quot;读的设备一成不变&quot;，只要求&quot;能读&quot;，排除。</li></ul><p>所以第二空&quot;特定&quot;（明确的、针对性的）最顺，选 D。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第一空靠&quot;主体&quot;排 A（记忆的主体是人脑，不是&quot;数码方式&quot;）；第二空靠&quot;文段没强加的条件&quot;排&quot;先进（没讲技术先进）、固定（没讲不能换）&quot;。别给原文加没有的前提条件。</span></div>"}, {"q_num": 14, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>题眼&quot;这个&#x27;舶来品&#x27;的故事，____了中国老百姓&#x27;老婆孩子热炕头&#x27;的淳朴理想&quot;。</p><ul><li>核心是&quot;舶来品&quot;（外国引进的）和&quot;中国老百理想&quot;居然<strong>不谋而合</strong>——这是&quot;无意中碰巧一致&quot;，不是刻意设计。</li></ul><ul><li>A&quot;迎合&quot;：知道对方喜好后<strong>刻意去迁就、讨好</strong>。小猪佩奇是外国产品，不可能&quot;早知道中国理想再去迎合&quot;，排除。</li><li>B&quot;暗合&quot;：没有商量、没有刻意，暗中恰好一致。正是&quot;舶来品故事竟然和中国理想相通&quot;的&quot;巧&quot;，选 B。</li><li>C&quot;符合&quot;：只是客观&quot;相合&quot;，缺了&quot;暗中、无意&quot;这层意思，能用但不如 B 精准。</li><li>D&quot;吻合&quot;：完全一致、严丝合缝。其实两个理想只是&quot;大体相近&quot;不是&quot;完全一样&quot;，程度过重，排除。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">四个都带&quot;合&quot;义，考的是<strong>这&quot;合&quot;前面的限定</strong>：迎合＝刻意讨好，暗合＝无意巧合，符合＝客观相合，吻合＝完全一致。抓准&quot;舶来品（外来的）竟然一致&quot;这种&quot;巧&quot;，就选&quot;暗合&quot;。</span></div>"}, {"q_num": 15, "type": "逻辑填空", "answer": "C", "analysis_html": "<p>这题四空都考&quot;人等形象词&quot;，逐个对着原文找呼应。</p><p>第一空&quot;做起而行之的____&quot;——&quot;起而行之&quot;＝行动、实干。</p><ul><li>A&quot;探索家&quot;（探索未知）、D&quot;搏击者&quot;（抗争搏斗）都偏离&quot;实干&quot;，排除；B&quot;实践家&quot;、C&quot;行动者&quot;都可用，先留。</li></ul><p>第二空&quot;做坐而论道的____&quot;——&quot;坐而论道&quot;＝空谈、不做实事。</p><ul><li>B&quot;理论家&quot;＝研究理论的（中性，不一定是&quot;只说不做&quot;，而且理论家也有贬义外的褒义用法）；C&quot;清谈客&quot;＝只空谈、不干实事，&quot;清谈&quot;正好对应&quot;坐而论道&quot;。C 更准。</li></ul><p>第三空&quot;当攻坚克难的____&quot;——攻坚克难＝迎难而上、拼搏。</p><ul><li>B&quot;领跑者&quot;（走在前面、引领）跟&quot;攻坚&quot;没必然关系；C&quot;奋斗者&quot;（拼搏奋斗）正对应&quot;迎难而上、攻坚&quot;。</li></ul><p>第四空&quot;不当怕见风雨的____&quot;——怕风雨、自身难保。</p><ul><li>A&quot;纸老虎&quot;（外强中干）、B&quot;墙头草&quot;（立场摇摆）、D&quot;井底蛙&quot;（见识短浅）都不关&quot;怕风雨&quot;；C&quot;泥菩萨&quot;——&quot;泥菩萨过江，自身难保&quot;，泥做的，最怕水风雨，秒对。</li></ul><p>选 C。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">成语/熟语类填空，不认识某一空就先放着，从<strong>认识的那一空</strong>下手锁答案（第 3、4 空&quot;奋斗者&quot;&quot;泥菩萨&quot;很直白，锁定 C），再用剩下的验证，别纠结在不认识的词上。</span></div>"}, {"q_num": 16, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;缩小裁量空间，____裁量的随意性&quot;——要把随意性<strong>压下去、变小</strong>。</p><ul><li>A&quot;遏止&quot;（止＝彻底停止、根除）、和它近义的&quot;遏制&quot;都很重，一般指把坏东西彻底消灭。但&quot;随意性&quot;很难&quot;根除、彻底没有&quot;，只能&quot;抑制、约束&quot;（把握好、减少），A 过重，排除。</li><li>C&quot;抵消&quot;＝两股力量对冲；这里没有&quot;两个力量&quot;，只说把随意性压下去，排除。</li><li>B&quot;抑制&quot;、D&quot;约束&quot;都能讲，先留。</li></ul><p>第二空&quot;做到过罚相当、____&quot;——顿号并列，&quot;过罚相当&quot;＝处罚轻重和过错匹配。</p><ul><li>B&quot;宽严相济&quot;：该宽则宽、该严则严，宽严配合，正好和&quot;过罚相当（轻重得当）&quot;同义并列。</li><li>D&quot;赏罚分明&quot;：奖励和处罚要分清。但这里是<strong>行政处罚</strong>，只有&quot;罚&quot;、没有&quot;赏&quot;，谈不到&quot;赏罚&quot;，排除。</li></ul><p>选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;遏止/遏制&quot;都偏重、表&quot;消灭&quot;，而题干是&quot;缩小、增强可操作性&quot;这种&quot;适度控制&quot;，用&quot;抑制/约束&quot;。&quot;宽严相济&quot;配&quot;过罚相当&quot;（都是&quot;罚&quot;内部的轻重得当），&quot;赏罚分明&quot;多出&quot;赏&quot;不适用。</span></div>"}, {"q_num": 17, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空是题眼：&quot;熟人社会正受冲击，商业社会带来新房客，也逐渐____着传统的邻里关系&quot;。</p><ul><li>熟人社会以前邻里&quot;熟、走动多&quot;，现在冲击了，关系是<strong>变淡了、陌生了</strong>（不是消失、不是有的人生疏）。</li></ul><ul><li>B&quot;稀释&quot;：降低浓度、变淡，正好对应&quot;关系变淡、走动变少&quot;，非常贴。</li><li>A&quot;消解&quot;：消除、化解，程度太重——邻里关系&quot;消失&quot;了吗？没有，只是&quot;受冲击、变淡&quot;，排除。</li><li>C&quot;分化&quot;：一个整体分裂成不同部分，文段没有&quot;分裂成几块&quot;的意思，排除。</li><li>D&quot;离散&quot;：人分散、分离，搭配&quot;人离散&quot;可以，但&quot;关系离散&quot;主语配不上，排除。</li></ul><p>第二空&quot;从有机连接的邻里到鲜有往来的____生存&quot;——&quot;原子化&quot;＝个体孤立、缺少社会纽带，正对应&quot;各过各的、互不往来&quot;。</p><p>选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这题正确率很低，但第一空其实有明确做题空间：&quot;关系变淡&quot;＝&quot;稀释&quot;（不是消失→排消解）。面对&quot;原子化&quot;这种不认识的词，别慌着用它去辨析，先靠你<strong>确定认识</strong>的第一空锁答案（我见过很多同学因为不认识原子化而不敢选 B，硬去别的选项里凑，方向就错了）。</span></div>"}, {"q_num": 18, "type": "逻辑填空", "answer": "D", "analysis_html": "<p>题目&quot;屋漏痕&quot;，用破屋雨水的痕迹作比，讲运笔。</p><p>第一空&quot;运笔不能____，这样会显得太过滑腻而没有力道，必须如屋漏痕般<strong>缓缓</strong>流下&quot;。</p><ul><li>前句&quot;不能____&quot;和后句&quot;必须缓缓&quot;反向对应：不能<strong>快</strong>（一泻而下），要慢（缓缓）。且前面比喻的是&quot;雨水/水流&quot;，空要跟&quot;水&quot;呼应。</li><li>A&quot;一笔到底&quot;（跟水无关）、C&quot;犹豫不决&quot;（说人犹豫）都跟&quot;水&quot;没关系，排除。</li><li>B&quot;飞流直下&quot;＝瀑布（&quot;飞流直下三千尺&quot;），形容瀑布那种极夸张的垂直大流；破屋雨水不是瀑布，程度太重，排除。</li><li>D&quot;一泻而下&quot;＝水流迅速倾泻，正好对应&quot;水&quot;＋&quot;快（不缓）&quot;＋程度适中，选 D。</li></ul><p>第二空验证&quot;看似不露锋芒，却能达到____而不涩滞&quot;——&quot;力透纸背&quot;＝书法有力、笔力入木三分，正对&quot;不露锋芒却有力度&quot;。选 D。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">这题抓两个对应：①&quot;不能快↔缓缓&quot;反义对应；②整段都用&quot;水&quot;作比，空要带&quot;水&quot;的意象（一笔到底、犹豫不决先排）。&quot;飞流直下&quot;是瀑布专属、程度过重，选一般性的&quot;一泻而下&quot;。</span></div>"}, {"q_num": 19, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第一空&quot;恐龙的覆灭，让我们深刻____到自然界的残酷无情&quot;。</p><ul><li>D&quot;体验&quot;＝亲身经历。我们没经历过恐龙灭绝（是考古认知出来的），排除 D。</li><li>A&quot;意识到&quot;、B&quot;领悟到&quot;、C&quot;认识到&quot;都可用，先留。</li></ul><p>第二空&quot;这样可怕的物种灭绝，实在让人____&quot;——是&quot;让人害怕、惊惧&quot;。</p><ul><li>A&quot;惴惴不安&quot;：内心<strong>担忧、忐忑</strong>，是对<strong>未来</strong>的不安（担心考试、担心将来）。这里不是&quot;担心未来会灭绝&quot;，只是&quot;被这种可怕的事震惊、害怕&quot;，且&quot;不安&quot;程度太轻，排除。</li><li>C&quot;望而生畏&quot;：看见了才害怕。但我们没&quot;亲眼看见&quot;灭绝（是考古得知的历史），排除。</li><li>B&quot;不寒而栗&quot;：带上一个&quot;栗（打颤）&quot;，是强烈的恐惧，正是&quot;这么可怕的灭绝让人害怕&quot;，比&quot;惴惴不安&quot;重得多，选 B。</li></ul><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">&quot;望而生畏&quot;必须先&quot;看到&quot;才畏，这里没看到→排；&quot;惴惴不安&quot;是对<strong>未来的担忧+程度轻</strong>，这里只是&quot;事发后的震惊恐惧&quot;→排；&quot;不寒而栗&quot;（恐惧到打颤）最重、最贴</span></div>"}, {"q_num": 20, "type": "逻辑填空", "answer": "B", "analysis_html": "<p>第二空是题眼：&quot;&#x27;趣&#x27;是很高的美学范畴，不是说哈哈一笑之后____&quot;。</p><ul><li>意思是：儿童文学不能光让人&quot;哈哈一笑&quot;就完了、笑完什么收获都没有，还要传达理想、境界。</li></ul><ul><li>B&quot;空无一物&quot;：笑完之后什么都没有、零收获，正好。</li><li>A&quot;云淡风轻&quot;：心态超脱、不放在心上，跟&quot;笑完没收获&quot;无关，排除。</li><li>C&quot;烟消云散&quot;：烦恼、情绪消散。但&quot;消散&quot;要有<strong>对象</strong>（什么东西散了？）——这里只是&quot;除了笑，别的啥也没获得&quot;，没有&quot;某物消散&quot;的对象，排除。</li><li>D&quot;别无长物&quot;：形容人<strong>贫穷</strong>、身无长物，跟语境毫无关系，排除。</li></ul><p>第一空&quot;不仅带来快乐，还关乎心灵的____和人格的完善&quot;——&quot;净化（让心灵更纯净美好）&quot;最贴，&quot;纯净/美化/洗涤&quot;不如&quot;净化&quot;准确（心灵&quot;净化&quot;是标准搭配）。选 B。</p><div class=\"tip-box tip-技巧\"><span class=\"tip-label\">技巧</span><span class=\"tip-body\">第二空抓&quot;笑完之后零收获&quot;→&quot;空无一物&quot;。&quot;烟消云散&quot;必须有个&quot;消散的东西&quot;作对象，这里没有（&quot;你笑完啥也没获得&quot;≠&quot;有东西消散了&quot;），这是它的坑。</span></div>"}]}]};
let curSet=-1, curQ=0, isAnim=false;
const sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay'),
sidebarContent=document.getElementById('sidebar-content'),slideContainer=document.getElementById('slide-container'),
breadcrumb=document.getElementById('breadcrumb'),navDots=document.getElementById('nav-dots'),
prevBtn=document.getElementById('prev-btn'),nextBtn=document.getElementById('next-btn'),
contentArea=document.getElementById('content-area');

function initSidebar(){
  sidebarContent.innerHTML='';
  appData.sets.forEach((set,si)=>{
    const item=document.createElement('div');
    const sbtn=document.createElement('button');
    sbtn.className='set-button';
    sbtn.innerHTML='<span>'+set.set_name+'</span><span class="set-arrow">▶</span>';
    sbtn.onclick=e=>{e.stopPropagation();toggleSet(si);};
    const ql=document.createElement('div');
    ql.className='question-list';ql.id='qlist-'+si;
    set.questions.forEach((q,qi)=>{
      const b=document.createElement('button');
      b.className='q-btn'+(q.analysis_html?' done':'');
      b.textContent=q.q_num;
      b.onclick=e=>{e.stopPropagation();selectQuestion(si,qi);if(innerWidth<=768)closeSidebar();};
      ql.appendChild(b);
    });
    item.appendChild(sbtn);item.appendChild(ql);sidebarContent.appendChild(item);
  });
}
function toggleSet(si){
  const ql=document.getElementById('qlist-'+si),sbtn=ql.previousElementSibling,sh=ql.classList.contains('show');
  document.querySelectorAll('.question-list.show').forEach(el=>{el.classList.remove('show');el.previousElementSibling.classList.remove('expanded');});
  if(!sh){ql.classList.add('show');sbtn.classList.add('expanded');}
}
function renderCard(q){
  if(q.analysis_html){
    return '<div class="card"><div class="card-head"><div class="meta">'
      +'<span class="badge badge-num">第 '+q.q_num+' 题</span>'
      +'<span class="badge badge-success">答案 '+q.answer+'</span>'
      +'<span class="badge badge-primary">'+q.type+'</span>'
      +'</div></div><div class="card-body">'+q.analysis_html+'</div></div>';
  }
  return '<div class="card"><div class="card-head"><div class="meta">'
    +'<span class="badge badge-num">第 '+q.q_num+' 题</span>'
    +'<span class="badge badge-success">答案 '+q.answer+'</span>'
    +'<span class="badge badge-primary">'+q.type+'</span>'
    +'</div></div><div class="card-body"><div class="empty-state"><div class="big">📝</div><p>解析待校正</p></div></div></div>';
}
function renderSlides(){
  const set=appData.sets[curSet];slideContainer.innerHTML='';
  set.questions.forEach(q=>{const s=document.createElement('div');s.className='slide';s.innerHTML=renderCard(q);slideContainer.appendChild(s);});
}
function slideTo(qi,animate=true){
  curQ=qi;
  slideContainer.style.transition=animate?'transform .3s ease':'none';
  slideContainer.style.transform='translateX(-'+(qi*100)+'%)';
  if(animate){isAnim=true;setTimeout(()=>isAnim=false,300);}
  updateNavDots();updateNavButtons();updateSidebarActive();
}
function selectQuestion(si,qi){
  if(isAnim)return;
  document.querySelectorAll('.set-button').forEach((b,i)=>b.classList.toggle('active',i===si));
  document.querySelectorAll('.q-btn').forEach(b=>b.classList.remove('active'));
  const ql=document.getElementById('qlist-'+si);
  document.querySelectorAll('.question-list.show').forEach(el=>el.classList.remove('show'));
  document.querySelectorAll('.set-button.expanded').forEach(el=>el.classList.remove('expanded'));
  if(ql){ql.classList.add('show');ql.previousElementSibling.classList.add('expanded');ql.children[qi].classList.add('active');}
  if(si===curSet){slideTo(qi);}
  else{curSet=si;curQ=qi;renderSlides();breadcrumb.innerHTML='<strong>'+appData.sets[si].set_name+'</strong> <span style="color:var(--text2)">/ 共 '+appData.sets[si].questions.length+' 题</span>';slideTo(qi,false);}
}
function updateNavDots(){
  if(curSet<0)return;const set=appData.sets[curSet];navDots.innerHTML='';
  set.questions.forEach((q,i)=>{const d=document.createElement('div');
    d.className='nav-dot'+(i===curQ?' active':'')+(q.analysis_html?' has-content':'');
    d.onclick=()=>selectQuestion(curSet,i);navDots.appendChild(d);});
}
function updateNavButtons(){
  if(curSet<0){prevBtn.disabled=true;nextBtn.disabled=true;return;}
  prevBtn.disabled=curQ===0;nextBtn.disabled=curQ===appData.sets[curSet].questions.length-1;
}
function updateSidebarActive(){
  document.querySelectorAll('.q-btn').forEach(b=>b.classList.remove('active'));
  const ql=document.getElementById('qlist-'+curSet);
  if(ql&&ql.children[curQ]){ql.children[curQ].classList.add('active');ql.children[curQ].scrollIntoView({block:'nearest'});}
}
function prevQuestion(){if(curSet<0||curQ<=0)return;selectQuestion(curSet,curQ-1);}
function nextQuestion(){if(curSet<0)return;if(curQ>=appData.sets[curSet].questions.length-1)return;selectQuestion(curSet,curQ+1);}
function openSidebar(){sidebar.classList.add('open');overlay.classList.add('show');}
function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prevQuestion();if(e.key==='ArrowRight')nextQuestion();});
let tsx=0,tex=0;
contentArea.addEventListener('touchstart',e=>{tsx=e.changedTouches[0].screenX;},{passive:true});
contentArea.addEventListener('touchend',e=>{tex=e.changedTouches[0].screenX;const d=tsx-tex;if(Math.abs(d)<50)return;d>0?nextQuestion():prevQuestion();},{passive:true});
initSidebar();
if(appData.sets.length>0)selectQuestion(0,0);
</script>
</body>
</html>
